"py\">dì èr shí wǔ dào èr shí qī tí</span>第25–27题：根据部件组字。","<span class=\"py\">shén me</span>例：什么","<b>Ví dụ đáp án:</b> D · 十"],"28":["","<span class=\"py\">dì èr bù fen</span>第二部分 Part 2","<span class=\"py\">dì èr shí bā dào sān shí tí</span>第28–30题：根据拼音写汉字。","<span class=\"py\">nǐ xiǎng hē chá hái shì hē kā fēi</span>例：你想喝茶还（是）喝咖啡？","<b>Ví dụ đáp án:</b> 是"]};
function sharedSet(n){if(n>=4&&n<=6)return{id:'46',items:shuffle(bank46,1400+attempt*97)};if(n>=11&&n<=13)return{id:'1113',items:shuffle(bank1113,2400+attempt*97)};return null}
function renderSharedBank(set){return '<div class="shared-bank" data-bank="'+set.id+'">'+set.items.map((o,i)=>'<div class="bank-item" data-id="'+o.id+'"><span class="letter">'+letter(i)+'</span><img src="'+o.img+'" alt="Hình '+letter(i)+'"></div>').join('')+'</div>'}
function renderListenExample(){let items=shuffle(exListen,900+attempt*97),k=items.findIndex(x=>x.id==='exbus');return '<div class="example-bank">'+items.map((o,i)=>'<div class="example-img '+(o.id==='exbus'?'correct':'')+'"><span class="letter">'+letter(i)+'</span><img src="'+o.img+'" alt="'+o.text+'">'+(o.id==='exbus'?'<span class="tick">✓</span>':'')+'</div>').join('')+'</div><div class="example-answer">Đáp án ví dụ: '+letter(k)+' · 公交车</div>'}
function matchOrder(){return shuffle(bank1821,3400+attempt*97)}
function renderMatchBoard(){let items=matchOrder(),left=qs.filter(x=>x.n>=18&&x.n<=21);return '<div class="match-board"><div class="match-help">Chọn một câu bên trái, sau đó chọn câu trả lời phù hợp bên phải. Nhấn lại cùng đáp án để bỏ ghép.</div><div class="match-col"><div class="match-title">Câu hỏi 18–21</div>'+left.map(q=>{let idx=items.findIndex(o=>o.id===answers[q.n]);return '<div class="match-left '+(answers[q.n]?'answered ':'')+(activeMatch===q.n?'active':'')+'" id="q'+q.n+'" data-match-q="'+q.n+'"><span class="match-no">'+q.n+'.</span>'+q.prompt+(idx>=0?'<span class="match-badge">'+letter(idx)+'</span>':'')+'<div class="feedback match-feedback" id="fb'+q.n+'"></div></div>'}).join('')+'</div><div class="match-col"><div class="match-title">Câu trả lời A–D</div>'+items.map((o,i)=>'<div class="match-right '+(Object.values(answers).includes(o.id)?'used':'')+'" data-match-id="'+o.id+'"><span class="py">'+(o.py||'')+'</span><b>'+letter(i)+'.</b> <span class="hanzi">'+o.text+'</span></div>').join('')+'</div></div>'}
function render(){let html='',sectionOpen=false;qs.forEach(q=>{if(intros[q.n]){let[sec,part,ins,ex,exa]=intros[q.n];if(sec){if(sectionOpen)html+='</section>';html+='<section class="section"><h2>'+sec+'</h2>';sectionOpen=true}html+='<div class="part"><h3>'+part+'</h3><div class="instruction">'+ins+'</div><div class="example"><b>例 · Ví dụ (không tính điểm)</b><div>'+ex+'</div><div>'+exa+'</div>'+(q.n===1?renderListenExample():'')+'</div>';if(q.n===4||q.n===11)html+=renderSharedBank(sharedSet(q.n))}if(q.n===18){html+=renderMatchBoard();return}if(q.n>=19&&q.n<=21){if(q.n===21)html+='</div>';return}let shared=sharedSet(q.n),choices=shared?shared.items:shuffle(q.opts,1000+attempt*97+q.n*13);html+='<article class="q" id="q'+q.n+'"><div class="qhead"><span>Câu '+q.n+'</span><button class="flag" data-flag="'+q.n+'">☆ Đánh dấu</button></div><div class="prompt">'+q.prompt+'</div>';if(q.kind==='text')html+='<input class="text-answer" data-text="'+q.n+'" autocomplete="off" placeholder="Nhập 1 chữ Hán">';else{html+='<div class="'+(shared?'mini-choices':'choices '+(choices.length===4?'two':''))+'">';choices.forEach((o,i)=>{let sel=answers[q.n]===o.id?' selected':'';html+='<div class="choice '+(!shared&&o.img?'image-choice ':'')+sel+'" data-q="'+q.n+'" data-id="'+o.id+'"><span class="letter">'+letter(i)+'</span>'+(!shared?'<div class="ct">'+(o.img?'<img src="'+o.img+'" alt="Lựa chọn '+letter(i)+'">':'<span class="py">'+(o.py||'')+'</span><span class="hanzi">'+o.text+'</span>')+'</div>':'')+'</div>'});html+='</div>'}html+='<div class="feedback" id="fb'+q.n+'"></div></article>';if([3,6,10,13,17,21,24,27,30].includes(q.n))html+='</div>'});if(sectionOpen)html+='</section>';document.querySelector('#exam').innerHTML=html;bind();update()}
function bind(){document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(submitted)return;answers[el.dataset.q]=el.dataset.id;document.querySelectorAll('[data-q="'+el.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');update()});document.querySelectorAll('[data-text]').forEach(el=>{el.value=answers[el.dataset.text]||'';el.oninput=()=>{answers[el.dataset.text]=el.value.trim();update()}});document.querySelectorAll('[data-flag]').forEach(el=>el.onclick=()=>{let n=+el.dataset.flag;marked.has(n)?marked.delete(n):marked.add(n);update()});document.querySelectorAll('[data-match-q]').forEach(el=>el.onclick=()=>{if(submitted)return;activeMatch=+el.dataset.matchQ;render()});document.querySelectorAll('[data-match-id]').forEach(el=>el.onclick=()=>{if(submitted||!activeMatch)return;let id=el.dataset.matchId;if(answers[activeMatch]===id)delete answers[activeMatch];else{for(let n=18;n<=21;n++)if(answers[n]===id)delete answers[n];answers[activeMatch]=id}activeMatch=null;render()})}
function update(){let done=Object.values(answers).filter(Boolean).length;count.textContent=done+'/30';ring.style.setProperty('--pct',(done/30*100)+'%');let html='';groups.forEach(g=>{html+='<div class="nav-group">'+g[0]+'</div><div class="nav">';for(let n=g[1];n<=g[2];n++)html+='<a href="#q'+n+'" class="'+(marked.has(n)?'marked':answers[n]?'done':'')+'">'+n+'</a>';html+='</div>'});nav.innerHTML=html;document.body.classList.toggle('hide-pinyin',!pinyin)}
function submitExam(auto=false){if(submitted)return;submitted=true;clearInterval(tick);let score=0,blank=0;qs.forEach(q=>{let ans=(answers[q.n]||'').trim(),ok=ans===q.correct;if(ok)score++;if(!ans)blank++;let opt=q.opts.find(o=>o.id===q.correct),correct=q.kind==='text'?q.correct:(opt?.text||('Hình '+(document.querySelector('[data-q="'+q.n+'"][data-id="'+q.correct+'"] .letter')?.textContent||'')));let fb=document.querySelector('#fb'+q.n);fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=(ok?'✓ Chính xác':(ans?'✕ Chưa chính xác':'○ Câu chưa trả lời'))+'<br><b>Đáp án đúng:</b> '+correct+'<br><span>'+q.explain+'</span>'});document.body.classList.add('submitted');document.querySelectorAll('input').forEach(x=>x.disabled=true);let pct=Math.round(score/30*100),ten=(score/3).toFixed(1);summary.innerHTML='<h2>Kết quả '+(auto?'· Hết giờ, bài đã tự nộp':'')+'</h2><b>'+score+'/30 câu đúng · '+ten+'/10 · '+pct+'%</b><br>Câu chưa trả lời: '+blank;summary.scrollIntoView({behavior:'smooth'})}
function resetExam(){attempt++;answers={};marked=new Set();activeMatch=null;submitted=false;left=2400;document.body.classList.remove('submitted');summary.innerHTML='';start();render();toastMsg('Lượt '+(attempt+1)+': vị trí đáp án đã được xoay')}
function start(){clearInterval(tick);tick=setInterval(()=>{left--;paintTime();if(left<=0)submitExam(true)},1000);paintTime()}function paintTime(){timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function toastMsg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)}
pin.onclick=()=>{pinyin=!pinyin;pin.textContent=pinyin?'拼 Pinyin: Ẩn':'拼 Pinyin: Mở';update()};pause.onclick=()=>{if(tick){clearInterval(tick);tick=null;pause.textContent='▶'}else{start();pause.textContent='Ⅱ'}};submit.onclick=()=>submitExam(false);reset.onclick=resetExam;nextBlank.onclick=()=>{let q=qs.find(x=>!answers[x.n]);if(q)document.querySelector('#q'+q.n).scrollIntoView({behavior:'smooth'});else toastMsg('Bạn đã trả lời đủ 30 câu')};render();start();
</script><script data-ngocthucac-sbt-hsk2-bridge>
(function(){'use strict';let sent='';function val(name){try{return eval(name)}catch(_){return undefined}}function normText(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()}function send(){try{if(val('submitted')!==true)return;const list=val('questions')||val('qs');const ans=val('answers');if(!Array.isArray(list)||!ans)return;const rows=list.map(q=>{const n=Number(q.number??q.n);const correct=q.correctId??q.correct;const got=ans[n];let items=[];try{items=q.type==='bank'&&typeof bankItems==='function'?bankItems(q.bank):q.type==='component'&&typeof componentBank!=='undefined'?componentBank:(q.options||q.opts||[])}catch(_){items=q.options||q.opts||[]}const label=id=>normText((items.find(x=>String(x.id)===String(id))||{}).text||id||'Chưa trả lời');const isText=q.type==='input'||q.kind==='text';const ok=isText?(typeof norm==='function'?norm(got)===norm(correct):normText(got)===normText(correct)):String(got??'')===String(correct??'');return{n,ok,detail:{question_number:n,question_text:normText(q.title||q.text||'').slice(0,700),student_answer:isText?normText(got)||'Chưa trả lời':label(got),correct_answer:isText?normText(correct):label(correct),explanation:normText(q.explain||'Đối chiếu đáp án đúng của bài.')}}}).filter(x=>Number.isInteger(x.n));if(!rows.length)return;const wrongAnswers=rows.filter(x=>!x.ok).map(x=>x.detail);const correct=rows.length-wrongAnswers.length;const signature=correct+'|'+rows.length+'|'+wrongAnswers.map(x=>x.question_number).join(',');if(signature===sent)return;sent=signature;window.parent.postMessage({type:'learningResult',payload:{correct,total:rows.length,score:Math.round(correct/rows.length*100),exerciseName:'Sách BT HSK2 · Bài 14',lessonTitle:'Bài 14',attemptReview:{level:'HSK2',wrong_count:wrongAnswers.length,wrong_answers:wrongAnswers}}},'*')}catch(e){}}document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#submitBtn,#forceBtn,#submit,.side-submit')){setTimeout(send,80);setTimeout(send,450)}},true);const observer=new MutationObserver(()=>setTimeout(send,60));observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});})();
