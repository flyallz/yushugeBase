 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b));document.querySelectorAll('[data-input]').forEach(i=>i.oninput=()=>{answers[i.dataset.input]=i.value.trim();updateProgress()});document.querySelectorAll('[data-match-q]').forEach(el=>el.onclick=()=>{if(submitted)return;activeMatch=+el.dataset.matchQ;render()});document.querySelectorAll('[data-match-id]').forEach(el=>el.onclick=()=>{if(submitted||!activeMatch)return;let id=el.dataset.matchId;if(answers[activeMatch]===id)delete answers[activeMatch];else{for(let n=18;n<=21;n++)if(answers[n]===id)delete answers[n];answers[activeMatch]=id}activeMatch=null;render()});restoreAnswers();updateProgress()}

function updateProgress(){const groups=[['听力 第一部分 · Câu 1–3',1,3],['听力 第二部分 · Câu 4–6',4,6],['听力 第三部分 · Câu 7–10',7,10],['阅读 第一部分 · Câu 11–13',11,13],['阅读 第二部分 · Câu 14–17',14,17],['阅读 第三部分 · Câu 18–21',18,21],['阅读 第四部分 · Câu 22–24',22,24],['书写 · Câu 25–30',25,30]];byId('progress').innerHTML=groups.map(g=>`<div class="progress-group"><div>${g[0]}</div><section>${questions.filter(q=>q.number>=g[1]&&q.number<=g[2]).map(q=>`<button class="dot ${answers[q.number]?'done':''}" data-dot="${q.number}">${q.number}</button>`).join('')}</section></div>`).join('');let done=questions.filter(q=>answers[q.number]).length;byId('progressCount').textContent=`${done}/30`;byId('progressRing').style.setProperty('--pct',done/30*360+'deg');document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>byId('q'+b.dataset.dot).scrollIntoView({behavior:'smooth'}))}

(function(){'use strict';let sent='';function val(name){try{return eval(name)}catch(_){return undefined}}function normText(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()}function send(){try{if(val('submitted')!==true)return;const list=val('questions')||val('qs');const ans=val('answers');if(!Array.isArray(list)||!ans)return;const rows=list.map(q=>{const n=Number(q.number??q.n);const correct=q.correctId??q.correct;const got=ans[n];let items=[];try{items=q.type==='bank'&&typeof bankItems==='function'?bankItems(q.bank):q.type==='component'&&typeof componentBank!=='undefined'?componentBank:(q.options||q.opts||[])}catch(_){items=q.options||q.opts||[]}const label=id=>normText((items.find(x=>String(x.id)===String(id))||{}).text||id||'Chưa trả lời');const isText=q.type==='input'||q.kind==='text';const ok=isText?(typeof norm==='function'?norm(got)===norm(correct):normText(got)===normText(correct)):String(got??'')===String(correct??'');return{n,ok,detail:{question_number:n,question_text:normText(q.title||q.text||'').slice(0,700),student_answer:isText?normText(got)||'Chưa trả lời':label(got),correct_answer:isText?normText(correct):label(correct),explanation:normText(q.explain||'Đối chiếu đáp án đúng của bài.')}}}).filter(x=>Number.isInteger(x.n));if(!rows.length)return;const wrongAnswers=rows.filter(x=>!x.ok).map(x=>x.detail);const correct=rows.length-wrongAnswers.length;const signature=correct+'|'+rows.length+'|'+wrongAnswers.map(x=>x.question_number).join(',');if(signature===sent)return;sent=signature;window.parent.postMessage({type:'learningResult',payload:{correct,total:rows.length,score:Math.round(correct/rows.length*100),exerciseName:'Sách BT HSK2 · Bài 1',lessonTitle:'Bài 1',attemptReview:{level:'HSK2',wrong_count:wrongAnswers.length,wrong_answers:wrongAnswers}}},'*')}catch(e){}}document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#submitBtn,#forceBtn,#submit,.side-submit')){setTimeout(send,80);setTimeout(send,450)}},true);const observer=new MutationObserver(()=>setTimeout(send,60));observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});})();
