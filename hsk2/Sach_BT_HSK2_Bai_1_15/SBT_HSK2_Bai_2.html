function renderQuestion(q){let items=q.type==='bank'?bankItems(q.bank):q.type==='component'?componentBank:q.options||[];let ord=items.length?ordered(items,q.type==='component'?25:q.number):[];let control=q.type==='input'?`<input class="fill" data-input="${q.number}" aria-label="Câu ${q.number}">`:(q.type==='component'||q.type==='bank')?`<div class="component-choices">${ord.map((o,i)=>`<button class="opt" data-q="${q.number}" data-id="${o.id}" type="button" aria-label="Chọn ${letters[i]}"><span class="letter">${letters[i]}</span></button>`).join('')}</div>`:`<div class="${q.type==='bank'?'bank '+(items.length===4?'four':''):'options'}">${ord.map((o,i)=>optionHtml(o,i,q)).join('')}</div>`;let head=q.img?`${q.pinyin?`<div class="pinyin">${q.pinyin}</div>`:''}<img class="qimg" src="${q.img}" alt="${q.title}">`:pairedText(q.title,q.pinyin);return `<article class="question" id="q${q.number}"><div class="qhead"><span class="num">${q.number}</span><div>${head}</div></div>${control}<div class="feedback"></div></article>`}

function renderMatchBoard(items){let left=questions.filter(q=>q.number>=18&&q.number<=21);return `<div class="match-board"><div class="match-help">Chọn một câu bên trái, sau đó chọn câu trả lời phù hợp bên phải.</div><div class="match-col"><div class="match-title">Câu hỏi 18–21</div>${left.map(q=>{let i=items.findIndex(o=>o.id===answers[q.number]);return `<article class="question match-left${activeMatch===q.number?' active':''}${answers[q.number]?' answered':''}" id="q${q.number}" data-match-q="${q.number}"><span class="match-no">${q.number}.</span><span class="match-copy"><span class="hanzi">${rubyText(q.title,q.pinyin)}</span></span>${i>=0?`<span class="match-badge">${letters[i]}</span>`:''}<div class="feedback match-feedback"></div></article>`}).join('')}</div><div class="match-col"><div class="match-title">Câu trả lời A–D</div>${items.map((o,i)=>`<button class="match-right${Object.values(answers).includes(o.id)?' used':''}" type="button" data-match-id="${o.id}"><span class="match-letter">${letters[i]}</span><span class="match-copy"><span class="hanzi">${rubyText(o.text,o.py)}</span></span></button>`).join('')}</div></div>`}
function componentBankHtml(){return `<div class="component-bank">${ordered(componentBank,25).map((o,i)=>`<div class="component-item"><span class="letter">${letters[i]}</span><span class="pinyin component-pinyin">${o.py||''}</span><span class="writing">${o.text}</span></div>`).join('')}</div>`}

const exampleImages={"bus":"assets/shared/172872bcb3c9e1d86189.png","plane":"assets/shared/9ac79bc5a4f3b70e35c7.png","bike":"assets/shared/0b2545f9902d5ff9e118.png"};
const busExampleBank=[O('exampleBus','Xe buýt',exampleImages.bus),O('examplePlane','Máy bay',exampleImages.plane),O('exampleBike','Xe đạp',exampleImages.bike)];
function imageExample(title,items,correct,key){const order=ordered(items,key);return '<div class="example"><b>例 · Ví dụ mẫu</b><div class="note">Không tính điểm</div><div>'+title+'</div><div class="example-pictures">'+order.map((o,i)=>'<div class="example-picture '+(o.id===correct?'example-correct':'')+'"><span class="letter">'+letters[i]+'</span><img src="'+o.img+'" alt="'+o.text+'">'+(o.id===correct?'<span class="example-tick">✓</span>':'')+'</div>').join('')+'</div><strong>Đáp án mẫu: '+letters[order.findIndex(o=>o.id===correct)]+'</strong></div>'}

function textExample(t,p,answer){return example(pairedText(t,p),answer)}
function render(){const qs=(a,b)=>questions.filter(q=>q.number>=a&&q.number<=b).map(renderQuestion).join('');
byId('listen').innerHTML=`<h3>第一部分 · Phần 1 · Câu 1–3</h3><p>听一句话，选择正确图片。每题听两次。</p>${imageExample(pairedText('我每天坐公交车去上班。','Wǒ měi tiān zuò gōng jiāo chē qù shàng bān'),busExampleBank,'exampleBus',0)}${qs(1,3)}<h3>第二部分 · Phần 2 · Câu 4–6</h3><p>Nghe hội thoại và chọn ảnh phù hợp. Dùng chung bốn ảnh dưới đây.</p>${imageExample(pairedText('男：你喜欢什么运动？\n女：我最喜欢踢足球。','Nán Nǐ xǐ huan shén me yùn dòng\nNǚ Wǒ zuì xǐ huan tī zú qiú'),listenBank,'b4d',0)}${qs(4,6)}<h3>第三部分 · Phần 3 · Câu 7–10</h3>${textExample('男：给您笔，请在这儿写一下您的姓名。\n女：好的，是这儿吗？\n问：女的要写什么？','Nán Gěi nín bǐ qǐng zài zhè r xiě yí xià nín de xìng míng\nNǚ Hǎo de shì zhè r ma\nWèn Nǚ de yào xiě shén me','A · 姓名')}<div class="example">${pairedText('A 姓名　B 时间　C 问题','xìng míng shí jiān wèn tí')}</div>${qs(7,10)}`;

function choose(b){if(submitted)return;document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[b.dataset.q]=b.dataset.id;updateProgress()}
function restoreAnswers(){Object.entries(answers).forEach(([n,v])=>{let b=document.querySelector(`[data-q="${n}"][data-id="${CSS.escape(v)}"]`),i=document.querySelector(`[data-input="${n}"]`),s=document.querySelector(`[data-select="${n}"]`);if(b)b.classList.add('selected');if(i)i.value=v;if(s)s.value=v})}
function updateProgress(){const groups=[['听力 第一部分 · Câu 1–3',1,3],['听力 第二部分 · Câu 4–6',4,6],['听力 第三部分 · Câu 7–10',7,10],['阅读 第一部分 · Câu 11–13',11,13],['阅读 第二部分 · Câu 14–17',14,17],['阅读 第三部分 · Câu 18–21',18,21],['阅读 第四部分 · Câu 22–24',22,24],['书写 · Câu 25–30',25,30]];byId('progress').innerHTML=groups.map(g=>`<div class="progress-group"><div>${g[0]}</div><section>${questions.filter(q=>q.number>=g[1]&&q.number<=g[2]).map(q=>`<button class="dot ${answers[q.number]?'done':''}" data-dot="${q.number}">${q.number}</button>`).join('')}</section></div>`).join('');let done=questions.filter(q=>answers[q.number]).length;byId('progressCount').textContent=`${done}/30`;byId('progressRing').style.setProperty('--pct',done/30*360+'deg');document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>byId('q'+b.dataset.dot).scrollIntoView({behavior:'smooth'}))}
function norm(s){return String(s||'').normalize('NFKC').replace(/[\s，。！？,.!?]/g,'')}
function grade(auto=false){if(submitted)return;let blanks=questions.filter(q=>!norm(answers[q.number])).length;if(blanks&&!auto){byId('confirmText').textContent=`Bạn còn ${blanks} câu chưa hoàn thành. Bạn có muốn nộp bài không?`;byId('confirm').classList.remove('hidden');return}submitted=true;byId('confirm').classList.add('hidden');clearInterval(tick);byId('audio').pause();document.body.classList.add('submitted');let right=0;questions.forEach(q=>{let el=byId('q'+q.number),got=answers[q.number],ok=q.type==='input'?norm(got)===norm(q.correctId):got===q.correctId;let items=q.type==='bank'?bankItems(q.bank):q.type==='component'?componentBank:q.options||[];let correctText=q.type==='input'?q.correctId:(items.find(x=>x.id===q.correctId)||{}).text;el.classList.add(!norm(got)?'blank':ok?'correct':'wrong');if(ok)right++;el.querySelector('.feedback').innerHTML=ok?'✓ Chính xác':`${!norm(got)?'Chưa trả lời':'✕ Chưa chính xác'}<br>Đáp án đúng: ${correctText}`;el.querySelector('.feedback').innerHTML += '<br>'+q.explanation;el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===q.correctId)b.classList.add('correct-answer')});let inp=el.querySelector('.fill');if(inp)inp.disabled=true});let pct=Math.round(right/30*100),score=(right/3).toFixed(1);byId('result').innerHTML=`<h2>Kết quả</h2><div>${byId('studentLine').textContent}</div><div class="score">${right}/30</div><p><b>${score}/10</b> · ${pct}%</p><div class="bar"><i style="width:${pct}%"></i></div>`;byId('result').classList.remove('hidden');byId('retryBtn').classList.remove('hidden');byId('submitBtn').classList.add('hidden');updateGradedProgress();byId('result').scrollIntoView({behavior:'smooth'})}
function updateGradedProgress(){document.querySelectorAll('[data-dot]').forEach(b=>{let q=questions.find(x=>x.number==b.dataset.dot),got=answers[q.number],ok=q.type==='input'?norm(got)===norm(q.correctId):got===q.correctId;b.className='dot '+(ok?'ok':'bad')})}
function reset(){attempt++;paused=false;byId('pause').textContent='Ⅱ';answers={};submitted=false;seconds=2400;document.body.classList.remove('submitted');document.querySelectorAll('.question').forEach(x=>x.classList.remove('correct','wrong','blank'));byId('result').classList.add('hidden');byId('retryBtn').classList.add('hidden');byId('submitBtn').classList.remove('hidden');render();startTimer();scrollTo({top:0,behavior:'smooth'})}
