<script id="lessonData" type="application/json">{"questions": [{"id": 1, "prompt": "", "options": ["做人不要脱离实际", "生活不需要想象力", "要精心安排好生活", "完美的东西追求不到"], "correct": 0, "explanation": "人，还是要接地气。想归想，生活是另外一回事，要是始终追求感觉和完美会很累。有些事偶尔想想挺好，可做事还是要踏实些，该是啥样人就过啥样的日子，这样最舒服。"}, {"id": 2, "prompt": "", "options": ["连锁企业很受欢迎", "鱼店的生意都很好", "商店开张搞得很热闹", "连锁药店应加强管理"], "correct": 3, "explanation": "在众多的连锁药店当中，有企业自身创建的，也有许多加盟的。由于数量增长过快，出现鱼目混珠的现象也在所难免，这就要求我们做好企业管理，防备出现轰轰烈烈开张，随即偃旗息鼓的局面。"}, {"id": 3, "prompt": "", "options": ["孔子的学生成千上万", "孔子说话常用夸张的方法", "孔子的学生都很有影响力", "孔子是中国的第一位私学教师"], "correct": 3, "explanation": "学术界可以断定，孔子是中国历史上第一个以私人身份教了大量学生的人。照传统说法，他有几千个学生，其中有几十人成为著名的思想家和学者。前一个数目无疑有夸大成分，但毫无问题的是，他是个很有影响的教师。"}, {"id": 4, "prompt": "", "options": ["公司必须重新编写内部规则", "公司面临的风险每天都在增加", "所有公司都能及时关注各种风险", "出版公司要不断修订过时的出版物"], "correct": 1, "explanation": "近年来世界经济形势变化多端，公司面临的各种风险与日俱增，因此，适时地评估内部控制指引的适当性，并及时地予以修订尤其必要，这既可以及时引导公司关注各种新的风险，也可以防止因指引过时而形同虚设。"}, {"id": 5, "prompt": "", "options": ["海兴是红富士的故乡", "海兴很适合栽种苹果", "专家看着苹果一直发愣", "专家弄不清海兴的位置"], "correct": 1, "explanation": "海兴的苹果很有名，他们曾把该县产的“红富士”与中国最有名的“红富士”混到一起，请专家品尝，愣是弄得许多专家分不清伯仲。海兴昼夜温差大，降水适中，气候条件与“红富士”的故乡日本富士岛非常相近，这就难怪海兴“富士”难住了专家。"}, {"id": 6, "prompt": "", "options": ["制定治沙目标", "在沙漠中修路", "开始挑战沙漠", "生长在沙漠中"], "correct": 3, "explanation": "女：各位听众朋友晚上好，今天我们非常荣幸地请到亿利资源集团董事长王文彪先生做客本台。您能不能先简单介绍一下您的经历。男：我生于沙漠，长于沙漠，每日所见都是漫漫黄沙，这是我29岁前的生活。挑战沙漠，改造沙漠，把死亡之海变成沙漠绿洲，这是我现在和以后的目标。女：您开始从事治沙这项工作以来，最困难的是什么时候？男：1988年，我作为沙漠盐厂厂长走马上任，盐厂生产蒸蒸日上，却因为黄沙堵路，盐产品经常运不出去，我们的盐厂不得不先修公路。沙漠公路不比咱们一般的公路，要解决流沙覆盖公路的问题。65公里的沙漠公路一修就是3年，我们经历了一次又一次的失败，被流沙搞得焦头烂额。女：你们是在失败和奋斗中趟出了一条科学治沙之路？男：是啊，我们走了很多弯路，深深地感到要想治沙，前提是科学、是技术。比如，我们通过飞播技术，在打好的格子上种草，等生长出来的草控制住沙丘，再大面积种植沙柳和杨树，这些改善沙漠生态的办法，都是从实践中探索出来的，否则你一棵树也种不出来。女：听说您还获得了联合国环境与发展大奖，您所在的库布齐沙漠已经变得生机勃勃，沙漠经济也搞得有声有色。男：库布齐沙漠是中国第七大沙漠，总面积1.86万平方公里。我们通过28年的坚守，创造了6000多平方公里沙漠绿洲，如今我们要向沙漠要效益，发展沙漠经济，把生态当生意做，把保护生态变成一项可持续发展的事业。女：28年是一个漫长的过程。现在您已经被业内看作是我国生态产业的领军人物了，您感受如何？男：沙漠治理、保护生态不是一个人的事业，也不是一朝一夕的事情，它需要成千上万的人共同奋斗，需要更多的人把最美好、最青春的年华献给沙漠。"}, {"id": 7, "prompt": "", "options": [" 　徘徊", "转眼　积　单调　漂浮", "刹那　留　疲倦　游荡", "立刻　有　枯燥　行走"], "correct": 1, "explanation": ""}, {"id": 24, "prompt": "（24）________", "options": ["向日葵的生产潜力很大", "因其花常朝着太阳而得名", "还可榨出低胆固醇的高级食用葵花油", "可长至两米以上", "航行到美洲的西班牙人把向日葵带到欧洲"], "correct": 1, "explanation": ""}, {"id": 25, "prompt": "（25）________", "options": ["向日葵的生产潜力很大", "因其花常朝着太阳而得名", "还可榨出低胆固醇的高级食用葵花油", "可长至两米以上", "航行到美洲的西班牙人把向日葵带到欧洲"], "correct": 3, "explanation": ""}, {"id": 26, "prompt": "（26）________", "options": ["向日葵的生产潜力很大", "因其花常朝着太阳而得名", "还可榨出低胆固醇的高级食用葵花油", "可长至两米以上", "航行到美洲的西班牙人把向日葵带到欧洲"], "correct": 2, "explanation": ""}, {"id": 27, "prompt": "（27）________", "options": ["向日葵的生产潜力很大", "因其花常朝着太阳而得名", "还可榨出低胆固醇的高级食用葵花油", "可长至两米以上", "航行到美洲的西班牙人把向日葵带到欧洲"], "correct": 4, "explanation": ""}, {"id": 28, "prompt": "（28）________", "options": ["向日葵的生产潜力很大", "因其花常朝着太阳而得名", "还可榨出低胆固醇的高级食用葵花油", "可长至两米以上", "航行到美洲的西班牙人把向日葵带到欧洲"], "correct": 0, "explanation": ""}, {"id": 29, "prompt": "文中所说“春天的树花”有什么特点？", "options": ["花谢得很快", "都同时开放", "只开花不长叶", "花朵香味浓郁"], "correct": 2, "explanation": ""}, {"id": 30, "prompt": "洋槐花的特点是：", "options": ["晚春开放", "冬天开放", "花上有刺", "花呈黄色"], "correct": 0, "explanation": ""}, {"id": 31, "prompt": "关于国槐，下列哪项正确？", "options": ["是引自欧洲的树种", "更适合在北方生长", "树叶可以用来治病", "花可以吃和做染料"], "correct": 3, "explanation": ""}, {"id": 32, "prompt": "国槐、刺槐的共同点是：", "options": ["故乡在中国", "受蜜蜂欢迎", "开白色的花", "栽培不容易"], "correct": 1, "explanation": ""}, {"id": 33, "prompt": "作者陶醉于：", "options": ["胡杨树生命中的悲壮", "夕阳下美丽的胡杨林", "新疆今日呈现的繁华", "胡杨不可思议的故事"], "correct": 1, "explanation": ""}, {"id": 34, "prompt": "根据第2段可以知道：", "options": ["胡杨根逐水而生", "胡杨树能活6000年", "胡杨与章鱼习性相近", "胡杨主要生长在海边"], "correct": 0, "explanation": ""}, {"id": 35, "prompt": "怎样理解胡杨有较强的耐盐碱能力？", "options": ["胡杨可通过眼泪排出盐碱", "胡杨能够不受盐碱水的伤害", "胡杨能够转换盐碱的成分", "盐碱可通过胡杨树枝蒸发掉"], "correct": 1, "explanation": ""}, {"id": 36, "prompt": "胡杨树叶的特点是：", "options": ["尽量把水留给枝干", "树叶长得非常整齐", "用叶子遮挡阳光，减少水分蒸发", "随着树长大，树叶的形态会发生变化"], "correct": 0, "explanation": ""}], "shared": ["向日葵又名朝阳花，（24）________。", "向日葵的种植四季皆可，主要以夏、冬两季为宜，花期可达两周以上。向日葵分为“普通观赏用”和“食用”两个品种。观赏用品种特点为植株较矮小，个别不超过半米。食用品种植株较为高大，（25）________。", "向日葵为世界四大油料作物之一，其生长与温度、水分、光照、土壤等因素关系密切。向日葵除了外形酷似太阳以外，它的花朵明亮大方，种子更具经济价值，不但可做成受人喜爱的葵瓜子，（26）________。", "向日葵的野生种主要分布在北纬30°～52°之间的北美洲南部、西部及秘鲁和墨西哥北部地区。哥伦布发现新大陆时，（27）________，开始在西班牙的马德里植物园种植观赏。", "向日葵约自明朝传入中国。中国向日葵主产区分布在东北、西北和华北地区，（28）________，可向西南、中南和华东地区扩种。"], "passages": {"29–32.": ["春天的树花耐人寻味。开头和中间的那些，都是在光秃秃的树枝上点缀着红的粉的花朵。这时候，懒冬翻身打了个哈欠，伸了个懒腰，在沉睡里尚未大醒，干渴的季节，忽然有鲜艳的花朵次第开放，滋润着人们的心田，接着是花瓣飘落，似五彩缤纷的花雨，令人惊讶春的神奇。", "清明过后春渐晚，杂树新绿渐生，这时候树上白花多，绿叶里的白花似一夜飞雪，季节仿佛一下子又回到了冬天。洋槐花坐的就是这班车。", "槐树有洋槐、国槐之分。洋槐，又名刺槐。树皮灰褐色，原生于北美洲，现被广泛引种到亚洲、欧洲等地。顾名思义，刺槐生有尖利的刺，白色的花很香，还能食用。刺槐花产的蜂蜜很甜，蜂蜜产量也高。", "国槐是中国的本土树种，现南北各省区广泛栽培。日本、越南也有分布，欧洲、美洲各国均有引种。国槐树型高大，树干说不上挺拔，冠却很庞大，枝繁叶茂，绿荫如盖。花为淡黄色，可烹调食用，也可做中药或染料。花期在7～8月，和其他树种花期不同，是一种重要的蜜源植物。"], "33–36.": ["伴着柔和的夕阳，我漫步在胡杨林深处，一页一页地翻阅胡杨的故事，陶醉于胡杨林呈献给我们的一片金黄，感动于胡杨送给寂寞沙海的繁华与辉煌。在新疆，百姓称胡杨为“英雄树”，赞其“生而不死一千年，死而不倒一千年，倒而不朽一千年”，细细观赏胡杨，从她的树干、枝叶间，读出的是胡杨生命中那不可思议的坚毅不屈与悲壮。", "胡杨是第三世纪残余的古老树种，6000多万年前就在地球上生存了。胡杨喜欢沙质土壤，它的主根可入土10米，侧根则如章鱼的手臂，伸长范围可远达30米，胡杨还可从自己的根部直接生出幼苗，不断扩大自己的疆域。胡杨的根随着水走，沙漠河流流向哪里，她就跟随到哪里，在茫茫沙海中顽强地生存着。", "胡杨喜光，喜土壤湿润，耐干旱，对温度大幅度变化的适应能力很强。它的根可以扎到20米以下的地层中吸取地下水，体内还能贮存大量的水分。胡杨有较强的耐盐碱能力，它不仅能够不受碱水的伤害，还能不断地从含有盐碱的地下水中吸取水分和养料。人们发现，若是将胡杨的树枝折断，从断口处流出的树液蒸发后，就会留下生物碱，因此胡杨又被称为“眼泪树”。", "胡杨叶子特别懂得水的可贵，它不想多占去一点水资源。在树梢处，它用大叶子吸收更多的阳光给枝干；在中下层，用小叶子减少水分的散失。也就是说，一棵胡杨树上会生出三种不同形状的叶子，一种又细又长，类似柳树叶，一种和槐树的叶子差不多，另外一种形状独特，有点儿像枫叶。胡杨叶子的表面还有一层蜡质，这样就可以锁住水分，让每滴水都用在树的枝干上。"]}}</script>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent),AUDIO=JSON.parse(document.getElementById('audioData').textContent),KEY='ntc-hsk6-bai18-v1'+':'+encodeURIComponent(new URLSearchParams(location.search).get('student')||'standalone'),DURATION=75*60*1000;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(previous){let shared=shuffle([0,1,2,3,4]);let orders={};for(const q of DATA.questions){let a=q.id>=24&&q.id<=28?shared:shuffle(q.options.map((_,i)=>i));if(previous&&a.join()==previous.orders[q.id].join()&&!(q.id>=24&&q.id<=28))a=a.slice(1).concat(a[0]);orders[q.id]=a}if(previous&&shared.join()==previous.orders[24].join()){shared=shared.slice(1).concat(shared[0]);for(let n=24;n<=28;n++)orders[n]=shared}return{orders,answers:{},started:null,submitted:false,finished:null,auto:false}}
let state;try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.orders&&old.answers&&DATA.questions.every(q=>Array.isArray(old.orders[q.id])&&old.orders[q.id].length===q.options.length&&new Set(old.orders[q.id]).size===q.options.length&&old.orders[q.id].every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length))&&(!old.started||Number.isFinite(old.started)))state=old;}catch(e){}if(!state)state=fresh();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveNote').textContent='Tiến độ được lưu trên trình duyệt này; tải lại trang vẫn tiếp tục thời gian đang chạy.'}catch(e){$('saveNote').textContent='Trình duyệt chưa cho phép lưu tiến độ. Giữ trang mở trong khi làm bài.'}}
function part(title,instruction,idx){return `<section class="part"><h3>${title}</h3><p>${instruction}</p>${idx?`<audio controls preload="none" data-part="${idx}" aria-label="Audio phần nghe ${idx}"><source src="${AUDIO[idx]}" type="audio/mpeg"></audio><p class="small error" id="audioError${idx}" hidden>Không phát được audio. Hãy giải nén toàn bộ bộ bài và giữ thư mục audio đi cùng index.html.</p>`:''}</section>`}
function passage(lines){return `<div class="passage">${lines.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`}
function question(q){const compact=q.id>=24&&q.id<=28;const answered=state.answers[q.id],result=!state.submitted?'':answered===undefined?'unanswered':answered===q.correct?'correct':'wrong';return `<article class="question ${result} ${compact?'compact':''}" id="q${q.id}"><p class="qtitle">${compact?q.id+'.':q.id+'. '+esc(q.prompt)}</p><div class="options">${state.orders[q.id].map((original,i)=>`<label class="opt ${state.submitted?(original===q.correct?'right-option':original===answered?'wrong-option':''):''}"><input type="radio" name="q${q.id}" value="${original}" aria-label="Câu ${q.id}, lựa chọn ${String.fromCharCode(65+i)}" ${answered===original?'checked':''} ${state.submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span>${compact?'':`<span>${esc(q.options[original])}</span>`}</label>`).join('')}</div>${state.submitted?feedback(q):''}</article>`}
function optionText(q,v){return v===undefined?'Chưa làm':`${String.fromCharCode(65+state.orders[q.id].indexOf(v))}. ${esc(q.options[v])}`}
function feedback(q){const a=state.answers[q.id];return `<div class="feedback">${a===undefined?'○ Chưa làm':a===q.correct?'✓ Đúng':'✕ Sai'}<br>Bạn chọn: ${optionText(q,a)}<br><strong>Đáp án đúng: ${optionText(q,q.correct)}</strong>${q.explanation?`<details class="explain"><summary>Lời nghe / Giải thích</summary><div>${esc(q.explanation)}</div></details>`:''}</div>`}
function sharedBank(){const q=DATA.questions.find(q=>q.id===24);return `<section class="shared-bank" aria-label="Lựa chọn chung câu 24 đến 28"><h3>第24–28题 · Lựa chọn chung</h3>${state.orders[24].map((original,i)=>`<div class="shared-item"><b>${String.fromCharCode(65+i)}</b><span>${esc(q.options[original])}</span></div>`).join('')}</section>`}
function render(){let h='';for(const q of DATA.questions){if(q.id===1)h+='<h2>一、听力 · Nghe</h2>'+part('第一部分 · Phần 1','第1–5题：请选出与所听内容一致的一项。',1);if(q.id===6)h+=part('第二部分 · Phần 2','第6–10题：请选出正确答案。',2);if(q.id===11)h+=part('第三部分 · Phần 3','第11–17题：请选出正确答案。',3);if(q.id===18)h+='<h2>二、阅读 · Đọc</h2>'+part('第一部分 · Phần 1','第18–20题：请选出有语病的一项。');if(q.id===21)h+=part('第二部分 · Phần 2','第21–23题：选词填空。');if(q.id===24)h+=part('第三部分 · Phần 3','第24–28题：选句填空。')+passage(DATA.shared)+sharedBank();if(q.id===29)h+=part('第四部分 · Phần 4','第29–36题：请选出正确答案。')+passage(DATA.passages['29–32.']);if(q.id===33)h+=passage(DATA.passages['33–36.']);h+=question(q)}$('exercise').innerHTML=h;
document.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',()=>choose(Number(input.name.slice(1)),Number(input.value))));
document.querySelectorAll('audio').forEach(a=>{a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause()}));a.addEventListener('error',()=>$('audioError'+a.dataset.part).hidden=false);a.querySelector('source').addEventListener('error',()=>$('audioError'+a.dataset.part).hidden=false)});
for(const id of ['submitTop','submitBottom'])$(id).hidden=state.submitted;$('retry').hidden=!state.submitted;renderProgress();renderResults();tick();persist()}
function choose(id,value){if(state.submitted)return;if(state.started&&Date.now()>=state.started+DURATION){submit(true);return}if(!state.started)state.started=Date.now();state.answers[id]=value;persist();renderProgress();tick()}
function counts(){let correct=[],wrong=[],missing=[];for(const q of DATA.questions){const a=state.answers[q.id];(a===undefined?missing:a===q.correct?correct:wrong).push(q.id)}return{correct,wrong,missing}}
function jump(n){closeProgress();$('q'+n).scrollIntoView({behavior:'smooth',block:'start'});$('q'+n).setAttribute('tabindex','-1');$('q'+n).focus({preventScroll:true})}
function renderProgress(){const n=Object.keys(state.answers).length;$('progressText').textContent=`Đã làm ${n}/36 câu · ${Math.round(n/36*100)}%`;$('progressBar').value=n;$('legend').textContent=state.submitted?'Xanh: đúng · Đỏ: sai · Vàng: chưa làm':'Hồng: đã làm · Trắng: chưa làm. Nhấn số để đến câu tương ứng.';$('qgrid').innerHTML=DATA.questions.map(q=>{let a=state.answers[q.id],c=state.submitted?(a===undefined?'unanswered':a===q.correct?'correct':'wrong'):(a!==undefined?'done':'');return `<button class="${c}" data-jump="${q.id}" aria-label="Câu ${q.id}, ${a===undefined?'chưa làm':state.submitted?(a===q.correct?'đúng':'sai'):'đã làm'}">${q.id}</button>`}).join('');$('qgrid').querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.jump))}
function renderResults(){const r=$('results');r.hidden=!state.submitted;if(!state.submitted)return;const c=counts();const buttons=(arr)=>arr.map(n=>`<button data-jump="${n}">Câu ${n}</button>`).join('');r.innerHTML=`<h3>${state.auto?'Hết 75 phút · Đã tự nộp bài':'Kết quả làm bài'}</h3><div class="stats"><div class="stat good"><b>${c.correct.length}</b>Câu đúng</div><div class="stat bad"><b>${c.wrong.length}</b>Câu sai</div><div class="stat"><b>${c.missing.length}</b>Chưa làm</div></div><p><b>Sai những câu:</b> ${c.wrong.length?'':'Không có.'}</p><div class="links">${buttons(c.wrong)}</div>${c.missing.length?`<p><b>Câu chưa làm:</b></p><div class="links">${buttons(c.missing)}</div>`:''}<p class="small">Tổng ${DATA.questions.length} câu · Đúng ${Math.round(c.correct.length/36*100)}% · Thời gian làm: ${formatTime(state.started?Math.min(DURATION,state.finished-state.started):0)}<br>Nhấn số câu để xem lựa chọn, đáp án đúng và lời nghe.</p>`;r.querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.jump))}
function formatTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(state.submitted){$('clock').textContent='Đã nộp';$('clock').classList.remove('low');return}const remain=state.started?state.started+DURATION-Date.now():DURATION;$('clock').textContent=formatTime(remain);$('clock').classList.toggle('low',remain<=300000);if(state.started&&remain<=0)submit(true)}
function submit(auto=false){if(state.submitted)return;state.submitted=true;state.finished=Date.now();state.auto=auto;persist();render();$('results').scrollIntoView({behavior:'smooth',block:'start'})}
function openProgress(){$('progressDialog').hidden=false;$('progressBtn').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('closeProgress').focus()}
function closeProgress(){$('progressDialog').hidden=true;$('progressBtn').setAttribute('aria-expanded','false');document.body.style.overflow='';$('progressBtn').focus()}
$('progressBtn').onclick=openProgress;$('closeProgress').onclick=closeProgress;$('progressDialog').onclick=e=>{if(e.target===$('progressDialog'))closeProgress()};document.addEventListener('keydown',e=>{if($('progressDialog').hidden)return;if(e.key==='Escape')closeProgress();if(e.key==='Tab'){const f=$('progressDialog').querySelectorAll('button'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('submitTop').onclick=()=>submit();$('submitBottom').onclick=()=>submit();$('retry').onclick=()=>{state=fresh(state);document.querySelectorAll('audio').forEach(a=>a.pause());render();window.scrollTo({top:0,behavior:'smooth'})};document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);render();setInterval(tick,500);
</script><script>
(()=>{const send=()=>{try{const c=counts();parent.postMessage({type:'hsk6-progress',lesson:18,answered:Object.keys(state.answers).length,submitted:state.submitted,correct:c.correct.length,wrong:c.wrong.length,missing:c.missing.length,writing:!!state.writing?.trim(),writingRequired:!!DATA.writing},'*')}catch(e){}};const save=persist;persist=function(){save();send()};send()})();
</script>
