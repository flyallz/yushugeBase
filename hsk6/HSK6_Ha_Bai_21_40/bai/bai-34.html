<script id="lessonData" type="application/json">{"questions": [{"id": 1, "prompt": "", "options": ["旅游是中国的支柱产业", "中国有很多人造风景区", "不漂亮的地方鲜有人去", "说话人不看好微缩景观"], "correct": 3, "explanation": "我们的旅游一向是靠老祖宗留下的宫殿庙宇和老天爷造化的奇山秀水吃饭，许多“原装”景点尚且门庭冷落，经过微缩之后的“小玩意”到底有多少吸引力，前景实难预料。"}, {"id": 2, "prompt": "", "options": ["很多人在拍戏前受了重伤", "他舍不得花钱搭建影视城", "戏中的战争场面极其宏大", "影片中的群众演员很出色"], "correct": 2, "explanation": "戏开拍前，他不惜血本，花费了数千万人民币搭建了一座影视城。为了再现当年明军与清军鏖战的场面，他不惜重金累计动用了数万人来担任群众演员，场面之宏大令人叹为观止。"}, {"id": 3, "prompt": "", "options": ["所谓销售就是有偿转让", "转让无形资产是有条件的", "单位不动产不可随意赠送", "无偿赠予和销售无本质区别"], "correct": 0, "explanation": "转让无形资产，是指转让无形资产的所有权或使用权的行为；销售不动产，是指有偿转让不动产的所有权，转让不动产的有限产权或永久使用权。单位将不动产无偿赠送给他人等视同销售不动产的行为。"}, {"id": 4, "prompt": "", "options": ["不同气质的人可以互相影响", "各种气质的人混搭方便互相学习", "企业用人时应考虑不同气质的混搭", "不同气质的人混搭的消极影响极大"], "correct": 2, "explanation": "企业在选拔班组成员时,应注意各种气质类型人员的适当搭配。这样,在工作中各种气质可以得到适当的互补。把不同气质的人搭配在一起,就可以发挥各种气质的积极因素,弥补其中消极的成分。"}, {"id": 5, "prompt": "", "options": ["他常在外面吃饭", "他是个画画儿的", "他历来花钱要算计", "做公益不如画画儿"], "correct": 1, "explanation": "与其对社会公益事业的慷慨资助相比，他对自己的要求显得过于苛刻了，他生活十分俭朴，从不乱花一分钱，每天作画裁下的纸条儿都舍不得丢掉；到外边吃饭要打包，甚至连家里每月的开销也要精打细算，力求节俭。"}, {"id": 6, "prompt": "", "options": ["和说话人关系都很好", "其文学素养有高有低", "并不真心愿意搞写作", "很多人改行搞收藏了"], "correct": 0, "explanation": "女：您和中国的一线作家都有交情，海岩的第一件收藏品还是您帮他挑选的。您写过爱情小说，之后就去写文物了。男：我和这些作家关系都非常好，50岁以上、60岁以下的都认识，他们这些人本身都文学素养很高。他们年轻的时候，工作都是分配的，不能辞职。后来，慢慢地，很多人退出了文学圈。我曾经还是有些文学理想的，但后来觉得文学界不争气，就从那里面走出来了。后来，我写的关于艺术品的小说比他们的文学小说还畅销。女：您怎么评价文学界和文物界？男：我觉得文物比文学好的一点在于：它比较深，而文学比较浅。好比，你原来是个吸烟者，那是文学；而搞文物的就是雪茄。等你吸了雪茄，你会发现香烟比较淡。文学的评价标准也是个问题，写诗可以有好坏，反正都能写，谁好谁坏也没有一个终极标准。但文物是一个很窄的领域，而且文物是有终极判断的。我发现，文物界很多人说起话来前言不搭后语，文物界的人都特别死板，眼界特窄，而我眼界比较宽。女：您介入公共事务极为频繁，前不久还在博客上写关于贪官什么的文章，这样做是要保持影响力，还是纯粹出于表达的欲望？男：博客我一年要写137篇，最近四年都是这个速度。对我而言，收藏只是生活中的一个调剂，我因为在《百家讲坛》说收藏而“红”了。但我觉得，这反而是我最不看重的事儿。如果说我是“收藏家”的话，那可能是因为我著书立说了。女：商人、作家、学者、收藏家，在这几种身份之间，您如何评价自己？男：我是一个学者，不是一个商人。我曾经和我儿子说“我能够做一个学者，是这个时代的不幸，是我自己的大幸。”我们不能和王国维、陈寅恪相比，我实际上没读过什么书，我们算什么？我们这个时代缺少文化，所以稍微读了一点儿书的人就显得有文化。"}, {"id": 7, "prompt": "", "options": [ , "correct": 1, "explanation": ""}, {"id": 24, "prompt": "（24）________", "options": ["一干就是20年", "用来形容梦境或不可能实现的空想", "大臣们你看我，我看你", "可怜淳于棼对兵法一无所知", "他一时高兴多喝了几杯"], "correct": 4, "explanation": ""}, {"id": 25, "prompt": "（25）________", "options": ["一干就是20年", "用来形容梦境或不可能实现的空想", "大臣们你看我，我看你", "可怜淳于棼对兵法一无所知", "他一时高兴多喝了几杯"], "correct": 0, "explanation": ""}, {"id": 26, "prompt": "（26）________", "options": ["一干就是20年", "用来形容梦境或不可能实现的空想", "大臣们你看我，我看你", "可怜淳于棼对兵法一无所知", "他一时高兴多喝了几杯"], "correct": 2, "explanation": ""}, {"id": 27, "prompt": "（27）________", "options": ["一干就是20年", "用来形容梦境或不可能实现的空想", "大臣们你看我，我看你", "可怜淳于棼对兵法一无所知", "他一时高兴多喝了几杯"], "correct": 3, "explanation": ""}, {"id": 28, "prompt": "（28）________", "options": ["一干就是20年", "用来形容梦境或不可能实现的空想", "大臣们你看我，我看你", "可怜淳于棼对兵法一无所知", "他一时高兴多喝了几杯"], "correct": 1, "explanation": ""}, {"id": 29, "prompt": "古人发明纸的原因是：", "options": ["骨头数量有限", "竹片工艺烦琐", "丝织品要做衣服", "之前的材料都有缺憾"], "correct": 3, "explanation": ""}, {"id": 30, "prompt": "关于古代造纸技术，下列哪项正确？", "options": ["东汉水平最高", "讲究化腐朽为神奇", "努力适应市场需求", "专门在细节上下工夫"], "correct": 2, "explanation": ""}, {"id": 31, "prompt": "在漫长的历史中：", "options": ["虫子一直对纸形成威胁", "宣纸在纸张中十分有名", "明清造纸技术达到了顶峰", "工匠们一直追求的就是精美"], "correct": 1, "explanation": ""}, {"id": 32, "prompt": "根据纸张的出土情况可以知道：", "options": ["西汉是纸张用量最大的时期", "西汉时期是纸张泛滥的年代", "西汉生产的纸张已可绘制地图", "1933年出土的纸是最早生产的纸"], "correct": 2, "explanation": ""}, {"id": 33, "prompt": "岳先生认为自己收藏古玉的有利条件是：", "options": ["他爱学习，阅历丰富", "他走南闯北，有见识", "他精通考古挖掘技术", "他幸运地赶上了改革开放"], "correct": 3, "explanation": ""}, {"id": 34, "prompt": "齐家玉器中的立式玉人：", "options": ["上衣是树叶", "上面标有朝代", "有被捆绑过的痕迹", "证实了人们对史前先人的一些认知"], "correct": 3, "explanation": ""}, {"id": 35, "prompt": "根据上文，岳先生：", "options": ["喜欢旅游", "当过空军", "钟情于齐家玉器", "常为没钱而发愁"], "correct": 2, "explanation": ""}, {"id": 36, "prompt": "最后一段画线词语“真品有的是”的意思是：", "options": ["是真品", "没有真品", "有些是真品", "真品特别多"], "correct": 3, "explanation": ""}], "shared": ["从前有个人叫淳于棼，他家院中有一棵大槐树，盛夏时节人们都喜欢在树下乘凉。", "淳于棼生日那天，亲友都来祝寿，（24）________，之后就在槐树下沉沉睡去。", "梦中，他到了大槐安国，正赶上京城会试。他报名进了考场，考得很争气，居然得了第一名。皇帝看他学问好，相貌也好，就把公主嫁给了他。", "婚后，夫妻生活十分美满。淳于棼被皇帝任命为太守，（25）________。因他管理有方，属下不敢胡作非为，百姓十分拥护他。皇帝欣赏他的政绩，表彰了他，并给了他很多奖励和荣誉。", "这一年，敌兵入侵，大槐安国的将军被敌兵打得溃不成军。皇帝急忙召集群臣商议对策。（26）________，束手无策。这时，有人向皇帝推荐淳于棼。皇帝立即下令，让淳于棼率全国精锐与敌军决战。", "（27）________，与敌兵刚一接触，就败下阵来。皇帝大怒，撤了淳于棼的职务。淳于棼气得大叫一声，从梦中惊醒，但见月亮挂在树梢上，自己还在大槐树下。", "此后汉语就有了成语“南柯一梦”，（28）________。"], "passages": {"29–32.": ["古人发明文字之后，最早用来做书写材料的是甲骨，后来竹片、木片以及缣帛也被用来书写。但竹片的笨重可想而知，缣帛的昂贵不言而喻，于是便有了纸的发明。", "中国西汉（前206年～公元25年）时期已开始了纸的制作，东汉（25年～220年）时期，造纸技术得以完善，魏晋南北朝（220年～589年）时期，造纸原料多样化，藤皮、稻草、麦秆纤维，甚至烂鱼网、破布在匠人的手下都能变成质地优良的好纸。需求也促进了造纸技术的提高，隋唐时期，著名的宣纸诞生。为了延长纸的寿命，晋时又发明了染纸技术，即从植物黄蘖中萃取汁液，浸染纸张，染过的纸叫黄纸，又叫黄麻纸，有灭虫防蛀的功能。唐代人在染黄纸的基础上创造出了较为名贵的艺术加工纸——硬黄纸。五代制造的澄心堂纸，直到北宋，一直被公认为是最好的纸张。到了明清，又有了新的创意，作为文书用纸的笺纸被加工得精美绝伦。", "中国出土最早的纸张是1933年在新疆发掘出的西汉古纸，年代不晚于公元前49年。1957年在陕西出土的古纸经过分析鉴定，为西汉麻纸，年代不晚于公元前118年。1986年在甘肃出土的西汉初年（约前179年～前141年）的纸质地图残片，表明了当时的纸已可供写绘之用。"], "33–36.": ["齐家文化古玉收藏家岳先生曾是个搞技术工作的军人。几十年的军旅生涯使他的足迹遍及祖国西北大漠戈壁、江南水乡，他亦曾多次远洋航行，颠簸于大风大浪之中。艰苦的生活磨炼了他的意志，严谨精细的技术工作又养成了他追根求底的性格特质。这对于他后来鉴定齐家文化古玉，破解其中蕴含的历史信息，打下了牢固的基础。", "齐家文化的玉器距今已有四五千年的历史，其中蕴含着丰富的文化信息，而岳先生偏偏对齐家文化古玉情有独钟。他发现，齐家玉器上一些细微特征所呈现的信息是多方位的。如立式玉人，手举斧头，腰际围一圈树叶遮蔽下身，斧头的头与柄由交叉绑系的绳索固定。这使得我们通常认知的史前先人腰围树叶的衣饰，以及斧、铲等工具与手柄捆绑系接的方法进一步在齐家古玉中得到佐证。", "提起古玉收藏，岳先生常说自己幸运，沾了改革开放的光，那时普通人的经济状况没有条件收藏，民间收藏品市场真品有的是，无奈的是囊中羞涩。岳先生节俭得近乎吝啬，却在浩如烟海的旧器物中搜寻到了不少上了级别的藏品。"]}}</script>

const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(previous){let shared=shuffle([0,1,2,3,4]);let orders={};for(const q of DATA.questions){let a=q.id>=24&&q.id<=28?shared:shuffle(q.options.map((_,i)=>i));if(previous&&a.join()==previous.orders[q.id].join()&&!(q.id>=24&&q.id<=28))a=a.slice(1).concat(a[0]);orders[q.id]=a}if(previous&&shared.join()==previous.orders[24].join()){shared=shared.slice(1).concat(shared[0]);for(let n=24;n<=28;n++)orders[n]=shared}return{orders,answers:{},started:null,submitted:false,finished:null,auto:false}}
let state;try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.orders&&old.answers&&DATA.questions.every(q=>Array.isArray(old.orders[q.id])&&old.orders[q.id].length===q.options.length&&new Set(old.orders[q.id]).size===q.options.length&&old.orders[q.id].every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length))&&(!old.started||Number.isFinite(old.started)))state=old;}catch(e){}if(!state)state=fresh();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveNote').textContent='Tiến độ được lưu trên trình duyệt này; tải lại trang vẫn tiếp tục thời gian đang chạy.'}catch(e){$('saveNote').textContent='Trình duyệt chưa cho phép lưu tiến độ. Giữ trang mở trong khi làm bài.'}}
function part(title,instruction,idx){return `<section class="part"><h3>${title}</h3><p>${instruction}</p>${idx?`<audio controls preload="none" data-part="${idx}" aria-label="Audio phần nghe ${idx}"><source src="${AUDIO[idx]}" type="audio/mpeg"></audio><p class="small error" id="audioError${idx}" hidden>Không phát được audio. Hãy giải nén toàn bộ ZIP và giữ nguyên thư mục audio bên cạnh thư mục bai, rồi mở index.html bằng trình duyệt.</p>`:''}</section>`}
function passage(lines){return `<div class="passage">${lines.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`}
function acceptedAnswers(q){return q.accepted||[q.correct]}
function isCorrect(q,v){return acceptedAnswers(q).includes(v)}
function question(q){const compact=q.id>=24&&q.id<=28;const answered=state.answers[q.id],result=!state.submitted?'':answered===undefined?'unanswered':isCorrect(q,answered)?'correct':'wrong';return `<article class="question ${result} ${compact?'compact':''}" id="q${q.id}"><p class="qtitle">${compact?q.id+'.':q.id+'. '+esc(q.prompt)}</p><div class="options">${state.orders[q.id].map((original,i)=>`<label class="opt ${state.submitted?(isCorrect(q,original)?'right-option':original===answered?'wrong-option':''):''}"><input type="radio" name="q${q.id}" value="${original}" aria-label="Câu ${q.id}, lựa chọn ${String.fromCharCode(65+i)}" ${answered===original?'checked':''} ${state.submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span>${compact?'':`<span>${esc(q.options[original])}</span>`}</label>`).join('')}</div>${state.submitted?feedback(q):''}</article>`}
function optionText(q,v){return v===undefined?'Chưa làm':`${String.fromCharCode(65+state.orders[q.id].indexOf(v))}. ${esc(q.options[v])}`}
function feedback(q){const a=state.answers[q.id];return `<div class="feedback">${a===undefined?'○ Chưa làm':isCorrect(q,a)?'✓ Đúng':'✕ Sai'}<br>Bạn chọn: ${optionText(q,a)}<br><strong>Đáp án đúng: ${acceptedAnswers(q).map(v=>optionText(q,v)).join(" / ")}</strong>${q.explanation?`<details class="explain"><summary>Lời nghe / Giải thích</summary><div>${esc(q.explanation)}</div></details>`:''}</div>`}
function sharedBank(){const q=DATA.questions.find(q=>q.id===24);return `<section class="shared-bank" aria-label="Lựa chọn chung câu 24 đến 28"><h3>第24–28题 · Lựa chọn chung</h3>${state.orders[24].map((original,i)=>`<div class="shared-item"><b>${String.fromCharCode(65+i)}</b><span>${esc(q.options[original])}</span></div>`).join('')}</section>`}
function render(){let h='';for(const q of DATA.questions){if(q.id===1)h+='<h2>一、听力 · Nghe</h2>'+part('第一部分 · Phần 1','第1–5题：请选出与所听内容一致的一项。',1);if(q.id===6)h+=part('第二部分 · Phần 2','第6–10题：请选出正确答案。',2);if(q.id===11)h+=part('第三部分 · Phần 3','第11–17题：请选出正确答案。',3);if(q.id===18)h+='<h2>二、阅读 · Đọc</h2>'+part('第一部分 · Phần 1','第18–20题：请选出有语病的一项。');if(q.id===21)h+=part('第二部分 · Phần 2','第21–23题：选词填空。');if(q.id===24)h+=part('第三部分 · Phần 3','第24–28题：选句填空。')+passage(DATA.shared)+sharedBank();if(q.id===29)h+=part('第四部分 · Phần 4','第29–36题：请选出正确答案。')+passage(DATA.passages['29–32.']);if(q.id===33)h+=passage(DATA.passages['33–36.']);h+=question(q)}$('exercise').innerHTML=h;
document.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',()=>choose(Number(input.name.slice(1)),Number(input.value))));
document.querySelectorAll('audio').forEach(a=>{a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause()}));a.addEventListener('error',()=>$('audioError'+a.dataset.part).hidden=false);a.querySelector('source').addEventListener('error',()=>$('audioError'+a.dataset.part).hidden=false)});
for(const id of ['submitTop','submitBottom'])$(id).hidden=state.submitted;$('retry').hidden=!state.submitted;renderProgress();renderResults();tick();persist()}
function choose(id,value){if(state.submitted)return;if(state.started&&Date.now()>=state.started+DURATION){submit(true);return}if(!state.started)state.started=Date.now();state.answers[id]=value;persist();renderProgress();tick()}
function counts(){let correct=[],wrong=[],missing=[];for(const q of DATA.questions){const a=state.answers[q.id];(a===undefined?missing:isCorrect(q,a)?correct:wrong).push(q.id)}return{correct,wrong,missing}}
function jump(n){closeProgress();$('q'+n).scrollIntoView({behavior:'smooth',block:'start'});$('q'+n).setAttribute('tabindex','-1');$('q'+n).focus({preventScroll:true})}
function renderProgress(){const n=Object.keys(state.answers).length;$('progressText').textContent=`Đã làm ${n}/36 câu · ${Math.round(n/36*100)}%`;$('progressBar').value=n;$('legend').textContent=state.submitted?'Xanh: đúng · Đỏ: sai · Vàng: chưa làm':'Hồng: đã làm · Trắng: chưa làm. Nhấn số để đến câu tương ứng.';$('qgrid').innerHTML=DATA.questions.map(q=>{let a=state.answers[q.id],c=state.submitted?(a===undefined?'unanswered':isCorrect(q,a)?'correct':'wrong'):(a!==undefined?'done':'');return `<button class="${c}" data-jump="${q.id}" aria-label="Câu ${q.id}, ${a===undefined?'chưa làm':state.submitted?(isCorrect(q,a)?'đúng':'sai'):'đã làm'}">${q.id}</button>`}).join('');$('qgrid').querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.jump))}
function renderResults(){const r=$('results');r.hidden=!state.submitted;if(!state.submitted)return;const c=counts();const buttons=(arr)=>arr.map(n=>`<button data-jump="${n}">Câu ${n}</button>`).join('');r.innerHTML=`<h3>${state.auto?'Hết 75 phút · Đã tự nộp bài':'Kết quả làm bài'}</h3><div class="stats"><div class="stat good"><b>${c.correct.length}</b>Câu đúng</div><div class="stat bad"><b>${c.wrong.length}</b>Câu sai</div><div class="stat"><b>${c.missing.length}</b>Chưa làm</div></div><p><b>Sai những câu:</b> ${c.wrong.length?'':'Không có.'}</p><div class="links">${buttons(c.wrong)}</div>${c.missing.length?`<p><b>Câu chưa làm:</b></p><div class="links">${buttons(c.missing)}</div>`:''}<p class="small">Tổng ${DATA.questions.length} câu · Đúng ${Math.round(c.correct.length/36*100)}% · Thời gian làm: ${formatTime(state.started?Math.min(DURATION,state.finished-state.started):0)}<br>Nhấn số câu để xem lựa chọn, đáp án đúng và lời nghe.</p>`;r.querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.jump))}
function formatTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(state.submitted){$('clock').textContent='Đã nộp';$('clock').classList.remove('low');return}const remain=state.started?state.started+DURATION-Date.now():DURATION;$('clock').textContent=formatTime(remain);$('clock').classList.toggle('low',remain<=300000);if(state.started&&remain<=0)submit(true)}
function submit(auto=false){if(state.submitted)return;state.submitted=true;state.finished=Date.now();state.auto=auto;persist();render();$('results').scrollIntoView({behavior:'smooth',block:'start'})}
function openProgress(){$('progressDialog').hidden=false;$('progressBtn').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('closeProgress').focus()}
function closeProgress(){$('progressDialog').hidden=true;$('progressBtn').setAttribute('aria-expanded','false');document.body.style.overflow='';$('progressBtn').focus()}
$('progressBtn').onclick=openProgress;$('closeProgress').onclick=closeProgress;$('progressDialog').onclick=e=>{if(e.target===$('progressDialog'))closeProgress()};document.addEventListener('keydown',e=>{if($('progressDialog').hidden)return;if(e.key==='Escape')closeProgress();if(e.key==='Tab'){const f=$('progressDialog').querySelectorAll('button'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('submitTop').onclick=()=>submit();$('submitBottom').onclick=()=>submit();$('retry').onclick=()=>{state=fresh(state);document.querySelectorAll('audio').forEach(a=>a.pause());render();window.scrollTo({top:0,behavior:'smooth'})};document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);render();setInterval(tick,500);
</script><script>
(()=>{const send=()=>{try{const c=counts();parent.postMessage({type:'hsk6-progress',lesson:34,answered:Object.keys(state.answers).length,submitted:state.submitted,correct:c.correct.length,wrong:c.wrong.length,missing:c.missing.length,writing:!!state.writing?.trim(),writingRequired:!!DATA.writing},'*')}catch(e){}};const save=persist;persist=function(){save();send()};send()})();
</script>
