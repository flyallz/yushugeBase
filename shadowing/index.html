",\"pinyin\":\"Zhè yì nián Wáng lǎoshī jiāo wǒmen Zhōngwén, měitiān gōngzuò dōu hěn lèi.\",\"track\":\"audio_13_1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[5.42,11.438]},{\"speaker\":\"白家月\",\"hanzi\":\"是啊，她教得很好。因为她，我们都非常爱上中文课。\",\"pinyin\":\"Shì a, tā jiāo de hěn hǎo. Yīnwèi tā, wǒmen dōu fēicháng ài shàng Zhōngwén kè.\",\"track\":\"audio_13_1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[11.498,19.434]},{\"speaker\":\"陈天中\",\"hanzi\":\"我们给她准备个新年礼物吧。你觉得送给她什么好呢？\",\"pinyin\":\"Wǒmen gěi tā zhǔnbèi ge xīnnián lǐwù ba. Nǐ juéde sòng gěi tā shénme hǎo ne?\",\"track\":\"audio_13_1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[19.494,26.271]},{\"speaker\":\"白家月\",\"hanzi\":\"王老师喜欢花，就送给她花吧。\",\"pinyin\":\"Wáng lǎoshī xǐhuan huā, jiù sòng gěi tā huā ba.\",\"track\":\"audio_13_1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[26.331,31.368]},{\"speaker\":\"陈天中\",\"hanzi\":\"那我们去花店看看，现在买花的人多，希望花店还有漂亮的花。\",\"pinyin\":\"Nà wǒmen qù huādiàn kànkan. Xiànzài mǎi huā de rén duō, xīwàng huādiàn hái yǒu piàoliang de huā.\",\"track\":\"audio_13_1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[31.428,39.77]},{\"speaker\":\"白家月\",\"hanzi\":\"王老师，今天的词比昨天多了十个。\",\"pinyin\":\"Wáng lǎoshī, jīntiān de cí bǐ zuótiān duōle shí ge.\",\"track\":\"audio_13_3\",\"trackLabel\":\"13-3\",\"textNo\":2,\"segment\":[0,5.559]},{\"speaker\":\"王一飞\",\"hanzi\":\"是啊！你们都学会了吗？\",\"pinyin\":\"Shì a! Nǐmen dōu xuéhuìle ma?\",\"track\":\"audio_13_3\",\"trackLabel\":\"13-3\",\"textNo\":2,\"segment\":[5.619,9.397]},{\"speaker\":\"安妮\",\"hanzi\":\"学会了，没有问题。\",\"pinyin\":\"Xuéhuì le, méiyǒu wèntí.\",\"track\":\"audio_13_3\",\"trackLabel\":\"13-3\",\"textNo\":2,\"segment\":[9.457,13.1]},{\"speaker\":\"王一飞\",\"hanzi\":\"好。现在我来说，你们在本子上面写。\",\"pinyin\":\"Hǎo. Xiànzài wǒ lái shuō, nǐmen zài běnzi shàngmian xiě.\",\"track\":\"audio_13_3\",\"trackLabel\":\"13-3\",\"textNo\":2,\"segment\":[13.16,18.987]},{\"speaker\":\"白家月\",\"hanzi\":\"同学们，“洗手间”的“间”字写错了，它的里面是“日”，不是“口”。\",\"pinyin\":\"Tóngxuém \":\"2-1\",\"textNo\":1,\"segment\":[0,6.019]},{\"speaker\":\"李文\",\"hanzi\":\"李文：谢谢一雪姐，我都可以，你们点吧。\",\"pinyin\":\"Lǐ Wén: Xièxie Yīxuě jiě, wǒ dōu kěyǐ, nǐmen diǎn ba.\",\"track\":\"hsk3_02_t1\",\"trackLabel\":\"2-1\",\"textNo\":1,\"segment\":[6.079,10.048]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：飞了这么远，现在还真是又饿又渴。\",\"pinyin\":\"Bái Jiāyuè: Fēile zhème yuǎn, xiànzài hái zhēn shì yòu è yòu kě.\",\"track\":\"hsk3_02_t1\",\"trackLabel\":\"2-1\",\"textNo\":1,\"segment\":[10.108,14.167]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：那多点点儿，别客气。你们喝什么饮料？\",\"pinyin\":\"Wáng Yīxuě: Nà duō diǎn diǎnr, bié kèqi. Nǐmen hē shénme yǐnliào?\",\"track\":\"hsk3_02_t1\",\"trackLabel\":\"2-1\",\"textNo\":1,\"segment\":[14.227,18.727]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：好久没喝中国茶，也好久没吃饺子了。我想喝绿茶、吃饺子，可以吗？\",\"pinyin\":\"Bái Jiāyuè: Hǎojiǔ méi hē Zhōngguó chá, yě hǎojiǔ méi chī jiǎozi le. Wǒ xiǎng hē lǜchá, chī jiǎozi, kěyǐ ma?\",\"track\":\"hsk3_02_t1\",\"trackLabel\":\"2-1\",\"textNo\":1,\"segment\":[18.787,26.737]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：没问题。你们看看还想吃什么。\",\"pinyin\":\"Wáng Yīxuě: Méi wèntí. Nǐmen kànkan hái xiǎng chī shénme.\",\"track\":\"hsk3_02_t1\",\"trackLabel\":\"2-1\",\"textNo\":1,\"segment\":[26.797,30.74]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：服务员，再给我们拿一双筷子、一个勺子和一个碗。\",\"pinyin\":\"Wáng Yīxuě: Fúwùyuán, zài gěi wǒmen ná yì shuāng kuàizi, yí gè sháozi hé yí gè wǎn.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[0,0.556]},{\"speaker\":\"服务员\",\"hanzi\":\"服务员：好的，请等一下，我马上去拿。\",\"pinyin\":\"Fúwùyuán: Hǎo de, qǐng děng yíxià, wǒ mǎshàng qù ná.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[0.616,6.491]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：这家饭馆的服务很热情，菜也都做得很好吃。你们尝尝，看喜不喜欢这些菜。\",\"pinyin\":\"Wáng Yīxuě: Zhè jiā fànguǎn de fúwù hěn rèqíng, cài yě dōu zuò de hěn hǎochī. Nǐmen chángchang, kàn xǐ bu xǐhuan zhèxiē cài.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[6.551,17.985]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：哪个菜都好吃。您点的这些菜真不错。\",\"pinyin\":\"Bái Jiāyuè: Nǎge cài dōu hǎochī. Nín diǎn de zhèxiē cài zhēn búcuò.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[18.045,22.952]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：这里的饭菜又便宜又好吃，我们经常来，服务员都记住我们爱吃的菜了。\",\"pinyin\":\"Wáng Yīxuě: Zhèlǐ de fàncài yòu piányí yòu hǎochī, wǒmen jīngcháng lái, fúwùyuán dōu jìzhù wǒmen ài chī de cài le.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[23.012,30.748]},{\"speaker\":\"服务员\",\"hanzi\":\"服务员：王姐，您经常来吃饭，今天送您一些水果，请慢用。\",\"pinyin\":\"Fúwùyuán: Wáng jiě, nín jīngcháng lái chīfàn, jīntiān sòng nín yīxiē shuǐguǒ, qǐng mànyòng.\",\"track\":\"hsk3_02_t2\",\"trackLabel\":\"2-2\",\"textNo\":2,\"segment\":[30.808,37.33]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：这个鸡肉饭太好吃了，我要再来吃一次。\",\"pinyin\":\"Bái Jiāyuè: Zhège jīròu fàn tài hǎochī le, wǒ yào zài lái chī yí cì.\",\"track\":\"hsk3_02_t3\",\"trackLabel\":\"2-3\",\"textNo\":3,\"segment\":[0,5.246]},{\"speaker\":\"李文\",\"hanzi\":\"李文：你可以拿走这张菜单，看看下次还吃点儿什么。\",\"pinyin\":\"Lǐ Wén: Nǐ kěyǐ ná zǒu zhè zhāng càidān, kànkan xià cì hái chī diǎnr shénme.\",\"track\":\"hsk3_02_t3\",\"trackLabel\":\"2-3\",\"textNo\":3,\"segment\":[5.306,17.228]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：不用拿菜单，在手机上就能看到，也可以选好了让他们给你送。\",\"pinyin\":\"Wáng Yīxuě: Bùyòng ná càidān, zài shǒujī shàng jiù néng kàndào, yě kěyǐ xuǎn hǎo le ràng tāmen gěi nǐ sòng.\",\"track\":\"hsk3_02_t3\",\"trackLabel\":\"2-3\",\"textNo\":3,\"segment\":[17.288,20.146]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：他们家还能送外卖？\",\"pinyin\":\"Bái Jiāyuè: Tāmen jiā hái néng sòng wàimài?\",\"track\":\"hsk3_02_t3\",\"trackLabel\":\"2-3\",\"textNo\":3,\"segment\":[20.206,21.414]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：对，现在很多饭馆都能送外卖，想吃什么就点什么。\",\"pinyin\":\"Wáng Yīxuě: Duì, xiànzài hěn duō fànguǎn dōu néng sòng wàimài, xiǎng chī shénme jiù diǎn shénme.\",\"track\":\"hsk3_02_t3\",\"trackLabel\":\"2-3\",\"textNo\":3,\"segment\":[21.474,26.793]},{\"speaker\":\"白家月\",\"hanzi\":\"白家 ǐhuan pāizhào, páshān de shíhou wǒ gěi nín zhào jǐ zhāng zhàopiàn ba.\",\"track\":\"hsk3_05_t2\",\"trackLabel\":\"5-2\",\"textNo\":2,\"segment\":[24.963,33.647]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：好，我可以比较一下你们两个谁的水平高。\",\"pinyin\":\"Hǎo, wǒ kěyǐ bǐjiào yíxià nǐmen liǎng ge shéi de shuǐpíng gāo.\",\"track\":\"hsk3_05_t2\",\"trackLabel\":\"5-2\",\"textNo\":2,\"segment\":[33.707,39.02]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：家月，这里挺漂亮的，咱们在这里拍照吧。\",\"pinyin\":\"Jiāyuè, zhèlǐ tǐng piàoliang de, zánmen zài zhèlǐ pāizhào ba.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[0,5.648]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：这边没有太阳，咱们去那边吧。\",\"pinyin\":\"Zhèbiān méiyǒu tàiyáng, zánmen qù nàbiān ba.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[5.708,10.589]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：好。你觉得我站在这些树中间怎么样？\",\"pinyin\":\"Hǎo. Nǐ juéde wǒ zhàn zài zhèxiē shù zhōngjiān zěnmeyàng?\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[10.649,16.056]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：挺好的。等一下，后边走过去两个人。\",\"pinyin\":\"Tǐng hǎo de. Děng yíxià, hòubian zǒu guòqu liǎng ge rén.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[16.116,21.906]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我准备好了，你照的时候告诉我。\",\"pinyin\":\"Wǒ zhǔnbèi hǎo le, nǐ zhào de shíhou gàosu wǒ.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[21.966,26.462]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：你不用看着我，想干什么就可以。\",\"pinyin\":\"Nǐ bú yòng kànzhe wǒ, xiǎng gàn shénme jiù kěyǐ.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[26.522,31.07]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：树上飞来了几只鸟，我就看它们吧。\",\"pinyin\":\"Shù shàng fēilái le jǐ zhī niǎo, wǒ jiù kàn tāmen ba.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[31.13,36.017]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：啊，手机没电了。\",\"pinyin\":\"A, shǒujī méi diàn le.\",\"track\":\"hsk3_05_t3\",\"trackLabel\":\"5-3\",\"textNo\":3,\"segment\":[36.077,40.09]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。我已经告诉了一飞，你的拍照水平比她高，她难过得很，哈哈。不知道你对中国的音乐有没有兴趣？我送你一张明天下午音乐会的门票。音乐会七点多结束，你听完了音乐会就来我家吃饭，尝尝我做的中国菜。你觉得怎么样？\",\"pinyin\":\"Jiāyuè, wǒ shōudào le nǐ de nà fēng yóujiàn, yě kàndào le nǐ gěi wǒ zhào de zhàopiàn, zhāngzhāng dōu hěn piàoliang. Wǒ yǐjīng gàosu le Yīfēi, nǐ de pāizhào shuǐpíng bǐ tā gāo, tā nánguò de hěn, hāhā. Bù zhīdào nǐ duì Zhōngguó de yīnyuè yǒu méiyǒu xìngqù? Wǒ sòng nǐ yì zhāng míngtiān xiàwǔ yīnyuèhuì de ménpiào. Yīnyuèhuì qī diǎn duō jiéshù, nǐ tīng wán le yīnyuèhuì jiù lái wǒ jiā chīfàn, chángchang wǒ zuò de Zhōngguó cài. Nǐ juéde zěnmeyàng?\",\"track\":\"hsk3_05_t4\",\"trackLabel\":\"5-4\",\"textNo\":4,\"segment\":[0,31.49]}]},{\"source\":{\"file\":\"hsk3-bt06.html\",\"sha256\":\"1bc8c0943577e80b15630eb8cfb2b04e7b62ea8b42821d9eff3942d92f48fa55\",\"title\":\"新HSK3 Bài 6\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":6,\"audioSha256\":{\"hsk3_06_v1\":\"b13fa426001574d22dd9483b0d342ba5b7fca4a3b21c6faaeefbd9f91f5c389b\",\"hsk3_06_v2\":\"e9f35c8575a780028e527bf4d889122861d58035666b749bc515873106ac8bfe\",\"hsk3_06_v3\":\"8395359505be0df7c5fff4aba560c8921f5bae311df5d9cb38534f375e91be94\",\"hsk3_06_v4\":\"78e4a3584d254d7bf8074cb03a49e78f1354d1ee7ab16229918325dbfdde9dcb\",\"hsk3_06_t1\":\"1f99ef107dc1c539b5bb547d04c9c2b23e8f16355713b9326ae18789393ea9a2\",\"hsk3_06_t2\":\"afb03fd625af1327c4c2d53ee993e9c6b82d3ba4197f09996daefc5fc452aafc\",\"hsk3_06_t3\":\"c26c1369187595a28d5df36bbacaa6ad7f64fdf9faa2ef005ba90733487c194d\",\"hsk3_06_t4\":\"deb41b9e7f1d48194dc341e4deecc167f44b58e5607cfd432f0a9faa91e8ddec\"}},\"vocabulary\":[{\"hanzi\":\"该\",\"pinyin\":\"gāi\",\"meaning\":\"nên\",\"partOfSpeech\":\"Động từ năng nguyện\",\"track\":\"hsk3_06_v1\",\"trackLabel\":\"6-1\",\"segment\":[0,1.27]},{\"hanzi\":\"打算\",\"pinyin\":\"dǎsuàn\",\"meaning\":\"dự định, kế hoạch\",\"partOfSpeech\":\"Động từ / Danh từ\",\"track\":\"hsk3_06_v1\",\"trackLabel\":\ ackLabel\":\"6-4\",\"segment\":[13.369,15.182]},{\"hanzi\":\"必须\",\"pinyin\":\"bìxū\",\"meaning\":\"phải, nhất định phải\",\"partOfSpeech\":\"Phó từ\",\"track\":\"hsk3_06_v4\",\"trackLabel\":\"6-4\",\"segment\":[15.242,17.89]}],\"dialogue\":[{\"speaker\":\"李文\",\"hanzi\":\"李文：家月，咱们该买去上海的票了。你打算怎么去上海？\",\"pinyin\":\"Jiāyuè, zánmen gāi mǎi qù Shànghǎi de piào le. Nǐ dǎsuàn zěnme qù Shànghǎi?\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[0,6.03]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我还没坐过高铁，咱们坐高铁去，怎么样？\",\"pinyin\":\"Wǒ hái méi zuò guo gāotiě, zánmen zuò gāotiě qù, zěnmeyàng?\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[6.09,10.984]},{\"speaker\":\"李文\",\"hanzi\":\"李文：没问题，从北京到上海的高铁很多，非常方便。\",\"pinyin\":\"Méi wèntí, cóng Běijīng dào Shànghǎi de gāotiě hěn duō, fēicháng fāngbiàn.\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[11.044,16.577]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：行！怎么买高铁票？\",\"pinyin\":\"Xíng! Zěnme mǎi gāotiě piào?\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[16.637,19.391]},{\"speaker\":\"李文\",\"hanzi\":\"李文：用手机App就能买。给我你的护照，我帮你买。\",\"pinyin\":\"Yòng shǒujī App jiù néng mǎi. Gěi wǒ nǐ de hùzhào, wǒ bāng nǐ mǎi.\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[19.451,24.445]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：早就听说过高铁，终于可以坐上了。\",\"pinyin\":\"Zǎo jiù tīngshuō guo gāotiě, zhōngyú kěyǐ zuò shàng le.\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[24.505,28.375]},{\"speaker\":\"李文\",\"hanzi\":\"李文：高铁又快又舒服，你一定会喜欢的。\",\"pinyin\":\"Gāotiě yòu kuài yòu shūfu, nǐ yídìng huì xǐhuan de.\",\"track\":\"hsk3_06_t1\",\"trackLabel\":\"6-1\",\"textNo\":1,\"segment\":[28.435,33.21]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：过了前面的路口就到高铁站了。\",\"pinyin\":\"Guò le qiánmiàn de lùkǒu jiù dào gāotiězhàn le.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[0,4.657]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我看见了。马上就到了，这条路车很多，您小心点儿。\",\"pinyin\":\"Wǒ kànjiàn le. Mǎshàng jiù dào le, zhè tiáo lù chē hěn duō, nín xiǎoxīn diǎnr.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[4.717,7.662]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：好，你们还有一个小时，应该不会迟到的。\",\"pinyin\":\"Hǎo, nǐmen hái yǒu yí ge xiǎoshí, yīnggāi bú huì chídào de.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[7.722,11.897]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我发现这条路车多，红绿灯也多。\",\"pinyin\":\"Wǒ fāxiàn zhè tiáo lù chē duō, hónglǜdēng yě duō.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[11.957,16.451]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：是啊，这条路我走过一次，后来再也不走了。\",\"pinyin\":\"Shì a, zhè tiáo lù wǒ zǒu guo yí cì, hòulái zài yě bù zǒu le.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[16.511,21.121]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：那您今天为什么走了这条路？\",\"pinyin\":\"Nà nín jīntiān wèishénme zǒu le zhè tiáo lù?\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[21.181,25.599]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：我一急就走错了。如果没走错，二十分钟以前就到了。\",\"pinyin\":\"Wǒ yì jí jiù zǒu cuò le. Rúguǒ méi zǒu cuò, èrshí fēnzhōng yǐqián jiù dào le.\",\"track\":\"hsk3_06_t2\",\"trackLabel\":\"6-2\",\"textNo\":2,\"segment\":[25.659,35.37]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：李文，我的耳机没电了，你有充电宝吗？\",\"pinyin\":\"Lǐ Wén, wǒ de ěrjī méi diàn le, nǐ yǒu chōngdiànbǎo ma?\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[0,4.617]},{\"speaker\":\"李文\",\"hanzi\":\"李文：有，这些常用的东西我都放在包里了，我给你拿。\",\"pinyin\":\"Yǒu, zhèxiē chángyòng de dōngxi wǒ dōu fàng zài bāo lǐ le, wǒ gěi nǐ ná.\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[4.677,5.803]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：前面的人越来越多。\",\"pinyin\":\"Qiánmiàn de rén yuèláiyuè duō.\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[5.863,10.476]},{\"speaker\":\"李文\",\"hanzi\":\"李文：对，马上就进高铁站了。咱们一起走，别分开。\",\"pinyin\":\"Duì, mǎshàng jiù jìn gāotiězhàn le. Zánmen yìqǐ zǒu, bié fēnkāi.\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[10.536,12.825]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：好，你检查一下，高铁票都拿好了吗？\",\"pinyin\":\"Hǎo, nǐ jiǎnchá yíxià, gāotiě piào dōu ná hǎo le ma?\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[12.885,14.267]},{\"speaker\":\"李文\",\"hanzi\":\"李文：不用拿票，刷护照就能检票进站。\",\"pinyin\":\"Bú yòng ná piào, shuā hùzhào jiù néng jiǎnpiào jìnzhàn.\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[14.327,27.34]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：去哪里检票？\",\"pinyin\":\"Qù nǎlǐ jiǎnpiào?\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[27.4,29.316]},{\"speaker\":\"李文\",\"hanzi\":\"李文：检票口在二层，我们一会儿坐电梯上去。\",\"pinyin\":\"Jiǎnpiàokǒu zài èr céng, wǒmen yíhuìr zuò diàntī shàngqu.\",\"track\":\"hsk3_06_t3\",\"trackLabel\":\"6-3\",\"textNo\":3,\"segment\":[29.376,34.28]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：这次放假，我去了北京，还去了上海。我是从北京南站坐高铁去的上海。我觉得坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。坐累了就站一会儿，饿了就点外卖。对，你没听错，高铁上可以点外卖，只需要选择好车站和想吃的东西，到站时不用下车，服务员就会给你拿过来。现在喜欢坐高铁的人越来越多。我爸妈来中国旅游的时候，必须带他们也坐一次高铁。\",\"pinyin\":\"Zhè cì fàngjià, wǒ qù le Běijīng, hái qù le Shànghǎi. Wǒ shì cóng Běijīng Nán Zhàn zuò gāotiě qù de Shànghǎi. Wǒ juéde zuò zài gāotiě shàng gēn zuò zài jiālǐ de shāfā shàng yíyàng, yòu ānjìng yòu shūfu. Zuò lèi le jiù zhàn yíhuìr, è le jiù diǎn wàimài. Duì, nǐ méi tīng cuò, gāotiě shàng kěyǐ diǎn wàimài, zhǐ xūyào xuǎnzé hǎo chēzhàn hé xiǎng chī de dōngxi, dào zhàn shí bú yòng xià chē, fúwùyuán jiù huì gěi nǐ ná guòlái. Xiànzài xǐhuan zuò gāotiě de rén yuèláiyuè duō. Wǒ bàmā lái Zhōngguó lǚyóu de shíhou, bìxū dài tāmen yě zuò yí cì gāotiě.\",\"track\":\"hsk3_06_t4\",\"trackLabel\":\"6-4\",\"textNo\":4,\"segment\":[0,48.59]}]},{\"source\":{\"file\":\"hsk3-bt07.html\",\"sha256\":\"eb5f270348b1a08b6d16aca7eeece6ccb7c18f94063ad16102ed0795cb5b45c1\",\"title\":\"新HSK3 Bài 7\", ":\"xiāngjiāo\",\"meaning\":\"chuối tiêu\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_07_v3\",\"trackLabel\":\"7-3\",\"segment\":[18.186,19.308]},{\"hanzi\":\"一共\",\"pinyin\":\"yígòng\",\"meaning\":\"tổng cộng\",\"partOfSpeech\":\"Phó từ\",\"track\":\"hsk3_07_v3\",\"trackLabel\":\"7-3\",\"segment\":[19.368,20.498]},{\"hanzi\":\"毛\",\"pinyin\":\"máo\",\"meaning\":\"hào (đơn vị tiền tệ)\",\"partOfSpeech\":\"Lượng từ\",\"track\":\"hsk3_07_v3\",\"trackLabel\":\"7-3\",\"segment\":[20.558,22.86]},{\"hanzi\":\"结婚\",\"pinyin\":\"jiéhūn\",\"meaning\":\"kết hôn\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_07_v4\",\"trackLabel\":\"7-4\",\"segment\":[0,1.557]},{\"hanzi\":\"不但\",\"pinyin\":\"bùdàn\",\"meaning\":\"không những\",\"partOfSpeech\":\"Liên từ\",\"track\":\"hsk3_07_v4\",\"trackLabel\":\"7-4\",\"segment\":[1.617,3.939]},{\"hanzi\":\"而且\",\"pinyin\":\"érqiě\",\"meaning\":\"mà còn\",\"partOfSpeech\":\"Liên từ\",\"track\":\"hsk3_07_v4\",\"trackLabel\":\"7-4\",\"segment\":[3.999,5.136]},{\"hanzi\":\"声\",\"pinyin\":\"shēng\",\"meaning\":\"tiếng (dùng cho âm thanh), âm thanh\",\"partOfSpeech\":\"Lượng từ / Danh từ\",\"track\":\"hsk3_07_v4\",\"trackLabel\":\"7-4\",\"segment\":[5.196,9.995]},{\"hanzi\":\"开机\",\"pinyin\":\"kāijī\",\"meaning\":\"mở máy, bật máy\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_07_v4\",\"trackLabel\":\"7-4\",\"segment\":[10.055,13.09]}],\"dialogue\":[{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：这辆自行车是小雪八岁的时候买的，看起来有点儿旧了。\",\"pinyin\":\"Zhè liàng zìxíngchē shì Xiǎoxuě bā suì de shíhou mǎi de, kàn qǐlái yǒudiǎnr jiù le.\",\"track\":\"hsk3_07_t1\",\"trackLabel\":\"7-1\",\"textNo\":1,\"segment\":[0,6.481]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：是啊，她现在长高了，这辆车已经太矮了。\",\"pinyin\":\"Shì a, tā xiànzài zhǎng gāo le, zhè liàng chē yǐjīng tài ǎi le.\",\"track\":\"hsk3_07_t1\",\"trackLabel\":\"7-1\",\"textNo\":1,\"segment\":[6.541,12.53]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：商场里开了一家自行车店，咱们给她买辆新的吧。\",\"pinyin\":\"Shāngchǎng lǐ kāi le yì jiā zìxíngchē diàn, zánmen gěi tā i\":\"王一雪：我多看看再决定。你看，那边有买二送一！\",\"pinyin\":\"Wǒ duō kànkan zài juédìng. Nǐ kàn, nàbiān yǒu mǎi èr sòng yī!\",\"track\":\"hsk3_07_t2\",\"trackLabel\":\"7-2\",\"textNo\":2,\"segment\":[27.066,30.45]},{\"speaker\":\"店员\",\"hanzi\":\"店员：西瓜又大又新鲜，不甜不要钱！\",\"pinyin\":\"Xīguā yòu dà yòu xīnxiān, bù tián bú yào qián!\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[0,4.521]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：西瓜看起来不错，怎么卖？\",\"pinyin\":\"Xīguā kàn qǐlái búcuò, zěnme mài?\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[4.581,8.148]},{\"speaker\":\"店员\",\"hanzi\":\"店员：五块钱一公斤。来，您先尝尝这块冰西瓜，甜极了！\",\"pinyin\":\"Wǔ kuài qián yì gōngjīn. Lái, nín xiān chángchang zhè kuài bīng xīguā, tián jí le!\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[8.208,14.573]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：是挺甜的！帮我选个大点儿的，再来两斤香蕉。\",\"pinyin\":\"Shì tǐng tián de! Bāng wǒ xuǎn ge dà diǎnr de, zài lái liǎng jīn xiāngjiāo.\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[14.633,20.345]},{\"speaker\":\"店员\",\"hanzi\":\"店员：一共五十八块五毛。\",\"pinyin\":\"Yígòng wǔshíbā kuài wǔ máo.\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[20.405,23.451]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我买了这么多，便宜点儿吧。\",\"pinyin\":\"Wǒ mǎi le zhème duō, piányi diǎnr ba.\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[23.511,27.105]},{\"speaker\":\"店员\",\"hanzi\":\"店员：您给我五十五吧，不能再便宜了。\",\"pinyin\":\"Nín gěi wǒ wǔshíwǔ ba, bù néng zài piányi le.\",\"track\":\"hsk3_07_t3\",\"trackLabel\":\"7-3\",\"textNo\":3,\"segment\":[27.165,31.26]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：这几天我们在新家坐着看电视的时候，又发现了新问题。房子大了，电视看起来就有点儿小。这个电视是我们结婚时买的，是时候换个新电视了。今天我一直在网上选电视，没想到，现在的电视不但便宜，而且用着非常方便，有的电视叫它一声就能开机。我看了好几个，都很满意，晚上让一雪来决定吧。\",\"pinyin\":\"Zhè jǐ tiān wǒmen zài xīn jiā zuòzhe kàn diànshì de shíhou, yòu fāxiàn le xīn wèntí. Fángzi dà le, diànshì kàn qǐlái jiù yǒudiǎnr xiǎo. Zhège diànshì shì wǒmen j ent\":[25.773,30.263]},{\"speaker\":\"李文\",\"hanzi\":\"李文：我在教天中打羽毛球，你可以过来跟我们一起练。\",\"pinyin\":\"Wǒ zài jiāo Tiānzhōng dǎ yǔmáoqiú, nǐ kěyǐ guòlái gēn wǒmen yìqǐ liàn.\",\"track\":\"hsk3_09_t2\",\"trackLabel\":\"9-2\",\"textNo\":2,\"segment\":[30.323,36.52]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：足球比赛已经开始了，快过来看吧！\",\"pinyin\":\"Zúqiú bǐsài yǐjīng kāishǐ le, kuài guòlái kàn ba!\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[0,4.956]},{\"speaker\":\"李文\",\"hanzi\":\"李文：你们先看，冰箱里有啤酒和饮料，我去拿一下。\",\"pinyin\":\"Nǐmen xiān kàn, bīngxiāng lǐ yǒu píjiǔ hé yǐnliào, wǒ qù ná yíxià.\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[5.016,10.379]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：今天怎么回事？总是踢不进去！\",\"pinyin\":\"Jīntiān zěnme huí shì? Zǒngshì tī bù jìnqu!\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[10.439,14.155]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：几个老球员生病了，新球员第一次参加这么重要的比赛，太紧张了。\",\"pinyin\":\"Jǐ ge lǎo qiúyuán shēngbìng le, xīn qiúyuán dì yí cì cānjiā zhème zhòngyào de bǐsài, tài jǐnzhāng le.\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[14.215,21.62]},{\"speaker\":\"李文\",\"hanzi\":\"李文：是啊，主要的球员没参加比赛，所以大家也都受到影响了。\",\"pinyin\":\"Shì a, zhǔyào de qiúyuán méi cānjiā bǐsài, suǒyǐ dàjiā yě dōu shòudào yǐngxiǎng le.\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[21.68,28.195]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：越看越着急。我不看了，你们告诉我得分吧。\",\"pinyin\":\"Yuè kàn yuè zháojí. Wǒ bú kàn le, nǐmen gàosu wǒ défēn ba.\",\"track\":\"hsk3_09_t3\",\"trackLabel\":\"9-3\",\"textNo\":3,\"segment\":[28.255,34.18]},{\"speaker\":\"李文\",\"hanzi\":\"李文：我喜欢看体育比赛，最爱看的就是奥运会。奥运会是世界上影响最大的体育比赛。从1896年到2024年，每次奥运会都有非常多的运动员参加。第一位参加奥运会的中国运动员是刘长春，他1932年参加了100米和200米短跑比赛。虽然他没有得到好成绩，但是他让世界认识了中国。\",\"pinyin\":\"Wǒ xǐhuan kàn tǐyù bǐsài, zuì ài kàn de jiù shì Àoyùnhuì. Àoyùnhuì shì shìjiè shàng yǐngxiǎng zuì dà de tǐyù bǐsài. Cóng 1896 nián dào 2024 nián, měi cì Àoyùnhuì dōu yǒu f ack\":\"hsk3_11_t1\",\"trackLabel\":\"11-1\",\"textNo\":1,\"segment\":[8.118,10.73]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：后天上午十点，会议地点换到第一会议室。我正要给大家发邮件。\",\"pinyin\":\"Hòutiān shàngwǔ shí diǎn, huìyì dìdiǎn huàn dào dì-yī huìyìshì. Wǒ zhèng yào gěi dàjiā fā yóujiàn.\",\"track\":\"hsk3_11_t1\",\"trackLabel\":\"11-1\",\"textNo\":1,\"segment\":[10.79,18.506]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：开会的时候，我们用会议室的电脑还是自己的笔记本电脑？\",\"pinyin\":\"Kāihuì de shíhou, wǒmen yòng huìyìshì de diànnǎo háishi zìjǐ de bǐjìběn diànnǎo?\",\"track\":\"hsk3_11_t1\",\"trackLabel\":\"11-1\",\"textNo\":1,\"segment\":[18.566,24.58]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：会议室的电脑或者自己的电脑都可以。\",\"pinyin\":\"Huìyìshì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ.\",\"track\":\"hsk3_11_t1\",\"trackLabel\":\"11-1\",\"textNo\":1,\"segment\":[24.64,28.789]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：那到时候咱们早点儿过去，你帮我把电脑接好吧。\",\"pinyin\":\"Nà dào shíhou zánmen zǎo diǎnr guòqù, nǐ bāng wǒ bǎ diànnǎo jiē hǎo ba.\",\"track\":\"hsk3_11_t1\",\"trackLabel\":\"11-1\",\"textNo\":1,\"segment\":[28.849,34.7]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：电脑接好了吗？\",\"pinyin\":\"Diànnǎo jiē hǎo le ma?\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[0,7.551]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：已经接好了，您开机看看有没有问题。\",\"pinyin\":\"Yǐjīng jiē hǎo le, nín kāijī kànkan yǒu méiyǒu wèntí.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[7.611,10.514]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：现在什么都看不见。\",\"pinyin\":\"Xiànzài shénme dōu kàn bu jiàn.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[10.574,14.384]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：我检查一下哪里出问题了……您再试一下。\",\"pinyin\":\"Wǒ jiǎnchá yíxià nǎlǐ chū wèntí le... Nín zài shì yíxià.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[14.444,16.772]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：看见了，但是听不见声音。\",\"pinyin\":\"Kànjiàn le, dànshì tīng bu jiàn shēngyīn.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[16.832,20.36]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：现在呢？\",\"pinyin\":\"Xiànzài ne?\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[20.42,22.53]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：听得见声音，但是声音有点儿小，听不清楚。\",\"pinyin\":\"Tīng de jiàn shēngyīn, dànshì shēngyīn yǒudiǎnr xiǎo, tīng bu qīngchu.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[22.59,28.124]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：看来我没办法解决这个问题，只能找别人来帮帮忙了。\",\"pinyin\":\"Kànlái wǒ méi bànfǎ jiějué zhège wèntí, zhǐnéng zhǎo biérén lái bāngbangmáng le.\",\"track\":\"hsk3_11_t2\",\"trackLabel\":\"11-2\",\"textNo\":2,\"segment\":[28.184,35.48]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：同乐，你看见老张了吗？\",\"pinyin\":\"Tónglè, nǐ kànjiàn Lǎo Zhāng le ma?\",\"track\":\"hsk3_11_t3\",\"trackLabel\":\"11-3\",\"textNo\":3,\"segment\":[0,8.232]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：老张没来。他说家里有点儿事，所以请假了。\",\"pinyin\":\"Lǎo Zhāng méi lái. Tā shuō jiālǐ yǒudiǎnr shì, suǒyǐ qǐngjià le.\",\"track\":\"hsk3_11_t3\",\"trackLabel\":\"11-3\",\"textNo\":3,\"segment\":[8.292,22.123]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：好几个同事都休假了，开会前这么多工作我怕干不完。\",\"pinyin\":\"Hǎo jǐ ge tóngshì dōu xiūjià le, kāihuì qián zhème duō gōngzuò wǒ pà gàn bu wán.\",\"track\":\"hsk3_11_t3\",\"trackLabel\":\"11-3\",\"textNo\":3,\"segment\":[22.183,25.696]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。\",\"pinyin\":\"Shí'èr diǎn duō le, zánmen xiān qù chīfàn ba. Chī wán fàn, wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán.\",\"track\":\"hsk3_11_t3\",\"trackLabel\":\"11-3\",\"textNo\":3,\"segment\":[25.756,29.402]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。\",\"pinyin\":\"Nǐ xiān qù chī, wǒ xiǎng zài gàn yíhuìr. Míngtiān kāihuì qián yào fā dào gōngsī de yóuxiāng lǐ.\",\"track\":\"hsk3_11_t3\",\"trackLabel\":\"11-3\",\"textNo\":3,\"segment\":[29.462,31.551]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：您没看到邮件吗？经理还没回来呢，下周才能开会。\",\"pinyin\":\"Nín tNo\":1,\"segment\":[25.175,29.572]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：那咱们换一天去？\",\"pinyin\":\"Nà zánmen huàn yì tiān qù?\",\"track\":\"hsk3_12_t1\",\"trackLabel\":\"12-1\",\"textNo\":1,\"segment\":[29.632,32.056]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：行。或者明天去，或者后天去，我给你打电话。\",\"pinyin\":\"Xíng. Huòzhě míngtiān qù, huòzhě hòutiān qù, wǒ gěi nǐ dǎ diànhuà.\",\"track\":\"hsk3_12_t1\",\"trackLabel\":\"12-1\",\"textNo\":1,\"segment\":[32.116,38.42]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：刚才还是大晴天呢，怎么突然就刮起风来了？\",\"pinyin\":\"Gāngcái háishi dà qíngtiān ne, zěnme tūrán jiù guā qǐ fēng lái le?\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[0,5.194]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：好像新闻里说今天有雨。\",\"pinyin\":\"Hǎoxiàng xīnwén lǐ shuō jīntiān yǒu yǔ.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[5.254,8.525]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：啊？我每天书包里都放着雨伞，就今天没带。\",\"pinyin\":\"A? Wǒ měitiān shūbāo lǐ dōu fàngzhe yǔsǎn, jiù jīntiān méi dài.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[8.585,15.029]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：我可以借给你，我车里有一把伞和一件雨衣。\",\"pinyin\":\"Wǒ kěyǐ jiè gěi nǐ, wǒ chē lǐ yǒu yì bǎ sǎn hé yí jiàn yǔyī.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[15.089,20.732]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：谢谢，希望下午天气能变好。\",\"pinyin\":\"Xièxie, xīwàng xiàwǔ tiānqì néng biàn hǎo.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[20.792,25.403]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：这个季节天气变化很快。\",\"pinyin\":\"Zhège jìjié tiānqì biànhuà hěn kuài.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[25.463,28.558]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：雨已经下起来了，咱们快点儿走吧。\",\"pinyin\":\"Yǔ yǐjīng xià qǐlái le, zánmen kuài diǎnr zǒu ba.\",\"track\":\"hsk3_12_t2\",\"trackLabel\":\"12-2\",\"textNo\":2,\"segment\":[28.618,32.56]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：您来这里已经一年多了，习惯了吧？\",\"pinyin\":\"Nín lái zhèlǐ yǐjīng yì nián duō le, xíguàn le ba?\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[0,4.78]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：别的早就习惯了，就是天气我还不太习惯。\",\"pinyin\":\"Bié de zǎo jiù xíguàn le, jiùshì tiānqì wǒ hái bú tài xíguàn.\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[4.84,10.663]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：为什么？您不喜欢这里的天气吗？\",\"pinyin\":\"Wèishénme? Nín bù xǐhuan zhèlǐ de tiānqì ma?\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[10.723,15.37]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：我觉得冬天太冷了。\",\"pinyin\":\"Wǒ juéde dōngtiān tài lěng le.\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[15.43,18.97]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：冬天虽然冷，但是下雪的时候特别漂亮。\",\"pinyin\":\"Dōngtiān suīrán lěng, dànshì xiàxuě de shíhou tèbié piàoliang.\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[19.03,24.256]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：我也喜欢雪。北京常常下雪，但听说今年就下了一次。\",\"pinyin\":\"Wǒ yě xǐhuan xuě. Běijīng chángcháng xiàxuě, dàn tīngshuō jīnnián jiù xià le yí cì.\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[24.316,32.64]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我没关注过北京的天气，但是新闻里说过，今年冬天很多地方雪下得都少了。\",\"pinyin\":\"Wǒ méi guānzhù guo Běijīng de tiānqì, dànshì xīnwén lǐ shuō guo, jīnnián dōngtiān hěn duō dìfang xuě xià de dōu shǎo le.\",\"track\":\"hsk3_12_t3\",\"trackLabel\":\"12-3\",\"textNo\":3,\"segment\":[32.7,41.55]},{\"speaker\":\"王一飞\",\"hanzi\":\"王一飞：我离开北京到这里工作一年多了。这一年多住下来，我还是更喜欢北京的四季。北京的春天最舒服，天气不冷不热。夏天白天很热，但是晚上比较凉快。秋天树上的叶子都变成了红色、黄色，非常漂亮。冬天不但冷，而且风很大，我最不喜欢冬天。每个人都有自己最喜欢的季节，你最喜欢哪个季节呢？\",\"pinyin\":\"Wǒ líkāi Běijīng dào zhèlǐ gōngzuò yì nián duō le. Zhè yì nián duō zhù xiàlái, wǒ háishi gèng xǐhuan Běijīng de sìjì. Běijīng de chūntiān zuì shūfu, tiānqì bù lěng bù rè. Xiàtiān báitiān hěn rè, dànshì wǎnshang bǐjiào liángkuai. Qiūtiān shù shàng de yèzi dōu biànchéng le hóngsè, h _13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[0,5.01]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：那我就不客气了。听说这家饭馆的鱼做得很特别？\",\"pinyin\":\"Nà wǒ jiù bú kèqi le. Tīngshuō zhè jiā fànguǎn de yú zuò de hěn tèbié?\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[5.07,7.237]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：对，南方菜跟你们北方菜的做法不同。除了鱼，你们还想吃什么？\",\"pinyin\":\"Duì, nánfāng cài gēn nǐmen běifāng cài de zuòfǎ bù tóng. Chúle yú, nǐmen hái xiǎng chī shénme?\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[7.297,11.453]},{\"speaker\":\"同事\",\"hanzi\":\"同事：我不常吃南方菜，还是你决定吧。\",\"pinyin\":\"Wǒ bù cháng chī nánfāng cài, háishi nǐ juédìng ba.\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[11.513,22.813]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：好，那再加一个鸡肉，一个……\",\"pinyin\":\"Hǎo, nà zài jiā yí ge jīròu, yí ge...\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[22.873,27.671]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：咱们就三个人，别点那么多。\",\"pinyin\":\"Zánmen jiù sān ge rén, bié diǎn nàme duō.\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[27.731,31.174]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：好，那先来这几个菜。\",\"pinyin\":\"Hǎo, nà xiān lái zhè jǐ ge cài.\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[31.234,34.33]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：对了，下周我儿子过生日，你们有时间的话，就来我家做客，我给你们做北京菜。\",\"pinyin\":\"Duì le, xià zhōu wǒ érzi guò shēngrì, nǐmen yǒu shíjiān dehuà, jiù lái wǒ jiā zuòkè, wǒ gěi nǐmen zuò Běijīng cài.\",\"track\":\"hsk3_13_t1\",\"trackLabel\":\"13-1\",\"textNo\":1,\"segment\":[34.39,42.75]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：第一次请新邻居来做客，总是担心有什么没准备好。\",\"pinyin\":\"Dì-yī cì qǐng xīn línjū lái zuòkè, zǒngshì dānxīn yǒu shénme méi zhǔnbèi hǎo.\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[0,6.916]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：放心吧，我帮你看了，都已经准备好了。\",\"pinyin\":\"Fàngxīn ba, wǒ bāng nǐ kàn le, dōu yǐjīng zhǔnbèi hǎo le.\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[6.976,12.927]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我记得刚才已经把饮料拿出来了，怎么不见了？\",\"pinyin\":\"Wǒ jìde gāngcái yǐjīng bǎ yǐnliào ná chūlái le, zěnme bú jiàn le?\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[12.987,18.795]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：我把饮料和酒都放进冰箱里了，客人来了再拿出来。\",\"pinyin\":\"Wǒ bǎ yǐnliào hé jiǔ dōu fàng jìn bīngxiāng lǐ le, kèrén lái le zài ná chūlái.\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[18.855,26.046]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：音乐的声音合适吗？\",\"pinyin\":\"Yīnyuè de shēngyīn héshì ma?\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[26.106,29.489]},{\"speaker\":\"刘明\",\"hanzi\":\"刘明：你把声音开得太大了，我去关小一点儿。\",\"pinyin\":\"Nǐ bǎ shēngyīn kāi de tài dà le, wǒ qù guān xiǎo yìdiǎnr.\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[29.549,34.737]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：好，那我们就等客人来吧。\",\"pinyin\":\"Hǎo, nà wǒmen jiù děng kèrén lái ba.\",\"track\":\"hsk3_13_t2\",\"trackLabel\":\"13-2\",\"textNo\":2,\"segment\":[34.797,39.36]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。\",\"pinyin\":\"Xièxie nǐmen lái cānjiā wǒ érzi de shēngrì wǎnhuì, xīwàng dàjiā jīnwǎn wán de kāixīn.\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[0,12.919]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：小明，生日快乐！我准备了一个小礼物，希望你喜欢！\",\"pinyin\":\"Xiǎomíng, shēngrì kuàilè! Wǒ zhǔnbèi le yí ge xiǎo lǐwù, xīwàng nǐ xǐhuan!\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[12.979,15.94]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：谢谢您，我可以打开吗？\",\"pinyin\":\"Xièxie nín, wǒ kěyǐ dǎkāi ma?\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[16.0,17.921]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：当然可以，你妈妈说你跟姐姐一样，都喜欢画画，对吗？\",\"pinyin\":\"Dāngrán kěyǐ, nǐ māma shuō nǐ gēn jiějie yíyàng, dōu xǐhuan huàhuà, duì ma?\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[17.981,23.597]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：对，我想做一名画家。啊！画板和画笔，这正是我需要的。我太喜欢了。\",\"pinyin\":\"Duì, wǒ xiǎng zuò yì míng huàjiā. A! Huàbǎn hé huàbǐ, zhè zhèng shì wǒ xūyào de. Wǒ tài xǐhuan le.\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[23.657,31.996]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我去把盘子拿过来，咱们一边吃蛋糕，一边聊天儿吧。\",\"pinyin\":\"Wǒ qù bǎ pánzi ná guòlái, zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba.\",\"track\":\"hsk3_13_t3\",\"trackLabel\":\"13-3\",\"textNo\":3,\"segment\":[32.056,38.19]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我的新邻居是来自英国的夫妻。上周我去他们家做客了。他们做了很多好吃的，还准备了英国的红茶。那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。他们年轻的时候喜欢旅游，他家有一张世界地图，上面每一个红点都是他们去过的地方。后来，他们感到东方的文化很特别，就开始学习中文。今天是小明的生日，我请他们到我家玩，来看看中国人的家，也尝尝中国菜。\",\"pinyin\":\"Wǒ de xīn línjū shì láizì Yīngguó de fūqī. Shàng zhōu wǒ qù tāmen jiā zuòkè le. Tāmen zuò le hěn duō hǎochī de, hái zhǔnbèi le Yīngguó de hóngchá. Nà tiān wǒ gēn tāmen yìbiān hē hóngchá, yìbiān liáotiānr, zhídào shí'èr diǎn duō cái huí jiā. Tāmen niánqīng de shíhou xǐhuan lǚyóu, tā jiā yǒu yì zhāng shìjiè dìtú, shàngmiàn měi yí ge hóng diǎn dōu shì tāmen qù guo de dìfang. Hòulái, tāmen gǎndào dōngfāng de wénhuà hěn tèbié, jiù kāishǐ xuéxí Zhōngwén. Jīntiān shì Xiǎomíng de shēngrì, wǒ qǐng tāmen dào wǒ jiā wán, lái kànkan Zhōngguó rén de jiā, yě chángchang Zhōngguó cài.\",\"track\":\"hsk3_13_t4\",\"trackLabel\":\"13-4\",\"textNo\":4,\"segment\":[0,46.45]}]},{\"source\":{\"file\":\"hsk3-bt14.html\",\"sha256\":\"fe146d2d2bb5e236588ab60e6487da5a4ae14b91b11a717854d71171ae13e29b\",\"title\":\"新HSK3 Bài 14\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":14,\"audioSha256\":{\"hsk3_14_v1\":\"9919bb96a2142003c765addaac251812d7ae817a86a6284ea1fa4b95b27b4771\",\"hsk3_14_v2\":\"991d182700f9cf153cc774030d37cce90f604bc9e6fbd3550cdf9c9375b760be\",\"hsk3_14_v3\":\"293a569eb6de5080a95d32ecff13eb8a83e633e6b39123519379ee5340 ":\"14-1\",\"textNo\":1,\"segment\":[19.016,21.776]},{\"speaker\":\"李文\",\"hanzi\":\"李文：我把名字写在纸上吧。我去了好几次图书馆，这本书都被别人借走了。\",\"pinyin\":\"Wǒ bǎ míngzi xiě zài zhǐ shàng ba. Wǒ qù le hǎo jǐ cì túshūguǎn, zhè běn shū dōu bèi biérén jiè zǒu le.\",\"track\":\"hsk3_14_t1\",\"trackLabel\":\"14-1\",\"textNo\":1,\"segment\":[21.836,26.401]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：《名人的故事》？我有这本书。明天我借给你吧。\",\"pinyin\":\"“Míngrén de Gùshi”? Wǒ yǒu zhè běn shū. Míngtiān wǒ jiè gěi nǐ ba.\",\"track\":\"hsk3_14_t1\",\"trackLabel\":\"14-1\",\"textNo\":1,\"segment\":[26.461,32.53]},{\"speaker\":\"安妮\",\"hanzi\":\"安妮：今天下课早，你一会儿做什么？\",\"pinyin\":\"Jīntiān xiàkè zǎo, nǐ yíhuìr zuò shénme?\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[0,5.166]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我今天忙得很，要先去图书馆借书，然后去游泳。\",\"pinyin\":\"Wǒ jīntiān máng de hěn, yào xiān qù túshūguǎn jiè shū, ránhòu qù yóuyǒng.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[5.226,11.971]},{\"speaker\":\"安妮\",\"hanzi\":\"安妮：咱们一起走吧，我想去图书馆看看中文报纸。\",\"pinyin\":\"Zánmen yìqǐ zǒu ba, wǒ xiǎng qù túshūguǎn kànkan Zhōngwén bàozhǐ.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[12.031,18.409]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：等等，我的校园卡不见了，没有卡进不去图书馆。\",\"pinyin\":\"Děngdeng, wǒ de xiàoyuánkǎ bú jiàn le, méiyǒu kǎ jìn bu qù túshūguǎn.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[18.469,25.138]},{\"speaker\":\"安妮\",\"hanzi\":\"安妮：你想想上一次用是什么时候？\",\"pinyin\":\"Nǐ xiǎngxiang shàng yí cì yòng shì shénme shíhou?\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[25.198,30.018]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：我忘记了，可能被我放在家里了。\",\"pinyin\":\"Wǒ wàngjì le, kěnéng bèi wǒ fàng zài jiālǐ le.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[30.078,35.07]},{\"speaker\":\"安妮\",\"hanzi\":\"安妮：进不去图书馆也没关系，上网看看有没有电子书。\",\"pinyin\":\"Jìn bu qù túshūguǎn yě méi guānxi, shàngwǎng kànkan yǒu méiyǒu diànzǐshū.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[35.13,42.29]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：不行，我必须去，我还得帮李文还书呢。\",\"pinyin\":\"Bù xíng, wǒ bìxū qù, wǒ hái děi bāng Lǐ Wén huán shū ne.\",\"track\":\"hsk3_14_t2\",\"trackLabel\":\"14-2\",\"textNo\":2,\"segment\":[42.35,47.65]},{\"speaker\":\"李文\",\"hanzi\":\"李文：下周学校有晚会，你知道吗？\",\"pinyin\":\"Xià zhōu xuéxiào yǒu wǎnhuì, nǐ zhīdào ma?\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[0,3.101]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：知道，我和几个女生要表演一个节目。你也参加吗？\",\"pinyin\":\"Zhīdào, wǒ hé jǐ ge nǚshēng yào biǎoyǎn yí ge jiémù. Nǐ yě cānjiā ma?\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[3.161,8.445]},{\"speaker\":\"李文\",\"hanzi\":\"李文：我想唱中文歌，但是还没找到人一起表演，不知道怎么办。\",\"pinyin\":\"Wǒ xiǎng chàng Zhōngwén gē, dànshì hái méi zhǎodào rén yìqǐ biǎoyǎn, bù zhīdào zěnme bàn.\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[8.505,14.865]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：找不到人，你就一个人唱吧。\",\"pinyin\":\"Zhǎo bu dào rén, nǐ jiù yí ge rén chàng ba.\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[14.925,18.112]},{\"speaker\":\"李文\",\"hanzi\":\"李文：一想到要在校长、老师和那么多同学面前表演，我就有些紧张。\",\"pinyin\":\"Yì xiǎngdào yào zài xiàozhǎng, lǎoshī hé nàme duō tóngxué miànqián biǎoyǎn, wǒ jiù yǒuxiē jǐnzhāng.\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[18.172,24.727]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：紧张什么啊，我们都喜欢听你唱歌，你要相信自己。\",\"pinyin\":\"Jǐnzhāng shénme a, wǒmen dōu xǐhuan tīng nǐ chànggē, nǐ yào xiāngxìn zìjǐ.\",\"track\":\"hsk3_14_t3\",\"trackLabel\":\"14-3\",\"textNo\":3,\"segment\":[24.787,30.81]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：昨天是我们学校的新年晚会，每个班级的同学都表演节目了。晚会是八点开始的，差不多十二点才结束。我一个晚上跟大家一起又唱又跳，开心极了，也累坏了。我最喜欢的节目是留学生们跳舞，最后老师和校长也被叫起来一块儿跳，特别有意思。过几天学校的网站上会有晚会的视频，我打算再看一遍。\",\"pinyin\":\"Zuótiān shì wǒmen xuéxiào de xīnnián wǎnhuì, měi ge bānjí de tóngxué dōu biǎoyǎn jiémù le. Wǎnhuì shì bā diǎn kāishǐ de, chàbuduō shí'èr diǎn cái jiéshù. Wǒ yí ge wǎnshang gēn dàjiā yìqǐ yòu chàng yòu tiào, kāixīn jí le, yě lèi huài le. Wǒ zuì xǐhuan de jiémù shì liúxuéshēngmen tiàowǔ, zuìhòu lǎoshī hé xiàozhǎng yě bèi jiào qǐlái yíkuàir tiào, tèbié yǒuyìsi. Guò jǐ tiān xuéxiào de wǎngzhàn shàng huì yǒu wǎnhuì de shìpín, wǒ dǎsuàn zài kàn yí biàn.\",\"track\":\"hsk3_14_t4\",\"trackLabel\":\"14-4\",\"textNo\":4,\"segment\":[0,36.86]}]},{\"source\":{\"file\":\"hsk3-bt15.html\",\"sha256\":\"155ca56c625a73aa635c56315e59e3c7c9ca63ef8cb43d850e837bb6af9b58f7\",\"title\":\"新HSK3 Bài 15\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":15,\"audioSha256\":{\"hsk3_15_v1\":\"ad2d52527992a2c1af77f76ea823351817c40fbbd0e3e0d286d75ca804ad0af7\",\"hsk3_15_v2\":\"80c5252f84bdaab161d6944ab7cc6bb7279ee4689a39638ad9e2820a4f76be81\",\"hsk3_15_v3\":\"8bd8665987828ada84e1f847ef9fe837ac7d928824f4aa0893498bef304aecaa\",\"hsk3_15_v4\":\"1e25f4fd7f2d2c605c0b444883d74441bce8d6955db88e2609baf29f355a1573\",\"hsk3_15_t1\":\"1e18def8cc9f795dc6b5cb2586654f65ab9ac2b1b42447d4a71eabce0db2a403\",\"hsk3_15_t2\":\"7ed02b5c83f34afd45e4c7cb1d5cc1944234a54f527bfd6a102a13cc5ccb84d2\",\"hsk3_15_t3\":\"0f3bef196249c46ae4063e9ef6aac7cc9761c62a7f6316d8d5ad0c815a5e5606\",\"hsk3_15_t4\":\"8ce48baacf43653e3bb0daf6830e1691d04954b2709f9a272a23e7712b9e1e5d\"}},\"vocabulary\":[{\"hanzi\":\"蓝\",\"pinyin\":\"lán\",\"meaning\":\"màu xanh lam, xanh dương\",\"partOfSpeech\":\"Tính từ\",\"track\":\"hsk3_15_v1\",\"trackLabel\":\"15-1\",\"segment\":[0,1.359]},{\"hanzi\":\"段\",\"pinyin\":\"duàn\",\"meaning\":\"đoạn, quãng (thời gian, không gian)\",\"partOfSpeech\":\"Lượng từ\",\"track\":\"hsk3_15_v1\",\"trackLabel\":\"15-1\",\"segment\":[1.419,2.351]},{\"hanzi\":\"附近\",\"pinyin\":\"fùjìn\",\"meaning\":\"gần đó, lân cận\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v1\",\"trackLabel\":\"15-1\",\"segment\":[2.411,3.267]},{\"hanzi\":\"马路\",\"pinyin\":\"mǎlù\",\"meaning\":\"đường chính, đư ck\":\"hsk3_15_v2\",\"trackLabel\":\"15-2\",\"segment\":[15.885,19.274]},{\"hanzi\":\"外地\",\"pinyin\":\"wàidì\",\"meaning\":\"nơi khác, vùng khác, địa phương khác\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v2\",\"trackLabel\":\"15-2\",\"segment\":[19.334,20.282]},{\"hanzi\":\"聊\",\"pinyin\":\"liáo\",\"meaning\":\"trò chuyện, nói chuyện\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_15_v2\",\"trackLabel\":\"15-2\",\"segment\":[20.342,22.97]},{\"hanzi\":\"河\",\"pinyin\":\"hé\",\"meaning\":\"sông\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v3\",\"trackLabel\":\"15-3\",\"segment\":[0,1.267]},{\"hanzi\":\"关系\",\"pinyin\":\"guānxi\",\"meaning\":\"quan hệ\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v3\",\"trackLabel\":\"15-3\",\"segment\":[1.327,6.957]},{\"hanzi\":\"养\",\"pinyin\":\"yǎng\",\"meaning\":\"nuôi dưỡng\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_15_v3\",\"trackLabel\":\"15-3\",\"segment\":[7.017,10.3]},{\"hanzi\":\"西北\",\"pinyin\":\"xīběi\",\"meaning\":\"tây bắc\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v4\",\"trackLabel\":\"15-4\",\"segment\":[0,4.004]},{\"hanzi\":\"经过\",\"pinyin\":\"jīngguò\",\"meaning\":\"đi qua, trải qua, trải nghiệm\",\"partOfSpeech\":\"Động từ / Danh từ\",\"track\":\"hsk3_15_v4\",\"trackLabel\":\"15-4\",\"segment\":[4.064,7.552]},{\"hanzi\":\"草地\",\"pinyin\":\"cǎodì\",\"meaning\":\"thảm cỏ, đồng cỏ\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_15_v4\",\"trackLabel\":\"15-4\",\"segment\":[7.612,8.764]},{\"hanzi\":\"遇见\",\"pinyin\":\"yùjiàn\",\"meaning\":\"gặp, tình cờ gặp\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_15_v4\",\"trackLabel\":\"15-4\",\"segment\":[8.824,10.28]}],\"dialogue\":[{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：您搬到蓝天小区一段时间了，觉得怎么样？\",\"pinyin\":\"Nín bān dào Lántiān Xiǎoqū yí duàn shíjiān le, juéde zěnmeyàng?\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[0,5.215]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：小区环境挺好的，附近买东西也很方便，过马路就是超市。\",\"pinyin\":\"Xiǎoqū huánjìng tǐng hǎo de, fùjìn mǎi dōngxi yě hěn fāngbiàn, guò mǎlù jiù shì chāoshì.\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[5.275,12.372]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：平时孩子们在哪儿玩？\",\"pinyin\":\"Píngshí háizimen zài nǎr wán?\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[12.432,15.848]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：小区里有很多树，孩子们放学后就在树下做游戏。你想买房子吗？\",\"pinyin\":\"Xiǎoqū lǐ yǒu hěn duō shù, háizimen fàngxué hòu jiù zài shù xià zuò yóuxì. Nǐ xiǎng mǎi fángzi ma?\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[15.908,23.955]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：是，我想买一个大房子，让我爸妈过来跟我一起住。\",\"pinyin\":\"Shì, wǒ xiǎng mǎi yí ge dà fángzi, ràng wǒ bàmā guòlái gēn wǒ yìqǐ zhù.\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[24.015,30.857]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：蓝天小区的老人挺多的，这几年小区根据他们的需要，有了很多变化。\",\"pinyin\":\"Lántiān Xiǎoqū de lǎorén tǐng duō de, zhè jǐ nián xiǎoqū gēnjù tāmen de xūyào, yǒu le hěn duō biànhuà.\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[30.917,38.295]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：真不错！过几天我去蓝天小区看看。\",\"pinyin\":\"Zhēn búcuò! Guò jǐ tiān wǒ qù Lántiān Xiǎoqū kànkan.\",\"track\":\"hsk3_15_t1\",\"trackLabel\":\"15-1\",\"textNo\":1,\"segment\":[38.355,43.82]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：假期我想去南京旅游，但是我不太了解那里。\",\"pinyin\":\"Jiàqī wǒ xiǎng qù Nánjīng lǚyóu, dànshì wǒ bú tài liǎojiě nàli.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[0,5.518]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：我虽然不是南京人，可是我是在南京上的大学，可以说是半个南京人。\",\"pinyin\":\"Wǒ suīrán bú shì Nánjīng rén, kěshì wǒ shì zài Nánjīng shàng de dàxué, kěyǐ shuō shì bàn ge Nánjīng rén.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[5.578,16.46]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：太好了！你快给我介绍一下南京吧。\",\"pinyin\":\"Tài hǎo le! Nǐ kuài gěi wǒ jièshào yíxià Nánjīng ba.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[16.52,24.48]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：南京有两千年以上的历史，有老城、老街，还有很多有名的景点，每年去旅游的游客特别多。\",\"pinyin\":\"Nánjīng yǒu liǎng qiān nián yǐshàng de lìshǐ, yǒu lǎochéng, lǎojiē, hái yǒu hěn duō yǒumíng de jǐngdiǎn, měinián qù lǚyóu de yóukè tèbié duō.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[24.54,27.596]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：除了这些以外，你再告诉我一些外地人不知道的地方。\",\"pinyin\":\"Chúle zhèxiē yǐwài, nǐ zài gàosu wǒ yìxiē wàidì rén bù zhīdào de dìfang.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[27.656,34.368]},{\"speaker\":\"杨同乐\",\"hanzi\":\"杨同乐：那太多了，我得一点儿一点儿给您讲。\",\"pinyin\":\"Nà tài duō le, wǒ děi yìdiǎnr yìdiǎnr gěi nín jiǎng.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[34.428,37.323]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：行。下班后我请你吃晚饭，咱们边吃边聊。\",\"pinyin\":\"Xíng. Xiàbān hòu wǒ qǐng nǐ chī wǎnfàn, zánmen biān chī biān liáo.\",\"track\":\"hsk3_15_t2\",\"trackLabel\":\"15-2\",\"textNo\":2,\"segment\":[37.383,42.99]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：小明，中国有一条大河，它的名字跟颜色有关系，你知道是什么河吗？\",\"pinyin\":\"Xiǎomíng, Zhōngguó yǒu yì tiáo dà hé, tā de míngzi gēn yánsè yǒu guānxi, nǐ zhīdào shì shénme hé ma?\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[0,9.033]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：我知道，是黄河！\",\"pinyin\":\"Wǒ zhīdào, shì Huáng Hé!\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[9.093,11.923]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：你说对了。我再问问你，你知道它为什么叫黄河吗？\",\"pinyin\":\"Nǐ shuō duì le. Wǒ zài wènwen nǐ, nǐ zhīdào tā wèishénme jiào Huáng Hé ma?\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[11.983,18.486]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：因为河水看起来是黄色的，所以叫这个名字。黄河是中国最长的河吗？\",\"pinyin\":\"Yīnwèi héshuǐ kàn qǐlái shì huángsè de, suǒyǐ jiào zhège míngzi. Huáng Hé shì Zhōngguó zuì cháng de hé ma?\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[18.546,26.858]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：不是。黄河虽然不是最长的河，可是在历史上很重要。\",\"pinyin\":\"Bú shì. Huáng Hé suīrán bú shì zuì cháng de hé, kěshì zài lìshǐ shàng hěn zhòngyào.\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[26.918,33.728]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：这个我知道。很久以前，很多中国人都住在黄河边上。\",\"pinyin\":\"Zhège wǒ zhīdào. Hěn jiǔ yǐqián, hěn duō Zhōngguó rén dōu zhù zài Huáng Hé biān shàng.\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[33.788,39.658]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：对。在我们中国人看来，黄河像妈妈一样，养了我们几千年。\",\"pinyin\":\"Duì. Zài wǒmen Zhōngguó rén kànlái, Huáng Hé xiàng māma yíyàng, yǎng le wǒmen jǐ qiān nián.\",\"track\":\"hsk3_15_t3\",\"trackLabel\":\"15-3\",\"textNo\":3,\"segment\":[39.718,47.52]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我小时候住在北京的西北边，有一条非常有名的河经过那里。我家就住在河边。那里有高高的大树和绿绿的草地。春天，河边的花都开了，看起来特别漂亮。还记得小时候，一到夏天我就去河里游泳。长大以后，遇到什么不开心的事情，我就去河边的树下坐着，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿，难过的事情不一会儿就忘了。那是我最喜欢的地方。\",\"pinyin\":\"Wǒ xiǎoshíhou zhù zài Běijīng de xīběi biān, yǒu yì tiáo fēicháng yǒumíng de hé jīngguò nàli. Wǒ jiā jiù zhù zài hébiān. Nàli yǒu gāogāo de dàshù hé lǜlǜ de cǎodì. Chūntiān, hébiān de huā dōu kāi le, kàn qǐlái tèbié piàoliang. Hái jìde xiǎoshíhou, yí dào xiàtiān wǒ jiù qù hé lǐ yóuyǒng. Zhǎngdà yǐhòu, yùdào shénme bù kāixīn de shìqing, wǒ jiù qù hébiān de shù xià zuòzhe, tīngting niǎo jiào, kànkan héshuǐ, gēn yùjiàn de péngyou liáoliao tiānr, nánguò de shìqing bù yíhuìr jiù wàng le. Nà shì wǒ zuì xǐhuan de dìfang.\",\"track\":\"hsk3_15_t4\",\"trackLabel\":\"15-4\",\"textNo\":4,\"segment\":[0,45.77]}]},{\"source\":{\"file\":\"hsk3-bt16.html\",\"sha256\":\"e0f35332b67c0287c5344fc50e7971c743363fe2d9d6e62e6ac60ba4436d8307\",\"title\":\"新HSK3 Bài 16\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":16,\"audioSha256\":{\"hsk3_16_v1\":\"ab165d78013045c04efc06a4baee298f73ad46fab4c6c731f43b96304bb9d336\",\"hsk3_16_v2\":\"6336dea3e án\",\"meaning\":\"vườn bách thú, sở thú\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v1\",\"trackLabel\":\"16-1\",\"segment\":[25.571,30.529]},{\"hanzi\":\"动物\",\"pinyin\":\"dòngwù\",\"meaning\":\"động vật\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v1\",\"trackLabel\":\"16-1\",\"segment\":[30.589,32.53]},{\"hanzi\":\"大熊猫\",\"pinyin\":\"dàxióngmāo\",\"meaning\":\"gấu trúc, gấu mèo\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[0,1.898]},{\"hanzi\":\"奇怪\",\"pinyin\":\"qíguài\",\"meaning\":\"kỳ lạ, kỳ quái\",\"partOfSpeech\":\"Tính từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[1.958,4.242]},{\"hanzi\":\"其实\",\"pinyin\":\"qíshí\",\"meaning\":\"thực ra\",\"partOfSpeech\":\"Phó từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[4.302,8.931]},{\"hanzi\":\"竹子\",\"pinyin\":\"zhúzi\",\"meaning\":\"tre\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[8.991,10.053]},{\"hanzi\":\"国宝\",\"pinyin\":\"guóbǎo\",\"meaning\":\"quốc bảo, báu vật quốc gia\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[10.113,14.372]},{\"hanzi\":\"全\",\"pinyin\":\"quán\",\"meaning\":\"toàn bộ\",\"partOfSpeech\":\"Tính từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[14.432,16.832]},{\"hanzi\":\"野生\",\"pinyin\":\"yěshēng\",\"meaning\":\"hoang dã\",\"partOfSpeech\":\"Tính từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[16.892,18.044]},{\"hanzi\":\"关于\",\"pinyin\":\"guānyú\",\"meaning\":\"về..., có liên quan tới\",\"partOfSpeech\":\"Giới từ\",\"track\":\"hsk3_16_v2\",\"trackLabel\":\"16-2\",\"segment\":[18.104,19.69]},{\"hanzi\":\"饱\",\"pinyin\":\"bǎo\",\"meaning\":\"no\",\"partOfSpeech\":\"Tính từ\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[0,1.281]},{\"hanzi\":\"张\",\"pinyin\":\"zhāng\",\"meaning\":\"mở (miệng)\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[1.341,3.382]},{\"hanzi\":\"嘴\",\"pinyin\":\"zuǐ\",\"meaning\":\"miệng\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[3.442,4.351]},{\"hanzi\":\"身边\",\"pinyin\":\"shēnbiān\",\"meaning\":\"bên cạnh\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[4.411,8.943]},{\"hanzi\":\"半天\",\"pinyin\":\"bàntiān\",\"meaning\":\"nửa ngày, một lúc lâu\",\"partOfSpeech\":\"Số lượng\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[9.003,10.245]},{\"hanzi\":\"脸\",\"pinyin\":\"liǎn\",\"meaning\":\"mặt, khuôn mặt\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v3\",\"trackLabel\":\"16-3\",\"segment\":[10.305,14.0]},{\"hanzi\":\"大人\",\"pinyin\":\"dàren\",\"meaning\":\"người lớn\",\"partOfSpeech\":\"Danh từ\",\"track\":\"hsk3_16_v4\",\"trackLabel\":\"16-4\",\"segment\":[0,1.547]},{\"hanzi\":\"喜爱\",\"pinyin\":\"xǐ'ài\",\"meaning\":\"yêu thích\",\"partOfSpeech\":\"Động từ\",\"track\":\"hsk3_16_v4\",\"trackLabel\":\"16-4\",\"segment\":[1.607,6.11]}],\"dialogue\":[{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：这只小猫你们养了多久了？\",\"pinyin\":\"Zhè zhī xiǎomāo nǐmen yǎng le duō jiǔ le?\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[0,3.636]},{\"speaker\":\"服务员\",\"hanzi\":\"服务员：已经一年多了。第一天看见它的时候，它又脏又小。\",\"pinyin\":\"Yǐjīng yì nián duō le. Dì-yī tiān kànjiàn tā de shíhou, tā yòu zāng yòu xiǎo.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[3.696,11.004]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：现在它变得又干净又漂亮了。\",\"pinyin\":\"Xiànzài tā biàn de yòu gānjìng yòu piàoliang le.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[11.064,14.77]},{\"speaker\":\"服务员\",\"hanzi\":\"服务员：是啊。它还特别可爱，一会儿在你脚边睡觉，一会儿在你身上爬。\",\"pinyin\":\"Shì a. Tā hái tèbié kě'ài, yíhuìr zài nǐ jiǎobiān shuìjiào, yíhuìr zài nǐ shēnshang pá.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[14.83,23.509]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：你们把它照顾得真好。\",\"pinyin\":\"Nǐmen bǎ tā zhàogù de zhēn hǎo.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[23.569,26.863]},{\"speaker\":\"服务员\",\"hanzi\":\"服务员：它就好像我们的孩子，我们照顾它，它也认得我们了。\",\"pinyin\":\"Tā jiù hǎoxiàng wǒmen de háizi, wǒmen zhàogù tā, tā yě rènde wǒmen le.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[26.923,34.17]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：妈妈，我们家也养一只小猫吧。\",\"pinyin\":\"Māma, wǒmen jiā yě yǎng yì zhī xiǎomāo ba.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[34.23,38.533]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：咱们没时间照顾，还是别养了，我周末带你们去北京动物园看动物吧。\",\"pinyin\":\"Zánmen méi shíjiān zhàogù, háishi bié yǎng le, wǒ zhōumò dài nǐmen qù Běijīng Dòngwùyuán kàn dòngwù ba.\",\"track\":\"hsk3_16_t1\",\"trackLabel\":\"16-1\",\"textNo\":1,\"segment\":[38.593,46.63]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：妈妈，大熊猫这个名字很奇怪，它们跟猫有什么关系？\",\"pinyin\":\"Māma, dàxióngmāo zhège míngzi hěn qíguài, tāmen gēn māo yǒu shénme guānxi?\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[0,6.201]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：这个问题问得好，它们跟猫没什么关系，其实应该叫大猫熊。\",\"pinyin\":\"Zhège wèntí wèn de hǎo, tāmen gēn māo méi shénme guānxi, qíshí yīnggāi jiào dàmāoxióng.\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[6.261,14.268]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：大熊猫为什么只吃竹子不吃肉？\",\"pinyin\":\"Dàxióngmāo wèishénme zhǐ chī zhúzi bù chī ròu?\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[14.328,18.667]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：它们跟人一样，也可以吃肉，但是对肉不感兴趣。\",\"pinyin\":\"Tāmen gēn rén yíyàng, yě kěyǐ chī ròu, dànshì duì ròu bù gǎn xìngqù.\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[18.727,25.013]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：大熊猫为什么是中国的国宝？\",\"pinyin\":\"Dàxióngmāo wèishénme shì Zhōngguó de guóbǎo?\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[25.073,29.092]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：全世界只有中国有野生大熊猫，中国是大熊猫的家。\",\"pinyin\":\"Quán shìjiè zhǐyǒu Zhōngguó yǒu yěshēng dàxióngmāo, Zhōngguó shì dàxióngmāo de jiā.\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[29.152,36.819]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：我听说有的熊猫出国了，他们去哪儿了？\",\"pinyin\":\"Wǒ tīngshuō yǒude xióngmāo chūguó le, tāmen qù nǎr le?\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[36.879,42.231]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：关于这个问题，我得慢慢给你讲。\",\"pinyin\":\"Guānyú zhège wèntí, wǒ děi mànmàn gěi nǐ jiǎng.\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[42.291,46.867]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：弟弟，你真是“十万个为什么”。\",\"pinyin\":\"Dìdi, nǐ zhēn shì “shí wàn ge wèishénme”.\",\"track\":\"hsk3_16_t2\",\"trackLabel\":\"16-2\",\"textNo\":2,\"segment\":[46.927,51.12]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：这只大熊猫一会儿爬上去，一会儿跳下来，可爱极了！\",\"pinyin\":\"Zhè zhī dàxióngmāo yíhuìr pá shàngqu, yíhuìr tiào xiàlai, kě'ài jí le!\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[0,6.196]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：它好像还没吃饱，站起来张着嘴找吃的呢。\",\"pinyin\":\"Tā hǎoxiàng hái méi chī bǎo, zhàn qǐlai zhāngzhe zuǐ zhǎo chī de ne.\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[6.256,11.445]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：它身边那只熊猫半天没动，是不是在睡觉呢？\",\"pinyin\":\"Tā shēnbiān nà zhī xióngmāo bàntiān méi dòng, shì bú shì zài shuìjiào ne?\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[11.505,16.935]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：我看不见它的脸，可能是吧。一般来说，熊猫每天要睡很多次觉。\",\"pinyin\":\"Wǒ kàn bú jiàn tā de liǎn, kěnéng shì ba. Yìbān lái shuō, xióngmāo měitiān yào shuì hěn duō cì jiào.\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[16.995,25.148]},{\"speaker\":\"刘小明\",\"hanzi\":\"刘小明：对，除了睡觉以外，很多时间都在吃东西。\",\"pinyin\":\"Duì, chúle shuìjiào yǐwài, hěn duō shíjiān dōu zài chī dōngxi.\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[25.208,31.072]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：大熊猫的生活真舒服啊！\",\"pinyin\":\"Dàxióngmāo de shēnghuó zhēn shūfu a!\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[31.132,35.204]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：妈妈，您帮我和这两只大熊猫照一张照片吧。\",\"pinyin\":\"Māma, nín bāng wǒ hé zhè liǎng zhī dàxióngmāo zhào yì zhāng zhàopiàn ba.\",\"track\":\"hsk3_16_t3\",\"trackLabel\":\"16-3\",\"textNo\":3,\"segment\":[35.264,41.63]},{\"speaker\":\"王一雪\",\"hanzi\":\"王一雪：今天我带小雪和小明去动物园玩了。北京动物园是中国很有名的动物园，里面有非常多的动物，当然，大人和孩子最喜爱的还是大熊猫。每天有很多游客去熊猫馆，他们带着相机去给可爱的大熊猫拍照。动物园早上七点半开门，晚上七点关门，冬天比夏天游客少，所以也比平时早关门一个小时。如果第一次来北京旅游，跟家人一起去北京动物园是个不错的选择。\",\"pinyin\":\"Jīntiān wǒ dài Xiǎoxuě hé Xiǎomíng qù dòngwùyuán wán le. Běijīng Dòngwùyuán shì Zhōngguó hěn yǒumíng de dòngwùyuán, lǐmiàn yǒu fēicháng duō de dòngwù, dāngrán, dàrén hé háizi zuì xǐ'ài de háishi dàxióngmāo. Měitiān yǒu hěn duō yóukè qù xióngmāoguǎn, tāmen dàizhe xiàngjī qù gěi kě'ài de dàxióngmāo pāizhào. Dòngwùyuán zǎoshang qī diǎn bàn kāimén, wǎnshang qī diǎn guānmén, dōngtiān bǐ xiàtiān yóukè shǎo, suǒyǐ yě bǐ píngshí zǎo guānmén yí ge xiǎoshí. Rúguǒ dì-yī cì lái Běijīng lǚyóu, gēn jiārén yìqǐ qù Běijīng Dòngwùyuán shì ge búcuò de xuǎnzé.\",\"track\":\"hsk3_16_t4\",\"trackLabel\":\"16-4\",\"textNo\":4,\"segment\":[0,45.54]}]},{\"source\":{\"file\":\"hsk3-bt17.html\",\"sha256\":\"14ab4b07acaaec33cc109ef525ae1656fd5a3b07c9c1ffa4f7a1f80439ae1a49\",\"title\":\"新HSK3 Bài 17\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":17,\"audioSha256\":{\"hsk3_17_v1\":\"d70131dfef19b24c516a64480860f375f00551a7cb1c9d9075fd7ca1ca9f09c6\",\"hsk3_17_v2\":\"ae5c4cd06684141fd0b3de9d4eb13fc422377950ad17ec1f47fe08c9c48d4d02\",\"hsk3_17_v3\":\"05c53e02861ebeda87edc259dd98de77588bde6685569840b97691158a93ee9b\",\"hsk3_17_v4\":\"c5a9726e65bbc824773f3b5a5cb68969f8c1ba2481301f206b85a7b3cfefebae\",\"hsk3 hì hěn chángjiàn de.\",\"track\":\"hsk3_17_t1\",\"trackLabel\":\"17-1\",\"textNo\":1,\"segment\":[21.17,25.977]},{\"speaker\":\"同学\",\"hanzi\":\"同学：我把简单的事情做错了，李老师一定觉得我不认真。\",\"pinyin\":\"Wǒ bǎ jiǎndān de shìqing zuò cuò le, Lǐ lǎoshī yídìng juéde wǒ bù rènzhēn.\",\"track\":\"hsk3_17_t1\",\"trackLabel\":\"17-1\",\"textNo\":1,\"segment\":[26.037,33.072]},{\"speaker\":\"刘小雪\",\"hanzi\":\"刘小雪：有的人虽然很聪明，但是会在简单的事情中出错，因为他们认为事情简单，就不会认真去做了。\",\"pinyin\":\"Yǒude rén suīrán hěn cōngming, dànshì huì zài jiǎndān de shìqing zhōng chūcuò, yīnwèi tāmen rènwéi shìqing jiǎndān, jiù bú huì rènzhēn qù zuò le.\",\"track\":\"hsk3_17_t1\",\"trackLabel\":\"17-1\",\"textNo\":1,\"segment\":[33.132,43.016]},{\"speaker\":\"同学\",\"hanzi\":\"同学：你说的就是我，以后我要多向认真的人学习。\",\"pinyin\":\"Nǐ shuō de jiù shì wǒ, yǐhòu wǒ yào duō xiàng rènzhēn de rén xuéxí.\",\"track\":\"hsk3_17_t1\",\"trackLabel\":\"17-1\",\"textNo\":1,\"segment\":[43.076,49.6]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：太阳从西边出来了？这几天怎么总是在图书馆看见你？\",\"pinyin\":\"Tàiyáng cóng xībian chūlai le? Zhè jǐ tiān zěnme zǒngshì zài túshūguǎn kànjiàn nǐ?\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[0,7.354]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：这有什么奇怪的？我是来学习的。\",\"pinyin\":\"Zhè yǒu shénme qíguài de? Wǒ shì lái xuéxí de.\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[7.414,12.299]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：你怎么还来图书馆学习？同学们都在到处找工作呢。\",\"pinyin\":\"Nǐ zěnme hái lái túshūguǎn xuéxí? Tóngxuémen dōu zài dàochù zhǎo gōngzuò ne.\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[12.359,19.367]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：我不想现在就工作，还想继续学习，我爸妈也同意。可我还没想好学什么，所以来图书馆看看。\",\"pinyin\":\"Wǒ bù xiǎng xiànzài jiù gōngzuò, hái xiǎng jìxù xuéxí, wǒ bàmā yě tóngyì. Kě wǒ hái méi xiǎnghǎo xué shénme, suǒyǐ lái túshūguǎn kànkan.\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[19.427,31.759]},{\"speaker\":\"白家月\",\"hanzi\":\"白家月：你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。\",\"pinyin\":\"Nǐ bú shì xǐhuan wán diànnǎo ma? Nǐ kěyǐ qù kànkan gēn diànnǎo yǒu guānxi de shū.\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[31.819,39.551]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：你说得对，我记得那个屋子里有些跟电脑有关的书，我去找找。\",\"pinyin\":\"Nǐ shuō de duì, wǒ jìde nàge wūzi li yǒuxiē gēn diànnǎo yǒuguān de shū, wǒ qù zhǎozhao.\",\"track\":\"hsk3_17_t2\",\"trackLabel\":\"17-2\",\"textNo\":2,\"segment\":[39.611,48.38]},{\"speaker\":\"李文\",\"hanzi\":\"李文：天中，你的手机怎么关机了？\",\"pinyin\":\"Tiānzhōng, nǐ de shǒujī zěnme guānjī le?\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[0,3.137]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：我的手机没电了。你找我有事吗？\",\"pinyin\":\"Wǒ de shǒujī méi diàn le. Nǐ zhǎo wǒ yǒu shì ma?\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[3.197,7.151]},{\"speaker\":\"李文\",\"hanzi\":\"李文：前天我看见家月了，她告诉我你打算继续留学？\",\"pinyin\":\"Qiántiān wǒ kànjiàn Jiāyuè le, tā gàosu wǒ nǐ dǎsuàn jìxù liúxué?\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[7.211,12.734]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：是，可是我还没想好学什么，更没想好去哪个国家。\",\"pinyin\":\"Shì, kěshì wǒ hái méi xiǎnghǎo xué shénme, gèng méi xiǎnghǎo qù nǎge guójiā.\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[12.794,19.024]},{\"speaker\":\"李文\",\"hanzi\":\"李文：你可以去中国学中文啊。比如可以去北京、上海这样的大城市，那里有很多好大学，也有很多留学生。\",\"pinyin\":\"Nǐ kěyǐ qù Zhōngguó xué Zhōngwén a. Bǐrú kěyǐ qù Běijīng, Shànghǎi zhèyàng de dà chéngshì, nàli yǒu hěn duō hǎo dàxué, yě yǒu hěn duō liúxuéshēng.\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[19.084,30.096]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：好，那我上网查一查。\",\"pinyin\":\"Hǎo, nà wǒ shàngwǎng chá yì chá.\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[30.156,33.8]},{\"speaker\":\"李文\",\"hanzi\":\"李文：我给你介绍几个有用的网站。\",\"pinyin\":\"Wǒ gěi nǐ jièshào jǐ ge yǒuyòng de wǎngzhàn.\",\"track\":\"hsk3_17_t3\",\"trackLabel\":\"17-3\",\"textNo\":3,\"segment\":[33.86,37.56]},{\"speaker\":\"陈天中\",\"hanzi\":\"陈天中：大学生活马上就要结束了，我最近经常被问到一个问题——“你以后想做什么”，这个问题真不容易回答。我也问了几个同学，大家选择的方向都不同。有的想继续在学校学习，有的打算出国留学，还有的决定先找工作。我认为只有想清楚自己真正喜欢什么，才能做出最合适的选择。对我来说，想清楚“真正喜欢什么”是个难题。\",\"pinyin\":\"Dàxué shēnghuó mǎshàng jiù yào jiéshù le, wǒ zuìjìn jīngcháng bèi wèn dào yí ge wèntí — “Nǐ yǐhòu xiǎng zuò shénme”, zhège wèntí zhēn bù róngyì huídá. Wǒ yě wèn le jǐ ge tóngxué, dàjiā xuǎnzé de fāngxiàng dōu bù tóng. Yǒude xiǎng jìxù zài xuéxiào xuéxí, yǒude dǎsuàn chūguó liúxué, hái yǒude juédìng xiān zhǎo gōngzuò. Wǒ rènwéi zhǐyǒu xiǎng qīngchu zìjǐ zhēnzhèng xǐhuan shénme, cái néng zuò chū zuì héshì de xuǎnzé. Duì wǒ lái shuō, xiǎng qīngchu “zhēnzhèng xǐhuan shénme” shì ge nántí.\",\"track\":\"hsk3_17_t4\",\"trackLabel\":\"17-4\",\"textNo\":4,\"segment\":[0,42.72]}]},{\"source\":{\"file\":\"hsk3-bt18.html\",\"sha256\":\"a298dced676722a8f3bbb2a16f63f26539275d6e79806805bdfdee0f446d7498\",\"title\":\"新HSK3 Bài 18\",\"lessonTitle\":\"\",\"level\":\"HSK3\",\"lesson\":18,\"audioSha256\":{\"hsk3_18_v1\":\"fc2d5b952adc888bc29fa1e688a1605757f958a106e12ba1b0511172cd99ff22\",\"hsk3_18_v2\":\"a407820bb445860c35a1555b2d00a53ead3d11bef9508bf4ed23acaae7aded96\",\"hsk3_18_v3\":\"0cb746a45b915648931463682f95ec44ead39466c61542c266d9d76f7dcb0945\",\"hsk3_18_v4\":\"7add5c32ca33903d81d06484abb6f1ca9d239b06fb676234e3b526da55e7d6e0\",\"hsk3_18_t1\":\"2654f447847618211a2c3b21f07c4a07c277e0be3f53758b74acc41219b4289f\",\"hsk3_18_t2\":\"f5a36300acf93f9580d7bfcd10fc36e37f8e189a9461df4ef35386cf5d3bba04\",\"hsk3_18_t3\":\"d44016f7973137a66919e59828a38b70f0f888112dc640617f0756df35184fcf\",\"hsk3_18_t4\":\"f8dde299de5fecc00c0d5bac2b0a5ac7700b3735237fbaa5cba9ec14bb719d3a\"}},\"vocabulary\":[{\"hanzi\":\"怎样\",\"pinyin\":\"zěnyàng\",\"meaning\":\"thế nào\",\"partOfSpeech\":\"Đại từ\",\"track\":\"hsk3_18_v1\",\"trackLabel\":\"18-1\",\"segment\":[0,1.466]},{\"hanzi\":\"过节\",\"pinyin\":\"guòjié\",\"meaning\":\"đón lễ\",\"partOfSpeech\":\"Động từ\", heo âm tiết (fǎ guó, zhōng wén, lǎo shī...).\n  // Nếu chuỗi âm cơ sở giống hệt nhau, dùng ranh giới âm tiết của AI để căn\n  // lại pinyin chuẩn. Như vậy khoảng trắng/viết liền không bị tính là lỗi phát âm.\n  function alignedExpectedFromHeard(expectedPinyin,heardSyllables){\n    const stream=pinyinLetterStream(expectedPinyin);\n    const expectedBase=stream.map(x=>x.base).join('');\n    const heardBase=heardSyllables.map(x=>x.base).join('');\n    if(!heardSyllables.length||expectedBase!==heardBase)return null;\n    let pos=0;\n    const out=[];\n    for(const h of heardSyllables){\n      const seg=stream.slice(pos,pos+h.base.length); pos+=h.base.length;\n      const tones=seg.map(x=>x.tone).filter(Boolean);\n      out.push({base:seg.map(x=>x.base).join(''),tone:tones.length?tones[0]:0});\n    }\n    return pos===stream.length?out:null;\n  }\n\n  function pronunciationMetrics(expectedPinyin,heardPinyin){\n    const heard=pinyinSyllables(heardPinyin);\n    const aligned=alignedExpectedFromHeard(expectedPinyin,heard);\n    const a=aligned||pinyinSyllables(expectedPinyin),b=heard,n=a.length,m=b.length;\n    const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));\n    for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;\n    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1));\n    let i=n,j=m,segmentErrors=0,toneErrors=0,toneCompared=0;\n    while(i>0||j>0){\n      if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1)){\n        if(a[i-1].base===b[j-1].base){toneCompared++;if(a[i-1].tone!==b[j-1].tone)toneErrors++}else segmentErrors++;\n        i--;j--;\n      }else if(i>0&&dp[i][j]===dp[i-1][j]+1){segmentErrors++;i--}else{segmentErrors++;j--}\n    }\n    const toneErrorRate=toneCompared?Math.round(toneErrors*1000/toneCompared)/10:100;\n    return {segmentErrors,toneErrors,toneCompared,toneErrorRate,totalExpected:n};\n  }\n\n  function dialogueLevel(result,expe classList.remove('hidden');\n    els.aiBadge.textContent=err?'Lỗi kết nối':'Đã chấm theo âm';els.aiBadge.classList.toggle('connected',!err);\n    if(err){\n      const quota=err?.isQuota===true;\n      els.aiBadge.textContent=quota?'Hệ thống đang bận':'Lỗi kết nối';\n      const msg=quota?'Hệ thống chấm đang bận. Vui lòng thử lại sau.':(err.name==='AbortError'?'Chấm quá thời gian. Hãy thử lại.':err.message||String(err));\n      els.aiContent.innerHTML=`<div class=\"instant-score bad\"><strong>—</strong></div><p>${escapeHtml(msg)}</p>`;\n      setState(quota?'Lượt này chưa được chấm và không ảnh hưởng kết quả. Hãy thử lại sau.':'Không chấm được lượt nói. Hãy bấm Nói lại.','practice');\n      renderMeta();return;\n    }\n    const score=Math.max(0,Math.min(100,Math.round(Number(result.score)||0)));\n    const wrong=(result.wrongChars||[]).filter(Boolean);\n    const matched=result.correct===true && wrong.length===0;\n    let passed=tab==='vocab' ? score>=PRACTICE_PASS_SCORE : dialogueLevel(result,items()[index]?.pinyin||'').passed;\n    const heard=result.heardPinyin?`<div class=\"heard-line\">AI nghe pinyin: <b>${escapeHtml(result.heardPinyin)}</b></div>`:'';\n    const feedback=wrong.length\n      ? `<div class=\"heard-line\"><b>Cần luyện thêm:</b> ${escapeHtml(wrong.join(' · '))}</div>`\n      : matched\n        ? '<div class=\"match-ok\">✓ Âm đọc khớp mẫu.</div>'\n        : '<div class=\"heard-line\"><b>Cần luyện thêm:</b> thử đọc chậm và rõ thanh điệu hơn.</div>';\n    if(tab==='vocab'){\n      const gate=passed\n        ? '<div class=\"match-ok\">✓ Đạt mức Khá trở lên · Đã mở “Tiếp theo”.</div>'\n        : '<div class=\"heard-line\"><b>🔁 Cần đọc lại.</b> “Tiếp theo” sẽ mở khi đạt từ 50/100 trở lên.</div>';\n      els.aiContent.innerHTML=`<div class=\"instant-score ${passed?'good':'bad'}\"><strong>${score}/100</strong></div>${heard}${feedback}${gate}`;\n    }else{\n      const it=items()[index];\n      const rubric=dialogueLevel(result,it?.pinyin||'');\n      con
