attempt===0){await sleep(QUOTA_RETRY_MS);continue}\n        if(!res.ok||!json?.ok){if(quota)throw friendlyScoreError('Hệ thống chấm đang bận. Vui lòng thử lại sau.',true);throw new Error(json?.error||`Lỗi chấm giọng nói (${res.status})`)}\n        const score=Math.max(0,Math.min(100,Math.round(Number(json.score)||0)));\n        const wrongChars=Array.isArray(json.wrongChars)?json.wrongChars.map(String).filter(Boolean):[];\n        const correct=json.correct===true;const heardPinyin=String(json.heardPinyin||'').trim();return {score,wrongChars,correct,heardPinyin};\n      }finally{clearTimeout(timer)}\n    }\n    throw friendlyScoreError('Hệ thống chấm đang bận. Vui lòng thử lại sau.',true);\n  }\n\n  function pinyinSyllables(text){\n    const toneMap={ā:['a',1],á:['a',2],ǎ:['a',3],à:['a',4],ē:['e',1],é:['e',2],ě:['e',3],è:['e',4],ī:['i',1],í:['i',2],ǐ:['i',3],ì:['i',4],ō:['o',1],ó:['o',2],ǒ:['o',3],ò:['o',4],ū:['u',1],ú:['u',2],ǔ:['u',3],ù:['u',4],ǖ:['v',1],ǘ:['v',2],ǚ:['v',3],ǜ:['v',4],ü:['v',0]};\n    return String(text||'').toLowerCase().replace(/u:/g,'v').split(/[^a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜv0-5]+/).filter(Boolean).map(raw=>{\n      let base='',tone=0;\n      for(const ch of raw){if(toneMap[ch]){base+=toneMap[ch][0];tone=toneMap[ch][1]||tone}else if(/[1-5]/.test(ch)){tone=Number(ch)===5?0:Number(ch)}else if(/[a-zv]/.test(ch))base+=ch}\n      return {base,tone};\n    }).filter(x=>x.base);\n  }\n\n  function pinyinLetterStream(text){\n    const toneMap={ā:['a',1],á:['a',2],ǎ:['a',3],à:['a',4],ē:['e',1],é:['e',2],ě:['e',3],è:['e',4],ī:['i',1],í:['i',2],ǐ:['i',3],ì:['i',4],ō:['o',1],ó:['o',2],ǒ:['o',3],ò:['o',4],ū:['u',1],ú:['u',2],ǔ:['u',3],ù:['u',4],ǖ:['v',1],ǘ:['v',2],ǚ:['v',3],ǜ:['v',4],ü:['v',0]};\n    const out=[];\n    for(const ch0 of String(text||'').toLowerCase().replace(/u:/g,'v')){\n      const ch=ch0.normalize('NFC');\n      if(toneMap[ch]) out.push({base:toneMap[ch][0],tone:toneMap[ch][1]});\n      else if(/[a-zv]/.test(ch)) out.push({base:ch,tone:0});\n    }\n    return out;\n  }\n\n  // Pinyin trong data có thể viết liền theo từ (Fǎguó, Zhōngwén, lǎoshī...),\n  // còn AI thường trả theo âm tiết (fǎ guó, zhōng wén, lǎo shī...).\n  // Nếu chuỗi âm cơ sở giống hệt nhau, dùng ranh giới âm tiết của AI để căn\n  // lại pinyin chuẩn. Như vậy khoảng trắng/viết liền không bị tính là lỗi phát âm.\n  function alignedExpectedFromHeard(expectedPinyin,heardSyllables){\n    const stream=pinyinLetterStream(expectedPinyin);\n    const expectedBase=stream.map(x=>x.base).join('');\n    const heardBase=heardSyllables.map(x=>x.base).join('');\n    if(!heardSyllables.length||expectedBase!==heardBase)return null;\n    let pos=0;\n    const out=[];\n    for(const h of heardSyllables){\n      const seg=stream.slice(pos,pos+h.base.length); pos+=h.base.length;\n      const tones=seg.map(x=>x.tone).filter(Boolean);\n      out.push({base:seg.map(x=>x.base).join(''),tone:tones.length?tones[0]:0});\n    }\n    return pos===stream.length?out:null;\n  }\n\n  function pronunciationMetrics(expectedPinyin,heardPinyin){\n    const heard=pinyinSyllables(heardPinyin);\n    const aligned=alignedExpectedFromHeard(expectedPinyin,heard);\n    const a=aligned||pinyinSyllables(expectedPinyin),b=heard,n=a.length,m=b.length;\n    const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));\n    for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;\n    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1));\n    let i=n,j=m,segmentErrors=0,toneErrors=0,toneCompared=0;\n    while(i>0||j>0){\n      if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1)){\n        if(a[i-1].base===b[j-1].base){toneCompared++;if(a[i-1].tone!==b[j-1].tone)toneErrors++}else segmentErrors++;\n        i--;j--;\n      }else if(i>0&&dp[i][j]===dp[i-1][j]+1){segmentErrors++;i--}else{segmentErrors++;j--}\n    }\n    const toneErrorRate=toneCompared?Math.round(toneErrors*1000/toneCompared)/10:100;\n    return {segmentErrors,toneErrors,toneCompared,toneErrorRate,totalExpected:n};\n  }\n\n  function dialogueLevel(result,expectedPinyin){\n    const score=Math.max(0,Math.min(100,Math.round(Number(result?.score)||0)));\n    const heard=String(result?.heardPinyin||'').trim();\n    if(result?.error||!heard)return {key:'retry_tech',level:'🔄 Cần thử lại',cls:'retry-level',passed:false,metrics:null};\n    const metrics=pronunciationMetrics(expectedPinyin,heard);\n    let key='retry',level='🔁 Cần đọc lại',cls='retry-level',passed=false;\n    if(score>=95&&metrics.segmentErrors<=2&&metrics.toneErrorRate<=10){key='excellent';level='🏆 Xuất sắc';cls='excellent-level';passed=true}\n    else if(metrics.segmentErrors<=2&&metrics.toneErrorRate<=10){key='good';level='⭐ Tốt';cls='good-level';passed=true}\n    else if(metrics.segmentErrors<=2&&metrics.toneErrorRate<=30){key='fair';level='🌱 Khá';cls='fair-level';passed=true}\n    return {key,level,cls,passed,metrics,score};\n  }\n\n  async function handlePracticeBlob(session,blob){\n    setState('⏳ Đã thu xong. Đang gửi audio để chấm…','practice');\n    els.record.disabled=true;els.play.disabled=true;\n    try{\n      const it=items()[session.itemIndex];\n      const result=await scoreAudio(blob,session.expected,it?.pinyin||'');\n      const passed=tab==='vocab' ? Number(result.score)>=PRACTICE_PASS_SCORE : dialogueLevel(result,it?.pinyin||'').passed;\n      if(passed) markDone(session.itemIndex);\n      else {const a=progressList(),pos=a.indexOf(session.itemIndex);if(pos>=0){a.splice(pos,1);saveProgress();renderStatus();renderDots();renderMeta();renderPhases()}}\n      showPracticeScore(session.expected,result,null);\n    }catch(e){\n      showPracticeScore(session.expected,{heard:'',score:0,match:0},e);\n    }finally{\n      els.record.disabled=false;els.play.disabled=false;renderMeta();\n    }\n  }\n\n  function resetPracticeFeedback(){els.aiPanel.classList.add('hidden');els.aiContent.innerHTML='';setState('Nghe mẫu rồi đọc theo. Đạt mức Khá trở lên mới mở “Tiếp theo”.','practice')}\n\n  function showPracticeScore(expected,result,err){\n    els.aiPanel.classList.remove('hidden');\n    els.aiBadge.textContent=err?'Lỗi kết nối':'Đã chấm theo âm';els.aiBadge.classList.toggle('connected',!err);\n    if(err){\n      const quota=err?.isQuota===true;\n      els.aiBadge.textContent=quota?'Hệ thống đang bận':'Lỗi kết nối';\n      const msg=quota?'Hệ thống chấm đang bận. Vui lòng thử lại sau.':(err.name==='AbortError'?'Chấm quá thời gian. Hãy thử lại.':err.message||String(err));\n      els.aiContent.innerHTML=`<div class=\"instant-score bad\"><strong>—</strong></div><p>${escapeHtml(msg)}</p>`;\n      setState(quota?'Lượt này chưa được chấm và không ảnh hưởng kết quả. Hãy thử lại sau.':'Không chấm được lượt nói. Hãy bấm Nói lại.','practice');\n      renderMeta();return;\n    }\n    const score=Math.max(0,Math.min(100,Math.round(Number(result.score)||0)));\n    const wrong=(result.wrongChars||[]).filter(Boolean);\n    const matched=result.correct===true && wrong.length===0;\n    let passed=tab==='vocab' ? score>=PRACTICE_PASS_SCORE : dialogueLevel(result,items()[index]?.pinyin||'').passed;\n    const heard=result.heardPinyin?`<div class=\"heard-line\">AI nghe pinyin: <b>${escapeHtml(result.heardPinyin)}</b></div>`:'';\n    const feedback=wrong.length\n      ? `<div class=\"heard-line\"><b>Cần luyện thêm:</b> ${escapeHtml(wrong.join(' · '))}</div>`\n      : matched\n        ? '<div class=\"match-ok\">✓ Âm đọc khớp mẫu.</div>'\n        : '<div class=\"heard-line\"><b>Cần luyện thêm:</b> thử đọc chậm và rõ thanh điệu hơn.</div>';\n    if(tab==='vocab'){\n      const gate=passed\n        ? '<div class=\"match-ok\">✓ Đạt mức Khá trở lên · Đã mở “Tiếp theo”.</div>'\n        : '<div class=\"heard-line\"><b>🔁 Cần đọc lại.</b> “Tiếp theo” sẽ mở khi đạt từ 50/100 trở lên.</div>';\n      els.aiContent.innerHTML=`<div class=\"instant-score ${passed?'good':'bad'}\"><strong>${score}/100</strong></div>${heard}${feedback}${gate}`;\n    }else{\n      const it=items()[index];\n      const rubric=dialogueLevel(result,it?.pinyin||'');\n      const {level,cls}=rubric;\n      const passed=rubric.passed;\n      const m=rubric.metrics;\n      const detail=m?`<div class=\"heard-line\">Thanh mẫu/vận mẫu sai: <b>${m.segmentErrors} chữ</b> · Sai thanh điệu: <b>${m.toneErrorRate}%</b></div>`:'';\n      const better=passed&&wrong.length?`<div class=\"heard-line\"><b>Gợi ý cải thiện:</b> ${escapeHtml(wrong.join(' · '))}</div>`:(!passed?feedback:'');\n      const gate=passed\n        ? '<div class=\"match-ok\">✓ Đã mở “Tiếp theo”.</div>'\n        : '<div class=\"heard-line\"><b>Hãy đọc lại câu này.</b> Chưa thể bấm “Tiếp theo”.</div>';\n      els.aiContent.innerHTML=`<div class=\"level-card ${cls}\"><strong>${level}</strong></div>${heard}${detail}${better}${gate}`;\n    }\n    setState(passed?'✓ Đã đạt. Bạn có thể nói lại hoặc sang mục tiếp theo.':'🔁 Cần đọc lại. Hãy luyện lại mục này trước khi sang mục tiếp theo.','practice');\n    renderMeta();\n  }\n\n  function saveTestRecording(i,blob){\n    if(testUrls[i])try{URL.revokeObjectURL(testUrls[i])}catch(e){}\n    testRecordings[i]=blob;testUrls[i]=URL.createObjectURL(blob);testSpeech[i]=null;testIndex=i;\n    setState('✓ Đã ghi nhận. Chưa chấm và chưa hiện kết quả. Bạn có thể nghe lại hoặc thu lại trước khi nộp.','test');\n    renderTestRunner();\n    const nextEmpty=testRecordings.findIndex((x,k)=>!x&&k>i);\n    if(nextEmpty>=0)setTimeout(()=>{if(!activeCapture){testIndex=nextEmpty;renderTestRunner()}},250);\n  }\n\n  async function submitTest(){\n    if(testRecordings.some(x=>!x)||activeCapture)return;\n    const data=testData();\n    els.submitTest.disabled=true;els.retakeAll.disabled=true;els.testRecord.disabled=true;\n    const results=[];\n    for(let i=0;i<data.length;i++){\n      setState(`⏳ Đang chấm ${i+1}/${data.length}… Vui lòng giữ trang này mở.`,'test',true);\n      try{results[i]=await scoreAudio(testRecordings[i],data[i].hanzi,data[i].pinyin||'')}\n      catch(e){\n        if(e?.isQuota){els.retakeAll.disabled=false;els.testRecord.disabled=false;els.submitTest.disabled=false;setState('Hệ thống chấm đang bận. Bài kiểm tra chưa được chấm và không ảnh hưởng kết quả. Vui lòng thử nộp lại sau.','test',true);return}\n        results[i]={heard:'',score:0,match:0,error:e?.message||String(e)};\n      }\n    }\n    testSpeech=results;\n    els.retakeAll.disabled=false;els.testRecord.disabled=false;\n    showTestResult();\n  }\n\n  function showTestResult(){\n    const data=testData();\n    const rows=data.map((it,i)=>{const r=testSpeech[i]||{score:0,wrongChars:[]};return{i,it,...r,failed:(Number(r.score)||0)<PRACTICE_PASS_SCORE}});\n    const avg=Math.round(rows.reduce((s,r)=>s+(Number(r.score)||0),0)/Math.max(rows.length,1));\n    const wrong=rows.filter(r=>r.failed);\n    els.testRunner.classList.add('hidden');els.testResult.classList.remove('hidden');\n    let heading='';\n    if(tab==='dialogue'){\n      const r=rows[0]||{};\n      const hasError=!!r.error, wrongChars=(r.wrongChars||[]).length;\n      const rubric=dialogueLevel(r,r.it?.pinyin||'');\n      let level=rubric.level,cls=rubric.cls,msg;\n      if(rubric.key==='retry_tech')msg='Hệ thống chưa nhận đủ âm thanh để đánh giá. Hãy kiểm tra microphone và thử lại.';\n      else if(rubric.key==='excellent')msg='Độ chính xác từ 95% trở lên, thanh mẫu/vận mẫu và thanh điệu rất tốt.';\n      else if(rubric.key==='good')msg='Thanh mẫu/vận mẫu cơ bản chính xác, lỗi thanh điệu không quá 10%.';\n      else if(rubric.key==='fair')msg='Đạt mức Khá: sai nhẹ thanh mẫu/vận mẫu tối đa 1–2 chữ và lỗi thanh điệu không quá 30%.';\n      else msg='Cần đọc lại: sai thanh mẫu/vận mẫu từ 3 chữ trở lên hoặc lỗi thanh điệu trên 30%.';\n      els.resultScore.textContent=level;\n      const chars=[...new Set((r.wrongChars||[]).filter(Boolean))];\n      const dialogueItems=items();\n      let practiceLines=[];\n      if(chars.length){\n        practiceLines=dialogueItems.map((x,i)=>({x,i,hits:chars.filter(ch=>String(x.hanzi||'').includes(ch))})).filter(o=>o.hits.length).slice(0,4);\n      }\n      const practiceHtml=practiceLines.length\n        ? `<div class=\"result-summary\"><b>🎯 ${rubric.passed?'Gợi ý cải thiện':'Câu cần luyện lại'}</b><span>${practiceLines.map(o=>`Câu ${o.i+1}: ${escapeHtml(o.x.hanzi)}`).join('<br>')}</span></div>`\n        : (!hasError&&rubric.passed&&level!=='🏆 Xuất sắc'?'<div class=\"result-summary\"><b>🎯 Gợi ý cải thiện</b><span>Có thể luyện thêm để bài đọc tự nhiên và ổn định hơn.</span></div>':'');\n      heading=`<div class=\"level-card ${cls}\"><strong>${level}</strong><p>${msg}</p></div>${practiceHtml}`;\n    }else{\n      els.resultScore.textContent=avg+'/100';\n      heading=wrong.length?`<div class=\"result-summary\"><b>${wrong.length} từ cần luyện lại.</b><span>Mỗi từ chấm theo thang 100/100; từ dưới 50/100 cần đọc lại.</span></div>`:`<div class=\"result-summary success\"><b>✓ Toàn bộ phần kiểm tra đã đạt.</b><span>Mỗi từ được chấm theo thang 100/100.</span></div>`;\n    }\n    const wrongHtml=(tab==='dialogue'?[]:wrong).map(r=>{\n      const chars=(r.wrongChars||[]).filter(Boolean);\n      return `<article class=\"wrong-card\"><div class=\"wrong-head\"><b>${tab==='vocab'?'Từ ':'Câu '}${r.i+1}</b><span>${r.score}/100</span></div>${r.error?`<div class=\"heard-line\">Lỗi chấm: ${escapeHtml(r.error)}</div>`:''}<div class=\"heard-line\">Chuẩn: <b>${escapeHtml(r.it.hanzi)}</b></div>${chars.length?`<div class=\"heard-line\">Nội dung cần đọc lại: <b>${escapeHtml(chars.join(' · '))}</b></div>`:''}</article>`;\n    }).join('');\n    els.resultBody.innerHTML=heading+wrongHtml;\n    const result={score:avg,wrongCount:wrong.length,at:new Date().toISOString()};\n    if(tab==='vocab')saved.tests.vocab=result;else saved.tests.dialogue[dialogueNo]=result;\n    saveProgress();renderStatus();\n\n    // NGOCTHUCAC LMS bridge: report only a completed Shadowing TEST.\n    // It does not contain Supabase cr s(text){\n    const toneMap={ā:['a',1],á:['a',2],ǎ:['a',3],à:['a',4],ē:['e',1],é:['e',2],ě:['e',3],è:['e',4],ī:['i',1],í:['i',2],ǐ:['i',3],ì:['i',4],ō:['o',1],ó:['o',2],ǒ:['o',3],ò:['o',4],ū:['u',1],ú:['u',2],ǔ:['u',3],ù:['u',4],ǖ:['v',1],ǘ:['v',2],ǚ:['v',3],ǜ:['v',4],ü:['v',0]};\n    return String(text||'').toLowerCase().replace(/u:/g,'v').split(/[^a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜv0-5]+/).filter(Boolean).map(raw=>{\n      let base='',tone=0;\n      for(const ch of raw){if(toneMap[ch]){base+=toneMap[ch][0];tone=toneMap[ch][1]||tone}else if(/[1-5]/.test(ch)){tone=Number(ch)===5?0:Number(ch)}else if(/[a-zv]/.test(ch))base+=ch}\n      return {base,tone};\n    }).filter(x=>x.base);\n  }\n\n  function pinyinLetterStream(text){\n    const toneMap={ā:['a',1],á:['a',2],ǎ:['a',3],à:['a',4],ē:['e',1],é:['e',2],ě:['e',3],è:['e',4],ī:['i',1],í:['i',2],ǐ:['i',3],ì:['i',4],ō:['o',1],ó:['o',2],ǒ:['o',3],ò:['o',4],ū:['u',1],ú:['u',2],ǔ:['u',3],ù:['u',4],ǖ:['v',1],ǘ:['v',2],ǚ:['v',3],ǜ:['v',4],ü:['v',0]};\n    const out=[];\n    for(const ch0 of String(text||'').toLowerCase().replace(/u:/g,'v')){\n      const ch=ch0.normalize('NFC');\n      if(toneMap[ch]) out.push({base:toneMap[ch][0],tone:toneMap[ch][1]});\n      else if(/[a-zv]/.test(ch)) out.push({base:ch,tone:0});\n    }\n    return out;\n  }\n\n  // Pinyin trong data có thể viết liền theo từ (Fǎguó, Zhōngwén, lǎoshī...),\n  // còn AI thường trả theo âm tiết (fǎ guó, zhōng wén, lǎo shī...).\n  // Nếu chuỗi âm cơ sở giống hệt nhau, dùng ranh giới âm tiết của AI để căn\n  // lại pinyin chuẩn. Như vậy khoảng trắng/viết liền không bị tính là lỗi phát âm.\n  function alignedExpectedFromHeard(expectedPinyin,heardSyllables){\n    const stream=pinyinLetterStream(expectedPinyin);\n    const expectedBase=stream.map(x=>x.base).join('');\n    const heardBase=heardSyllables.map(x=>x.base).join('');\n    if(!heardSyllables.length||expectedBase!==heardBase)return null;\n    let pos=0;\n    const out=[];\n    for(const h of heardSyllables){\n      const seg=stream.slice(pos,pos+h.base.length); pos+=h.base.length;\n      const tones=seg.map(x=>x.tone).filter(Boolean);\n      out.push({base:seg.map(x=>x.base).join(''),tone:tones.length?tones[0]:0});\n    }\n    return pos===stream.length?out:null;\n  }\n\n  function pronunciationMetrics(expectedPinyin,heardPinyin){\n    const heard=pinyinSyllables(heardPinyin);\n    const aligned=alignedExpectedFromHeard(expectedPinyin,heard);\n    const a=aligned||pinyinSyllables(expectedPinyin),b=heard,n=a.length,m=b.length;\n    const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));\n    for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;\n    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1));\n    let i=n,j=m,segmentErrors=0,toneErrors=0,toneCompared=0;\n    while(i>0||j>0){\n      if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1].base===b[j-1].base?0:1)){\n        if(a[i-1].base===b[j-1].base){toneCompared++;if(a[i-1].tone!==b[j-1].tone)toneErrors++}else segmentErrors++;\n        i--;j--;\n      }else if(i>0&&dp[i][j]===dp[i-1][j]+1){segmentErrors++;i--}else{segmentErrors++;j--}\n    }\n    const toneErrorRate=toneCompared?Math.round(toneErrors*1000/toneCompared)/10:100;\n    return {segmentErrors,toneErrors,toneCompared,toneErrorRate,totalExpected:n};\n  }\n\n  function dialogueLevel(result,expectedPinyin){\n    const score=Math.max(0,Math.min(100,Math.round(Number(result?.score)||0)));\n    const heard=String(result?.heardPinyin||'').trim();\n    if(result?.error||!heard)return {key:'retry_tech',level:'🔄 Cần thử lại',cls:'retry-level',passed:false,metrics:null};\n    const metrics=pronunciationMetrics(expectedPinyin,heard);\n    let key='retry',level='🔁 Cần đọc lại',cls='retry-level',passed=false;\n    if(score>=95&&metrics.segmentErrors<=2&&metrics.toneErrorRate<=10){key='excellent';level='🏆 Xuất sắc';cls='excellent-level';passed=true}\n    else if(metrics.segmentErrors<=2&&metrics.toneErrorRate<=10){key='good';level='⭐ Tốt';cls='good-level';passed=true}\n    else if(metrics.segmentErrors<=2&&metrics.toneErrorRate<=30){key='fair';level='🌱 Khá';cls='fair-level';passed=true}\n    return {key,level,cls,passed,metrics,score};\n  }\n\n  async function handlePracticeBlob(session,blob){\n    setState('⏳ Đã thu xong. Đang gửi audio để chấm…','practice');\n    els.record.disabled=true;els.play.disabled=true;\n    try{\n      const it=items()[session.itemIndex];\n      const result=await scoreAudio(blob,session.expected,it?.pinyin||'');\n      const passed=tab==='vocab' ? Number(result.score)>=PRACTICE_PASS_SCORE : dialogueLevel(result,it?.pinyin||'').passed;\n      if(passed) markDone(session.itemIndex);\n      else {const a=progressList(),pos=a.indexOf(session.itemIndex);if(pos>=0){a.splice(pos,1);saveProgress();renderStatus();renderDots();renderMeta();renderPhases()}}\n      showPracticeScore(session.expected,result,null);\n    }catch(e){\n      showPracticeScore(session.expected,{heard:'',score:0,match:0},e);\n    }finally{\n      els.record.disabled=false;els.play.disabled=false;renderMeta();\n    }\n  }\n\n  function resetPracticeFeedback(){els.aiPanel.classList.add('hidden');els.aiContent.innerHTML='';setState('Nghe mẫu rồi đọc theo. Đạt mức Khá trở lên mới mở “Tiếp theo”.','practice')}\n\n  function showPracticeScore(expected,result,err){\n    els.aiPanel.classList.remove('hidden');\n    els.aiBadge.textContent=err?'Lỗi kết nối':'Đã chấm theo âm';els.aiBadge.classList.toggle('connected',!err);\n    if(err){\n      const quota=err?.isQuota===true;\n      els.aiBadge.textContent=quota?'Hệ thống đang bận':'Lỗi kết nối';\n      const msg=quota?'Hệ thống chấm đang bận. Vui lòng thử lại sau.':(err.name==='AbortError'?'Chấm quá thời gian. Hãy thử lại.':err.message||String(err));\n      els.aiContent.innerHTML=`<div class=\"instant-score bad\"><strong>—</strong></div><p>${escapeHtml(msg)}</p>`;\n      setState(quota?'Lượt này chưa được chấm và không ảnh hưởng kết quả. Hãy thử lại sau.':'Không chấm được lượt nói. Hãy bấm Nói lại.','practice');\n      renderMeta();return;\n    }\n    const score=Math.max(0,Math.min(100,Math.round(Number(result.score)||0)));\n    const wrong=(result.wrongChars||[]).filter(Boolean);\n    const matched=result.correct===true && wrong.length===0;\n    let passed=tab==='vocab' ? score>=PRACTICE_PASS_SCORE : dialogueLevel(result,items()[index]?.pinyin||'').passed;\n    const heard=result.heardPinyin?`<div class=\"heard-line\">AI nghe pinyin: <b>${escapeHtml(result.heardPinyin)}</b></div>`:'';\n    const feedback=wrong.length\n      ? `<div class=\"heard-line\"><b>Cần luyện thêm:</b> ${escapeHtml(wrong.join(' · '))}</div>`\n      : matched\n        ? '<div class=\"match-ok\">✓ Âm đọc khớp mẫu.</div>'\n        : '<div class=\"heard-line\"><b>Cần luyện thêm:</b> thử đọc chậm và rõ thanh điệu hơn.</div>';\n    if(tab==='vocab'){\n      const gate=passed\n        ? '<div class=\"match-ok\">✓ Đạt mức Khá trở lên · Đã mở “Tiếp theo”.</div>'\n        : '<div class=\"heard-line\"><b>🔁 Cần đọc lại.</b> “Tiếp theo” sẽ mở khi đạt từ 50/100 trở lên.</div>';\n      els.aiContent.innerHTML=`<div class=\"instant-score ${passed?'good':'bad'}\"><strong>${score}/100</strong></div>${heard}${feedback}${gate}`;\n    }else{\n      const it=items()[index];\n      const rubric=dialogueLevel(result,it?.pinyin||'');\n      const {level,cls}=rubric;\n      const passed=rubric.passed;\n      const m=rubric.metrics;\n      const detail=m?`<div class=\"heard-line\">Thanh mẫu/vận mẫu sai: <b>${m.segmentErrors} chữ</b> · Sai thanh điệu: <b>${m.toneErrorRate}%</b></div>`:'';\n      const better=passed&&wrong.length?`<div class=\"heard-line\"><b>Gợi ý cải thiện:</b> ${escapeHtml(wrong.join(' · '))}</div>`:(!passed?feedback:'');\n      const gate=passed\n        ? '<div class=\"match-ok\">✓ Đã mở “Tiếp theo”.</div>'\n        : '<div class=\"heard-line\"><b>Hãy đọc lại câu này.</b> Chưa thể bấm “Tiếp theo”.</div>';\n      els.aiContent.innerHTML=`<div class=\"level-card ${cls}\"><strong>${level}</strong></div>${heard}${detail}${better}${gate}`;\n    }\n    setState(passed?'✓ Đã đạt. Bạn có thể nói lại hoặc sang mục tiếp theo.':'🔁 Cần đọc lại. Hãy luyện lại mục này trước khi sang mục tiếp theo.','practice');\n    renderMeta();\n  }\n\n  function saveTestRecording(i,blob){\n    if(testUrls[i])try{URL.revokeObjectURL(testUrls[i])}catch(e){}\n    testRecordings[i]=blob;testUrls[i]=URL.createObjectURL(blob);testSpeech[i]=null;testIndex=i;\n    setState('✓ Đã ghi nhận. Chưa chấm và chưa hiện kết quả. Bạn có thể nghe lại hoặc thu lại trước khi nộp.','test');\n    renderTestRunner();\n    const nextEmpty=testRecordings.findIndex((x,k)=>!x&&k>i);\n    if(nextEmpty>=0)setTimeout(()=>{if(!activeCapture){testIndex=nextEmpty;renderTestRunner()}},250);\n  }\n\n  async function submitTest(){\n    if(testRecordings.some(x=>!x)||activeCapture)return;\n    const data=testData();\n    els.submitTest.disabled=true;els.retakeAll.disabled=true;els.testRecord.disabled=true;\n    const results=[];\n    for(let i=0;i<data.length;i++){\n      setState(`⏳ Đang chấm ${i+1}/${data.length}… Vui lòng giữ trang này mở.`,'test',true);\n      try{results[i]=await scoreAudio(testRecordings[i],data[i].hanzi,data[i].pinyin||'')}\n      catch(e){\n        if(e?.isQuota){els.retakeAll.disabled=false;els.testRecord.disabled=false;els.submitTest.disabled=false;setState('Hệ thống chấm đang bận. Bài kiểm tra chưa được chấm và không ảnh hưởng kết quả. Vui lòng thử nộp lại sau.','test',true);return}\n        results[i]={heard:'',score:0,match:0,error:e?.message||String(e)};\n      }\n    }\n    testSpeech=results;\n    els.retakeAll.disabled=false;els.testRecord.disabled=false;\n    showTestResult();\n  }\n\n  function showTestResult(){\n    const data=testData();\n    const rows=data.map((it,i)=>{const r=testSpeech[i]||{score:0,wrongChars:[]};return{i,it,...r,failed:(Number(r.score)||0)<PRACTICE_PASS_SCORE}});\n    const avg=Math.round(rows.reduce((s,r)=>s+(Number(r.score)||0),0)/Math.max(rows.length,1));\n    const wrong=rows.filter(r=>r.failed);\n    els.testRunner.classList.add('hidden');els.testResult.classList.remove('hidden');\n    let heading='';\n    if(tab==='dialogue'){\n      const r=rows[0]||{};\n      const hasError=!!r.error, wrongChars=(r.wrongChars||[]).length;\n      const rubric=dialogueLevel(r,r.it?.pinyin||'');\n      let level=rubric.level,cls=rubric.cls,msg;\n      if(rubric.key==='retry_tech')msg='Hệ thống chưa nhận đủ âm thanh để đánh giá. Hãy kiểm tra microphone và thử lại.';\n      else if(rubric.key==='excellent')msg='Độ chính xác từ 95% trở lên, thanh mẫu/vận mẫu và thanh điệu rất tốt.';\n      else if(rubric.key==='good')msg='Thanh mẫu/vận mẫu cơ bản chính xác, lỗi thanh điệu không quá 10%.';\n      else if(rubric.key==='fair')msg='Đạt mức Khá: sai nhẹ thanh mẫu/vận mẫu tối đa 1–2 chữ và lỗi thanh điệu không quá 30%.';\n      else msg='Cần đọc lại: sai thanh mẫu/vận mẫu từ 3 chữ trở lên hoặc lỗi thanh điệu trên 30%.';\n      els.resultScore.textContent=level;\n      const chars=[...new Set((r.wrongChars||[]).filter(Boolean))];\n      const dialogueItems=items();\n      let practiceLines=[];\n      if(chars.length){\n        practiceLines=dialogueItems.map((x,i)=>({x,i,hits:chars.filter(ch=>String(x.hanzi||'').includes(ch))})).filter(o=>o.hits.length).slice(0,4);\n      }\n      const practiceHtml=practiceLines.length\n        ? `<div class=\"result-summary\"><b>🎯 ${rubric.passed?'Gợi ý cải thiện':'Câu cần luyện lại'}</b><span>${practiceLines.map(o=>`Câu ${o.i+1}: ${escapeHtml(o.x.hanzi)}`).join('<br>')}</span></div>`\n        : (!hasError&&rubric.passed&&level!=='🏆 Xuất sắc'?'<div class=\"result-summary\"><b>🎯 Gợi ý cải thiện</b><span>Có thể luyện thêm để bài đọc tự nhiên và ổn định hơn.</span></div>':'');\n      heading=`<div class=\"level-card ${cls}\"><strong>${level}</strong><p>${msg}</p></div>${practiceHtml}`;\n    }else{\n      els.resultScore.textContent=avg+'/100';\n      heading=wrong.length?`<div class=\"result-summary\"><b>${wrong.length} từ cần luyện lại.</b><span>Mỗi từ chấm theo thang 100/100; từ dưới 50/100 cần đọc lại.</span></div>`:`<div class=\"result-summary success\"><b>✓ Toàn bộ phần kiểm tra đã đạt.</b><span>Mỗi từ được chấm theo thang 100/100.</span></div>`;\n    }\n    const wrongHtml=(tab==='dialogue'?[]:wrong).map(r=>{\n      const chars=(r.wrongChars||[]).filter(Boolean);\n      return `<article class=\"wrong-card\"><div class=\"wrong-head\"><b>${tab==='vocab'?'Từ ':'Câu '}${r.i+1}</b><span>${r.score}/100</span></div>${r.error?`<div class=\"heard-line\">Lỗi chấm: ${escapeHtml(r.error)}</div>`:''}<div class=\"heard-line\">Chuẩn: <b>${escapeHtml(r.it.hanzi)}</b></div>${chars.length?`<div class=\"heard-line\">Nội dung cần đọc lại: <b>${escapeHtml(chars.join(' · '))}</b></div>`:''}</article>`;\n    }).join('');\n    els.resultBody.innerHTML=heading+wrongHtml;\n    const result={score:avg,wrongCount:wrong.length,at:new Date().toISOString()};\n    if(tab==='vocab')saved.tests.vocab=result;else saved.tests.dialogue[dialogueNo]=result;\n    saveProgress();renderStatus();\n\n    // NGOCTHUCAC LMS bridge: report only a completed Shadowing TEST.\n    // It does not contain Supabase credentials or student identity.\n    try {\n      const level = String(window.__SHADOWING_ACTIVE_LEVEL || '').toUpperCase();\n      const lessonTitle = String(DATA?.source?.lessonTitle || '');\n      const section = tab === 'vocab' ? 'vocab' : 'dialogue';\n      const dialogueRubric = section === 'dialogue' ? dialogueLevel(rows[0] || {}, rows[0]?.it?.pinyin || '') : null;\n      const passedCount = section === 'vocab' ? Math.max(0, data.length - wrong.length) : (dialogueRubric?.passed ? 1 : 0);\n      const totalUnits = COURSE.lessons.reduce((sum, lesson) => {\n        const dialogueUnits = new Set((lesson.dialogue || []).map(x => x.textNo)).size;\n        return sum + 1 + dialogueUnits;\n      }, 0);\n      const unitId = section === 'vocab' ? `${level.toLowerCase()}-lesson-${lessonNo}-vocab` : `${level.toLowerCase()}-lesson-${lessonNo}-dialogue-${dialogueNo}`;\n      const unitLabel = section === 'vocab' ? `Bài ${lessonNo} · Từ vựng` : `Bài ${lessonNo} · Bài khóa ${dialogueNo}`;\n      window.parent.postMessage({type:'shadowingResult',payload:{\n        level, lessonNo, lessonTitle, section, dialogueNo: section === 'dialogue' ? dialogueNo : null,\n        score: avg, passedCount, itemCount: data.length,\n        rating: section === 'dialogue' ? String(els.resultScore.textContent || '') : '',\n        unitId, unitLabel, totalUnits\n      }}, '*');\n    } catch (e) { console.warn('Shadowing LMS bridge:', e); }\n  }\n\n  function renderLessonChrome(){\n    document.title=`Shadowing HSK3 · MASTER SAFE · Bài ${lessonNo}`;\n    els.headerLessonNo.textContent=lessonNo;\n    els.headerLessonTitle.textContent=DATA.source.lessonTitle||'';\n    els.vocabCount.textContent=DATA.vocabulary.length;\n    els.dialogueCount.textContent=allDialogueNos().length+' bài';\n    els.lessonStrip.innerHTML='';\n    COURSE.lessons.forEach((lesson,idx)=>{\n      const n=idx+1,b=document.createElement('button');\n      b.className='lesson-chip'+(n===lessonNo?' active':'');b.textContent='Bài '+n;b.title=lesson.source.lessonTitle||'';\n      b.onclick=()=>switchLesson(n);els.lessonStrip.appendChild(b);\n      if(n===lessonNo)setTimeout(()=>b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}),0);\n    });\n  }\n\n  function switchLesson(n){\n    n=Math.max(1,Math.min(COURSE.lessons.length,Number(n)||1));\n    if(n===lessonNo)return;\n    stopEverything();resetTestSession();lessonNo=n;DATA=COURSE.lessons[lessonNo-1];saved=lessonProgress(lessonNo);\n    tab='vocab';phase='practice';dialogueNo=allDialogueNos()[0]||1;index=0;resetPracticeFeedback();\n    document.querySelectorAll('.content-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='vocab'));\n    try{history.replaceState(null,'',`${location.pathname}?lesson=${lessonNo}`)}catch(e){}\n    renderAll();\n  }\n\n  function renderAll(){renderLessonChrome();renderDialoguePicker();renderStatus();renderPhases();if(phase==='practice'){els.practiceView.classList.remove('hidden');els.testView.classList.add('hidden');renderPractice()}else{els.practiceView.classList.add('hidden');els.testView.classList.remove('hidden');renderTestIntro()}}\n\n  function cancelCapture(){\n    const s=activeCapture;if(!s)return;\n    if(s.hardTimer)clearTimeout(s.hardTimer);s.stopping=true;stopAudioGraph(s);activeCapture=null;\n    setRecordingButtons(false,'practice');setRecordingButtons(false,'test');\n  }\n  function stopEverything(){stopSample();cancelCapture()}\n\n  document.querySelectorAll('.content-tab').forEach(b=>b.onclick=()=>{stopEverything();tab=b.dataset.tab;phase='practice';index=0;dialogueNo=allDialogueNos()[0]||1;resetPracticeFeedback();resetTestSession();document.querySelectorAll('.content-tab').forEach(x=>x.classList.toggle('active',x===b));renderAll()});\n  document.querySelectorAll('.phase-tab').forEach(b=>b.onclick=()=>{if(b.disabled)return;stopEverything();phase=b.dataset.phase;resetPracticeFeedback();resetTestSession();renderAll()});\n\n  els.play.onclick=()=>playSegment(current()).then(()=>setState(tab==='vocab'?'Đã phát xong giọng nữ mẫu. Bấm “Đọc theo” để luyện.':'Đã phát xong audio mẫu. Bấm “Đọc theo” để luyện.','practice')).catch(e=>setState('⚠️ '+e.message,'practice'));\n  els.record.onclick=()=>startCapture('practice').catch(e=>{setState('⚠️ '+e.message,'practice');els.warning.classList.remove('hidden')});\n  els.stop.onclick=stopCaptureManual;\n  els.retry.onclick=()=>startCapture('practice').catch(e=>setState('⚠️ '+e.message,'practice'));\n  els.prev.onclick=()=>{if(index>0&&!activeCapture){stopEverything();index--;resetPracticeFeedback();renderPractice()}};\n  els.next.onclick=els.nextInline.onclick=()=>{if(index<items().length-1&&!activeCapture&&isDone(index)){stopEverything();index++;resetPracticeFeedback();renderPractice()}};\n\n  els.startTest.onclick=startTest;\n  els.testRecord.onclick=()=>startCapture('test').catch(e=>{setState('⚠️ '+e.message,'test');els.warning.classList.remove('hidden')});\n  els.testStop.onclick=stopCaptureManual;\n  els.testPlayMine.onclick=()=>{if(testUrls[testIndex]){els.mineAudio.src=testUrls[testIndex];els.mineAudio.play().catch(()=>{})}};\n  els.retakeAll.onclick=()=>{if(confirm('Thu lại toàn bộ phần kiểm tra này?')){resetTestSession();els.testIntro.classList.add('hidden');els.testRunner.classList.remove('hidden');renderTestRunner()}};\n  els.submitTest.onclick=submitTest;\n  els.backPractice.onclick=()=>{phase='practice';renderAll()};\n  els.redoTest.onclick=()=>{resetTestSession();els.testIntro.classList.add('hidden');els.testRunner.classList.remove('hidden');renderTestRunner()};\n  els.reset.onclick=()=>{if(confirm(`Xóa tiến độ luyện tập/điểm kiểm tra của HSK2 Bài ${lessonNo}?`)){courseSaved.lessons[lessonNo]=defaultLessonProgress();saved=courseSaved.lessons[lessonNo];saveProgress();resetTestSession();phase='practice';index=0;renderAll()}};\n\n  window.addEventListener('beforeunload',()=>{try{stopEverything();clearTestUrls();if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}});\n  if(location.protocol==='file:'||!window.isSecureContext)els.warning.classList.remove('hidden');\n  renderAll();\n})();\n"};

  document.getElementById('courseStyle').textContent=COURSE_CSS[active];
  document.body.innerHTML=COURSE_BODY[active];
  document.body.insertAdjacentHTML('afterbegin', `<div class="level-switcher" style="max-width:1400px;margin:18px auto 10px;padding:0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:system-ui,-apple-system,sans-serif"><strong style="margin-right:4px;color:#6f5459">Chọn cấp:</strong><button data-level="hsk1" style="padding:10px 18px;border-radius:12px;border:1px solid #e6cfd3;background:#fff;color:#6f5459;font-weight:800;cursor:pointer">HSK1</button><button data-level="hsk2" style="padding:10px 18px;border-radius:12px;border:1px solid #e6cfd3;background:#fff;color:#6f5459;font-weight:800;cursor:pointer">HSK2</button><button data-level="hsk3" style="padding:10px 18px;border-radius:12px;border:1px solid #e6cfd3;background:#fff;color:#6f5459;font-weight:800;cursor:pointer">HSK3</button></div>`);
  document.querySelectorAll('.level-switcher button').forEach(btn=>{
    const lv=btn.dataset.level;
    btn.classList.toggle('active',lv===active);
    if(lv===active){btn.style.background='#b94f69';btn.style.color='#fff';btn.style.borderColor='#b94f69'}
    btn.onclick=()=>{
      if(lv===active)return;
      try{localStorage.setItem('shadowing_active_level',lv)}catch(e){}
      const u=new URL(location.href);u.searchParams.set('level',lv);u.searchParams.delete('lesson');location.href=u.toString();
    };
  });
  window.__SHADOWING_ACTIVE_LEVEL=active;
  setTimeout(()=>window.__applyShadowingAccessUi && window.__applyShadowingAccessUi(),0);
  try{
    (0,eval)(COURSE_DATA_JS[active]);
    (0,eval)(COURSE_APP_JS[active]);
  }catch(err){
    console.error(err);
    const box=document.createElement('pre');
    box.style='white-space:pre-wrap;background:#fff1f1;color:#8a243b;padding:16px;border-radius:12px;margin:20px;font:14px/1.5 system-ui';
    box.textContent='Lỗi khởi tạo Shadowing: '+(err&&err.message?err.message:err);
    document.body.prepend(box);
  }
})();
</script>

<script>
// NGOCTHUCAC teacher-controlled quota gate — loaded AFTER Shadowing app bootstrap.
(function(){
  const LOCK_MESSAGE='🔒 Giáo viên đang tạm khóa chức năng chấm phát âm. Vui lòng quay lại sau 14h ngày tiếp theo.';
  window.__SHADOWING_ACCESS_ENABLED=false;
  window.__SHADOWING_LOCK_MESSAGE=LOCK_MESSAGE;
  function applyGate(){
    const enabled=window.__SHADOWING_ACCESS_ENABLED===true;
    const ids=['recordBtn','retryBtn','testRecordBtn','submitTestBtn','startTestBtn','redoTestBtn','retakeAllBtn'];
    ids.forEach(id=>{
      const el=document.getElementById(id); if(!el)return;
      if(!enabled){
        if(el.dataset.gateSavedDisabled==null)el.dataset.gateSavedDisabled=el.disabled?'1':'0';
        el.dataset.gateLocked='1'; el.disabled=true; el.title=window.__SHADOWING_LOCK_MESSAGE;
      } else if(el.dataset.gateLocked==='1'){
        const was=el.dataset.gateSavedDisabled==='1';
        delete el.dataset.gateLocked; delete el.dataset.gateSavedDisabled;
        el.disabled=was; el.removeAttribute('title');
      }
    });
    let note=document.getElementById('shadowingTeacherLockNotice');
    if(!enabled){
      if(!note){
        note=document.createElement('div'); note.id='shadowingTeacherLockNotice';
        note.style='max-width:1040px;margin:10px auto;padding:11px 14px;border-radius:12px;background:#fff1f3;border:1px solid #e6c7ce;color:#7d3e4d;font:700 13px/1.45 system-ui,-apple-system,sans-serif;text-align:center';
        document.body.insertBefore(note,document.body.firstChild);
      }
      note.textContent=window.__SHADOWING_LOCK_MESSAGE;
    } else if(note)note.remove();
  }
  const nativeFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||'';
    if(String(url).includes('/functions/v1/shadowing-score')&&window.__SHADOWING_ACCESS_ENABLED!==true){
      return Promise.reject(new Error(window.__SHADOWING_LOCK_MESSAGE));
    }
    return nativeFetch(input,init);
  };
  window.addEventListener('message',function(event){
    const d=event.data||{};
    if(d.type!=='shadowingAccessState')return;
    window.__SHADOWING_ACCESS_ENABLED=d.enabled===true;
    if(d.message)window.__SHADOWING_LOCK_MESSAGE=String(d.message);
    applyGate();
  });
  applyGate();
  try{window.parent.postMessage({type:'shadowingAccessRequest'},'*');}catch(e){}

  // Dual-mode access check: works both inside NGOCTHUCAC iframe and as standalone Shadowing.
  // This reads only the public boolean app_settings.shadowing_enabled; RLS keeps updates teacher-only.
  const SETTINGS_URL='https://niwgxybwtsbbnugrhdvs.supabase.co/rest/v1/app_settings?key=eq.shadowing_enabled&select=value';
  const SETTINGS_KEY='sb_publishable_Yt4cpTD-xKzzJUzbeejaLg_rReBZwFt';
  async function refreshAccessFromSupabase(){
    try{
      const r=await nativeFetch(SETTINGS_URL,{
        method:'GET',
        headers:{'apikey':SETTINGS_KEY,'Authorization':'Bearer '+SETTINGS_KEY,'Accept':'application/json'},
        cache:'no-store'
      });
      if(!r.ok)throw new Error('HTTP '+r.status);
      const rows=await r.json();
      const enabled=Array.isArray(rows)&&rows[0]&&rows[0].value===true;
      window.__SHADOWING_ACCESS_ENABLED=enabled;
      applyGate();
      return enabled;
    }catch(e){
      console.warn('Shadowing access check:',e);
      // Fail closed: keep viewing/listening available, but never send Gemini requests if setting cannot be verified.
      window.__SHADOWING_ACCESS_ENABLED=false;
      applyGate();
      return false;
    }
  }
  window.__refreshShadowingAccess=refreshAccessFromSupabase;
  refreshAccessFromSupabase();
  // Refresh periodically so a teacher toggle takes effect without redeploy/reload.
  setInterval(refreshAccessFromSupabase,15000);
})();
</script>
