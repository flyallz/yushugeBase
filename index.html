<script>
let lang='vi',tab='upcoming';
// ---------- 多教师品牌：/t/<slug> ----------
// 首页按专属链接换品牌：默认明玉（co-ngoc）；/t/<slug> 读该老师的品牌。
// 数据来自迁移 10/10b 的 ntc_get_teacher_branding / ntc_get_teacher_classes
// （SECURITY DEFINER 公开读）。取不到（未知 slug、断网、CDN 被挡）时保持
// 硬编码的明玉版页面，不报错、不空白。首次渲染会先闪一下明玉版，取到
// 品牌后再换——静态站无服务端渲染，v1 接受这个闪动。
let teacherSlug='co-ngoc',teacherBrand=null,teacherClassCodes=null,teacherClasses=[];
function currentTeacherSlug(){const m=location.pathname.match(/^\/t\/([A-Za-z0-9-]+)\/?$/);return m?m[1].toLowerCase():'co-ngoc';}
function absBrandUrl(u){if(!u)return '';if(/^https?:\/\//i.test(u)||u.charAt(0)==='/')return u;return '/'+u;}
function setBrandText(el,vi,zh){if(!el)return;if(vi!=null)el.dataset.vi=vi;if(zh!=null)el.dataset.zh=zh;}
function replaceTeacherName(el,viName,zhName){if(!el)return;el.dataset.vi=el.dataset.vi.replace(/cô Ngọc/g,viName);el.dataset.zh=el.dataset.zh.replace(/明玉老师/g,zhName);}
async function loadTeacherBranding(){
  teacherSlug=currentTeacherSlug();
  try{sessionStorage.setItem('ntc-teacher-slug',teacherSlug);}catch{}
  if(!window.supabase||!window.NGOCTHUCAC_SUPABASE||!window.NGOCTHUCAC_SUPABASE.url)return;
  try{
    const sb=window.supabase.createClient(window.NGOCTHUCAC_SUPABASE.url,window.NGOCTHUCAC_SUPABASE.publishableKey);
    const br=await sb.rpc('ntc_get_teacher_branding',{p_slug:teacherSlug});
    if(br.error||!br.data||!br.data.length)return;
    teacherBrand=br.data[0];
    const b=teacherBrand,viName=b.display_name||'',zhName=b.display_name_zh||b.display_name||'';
    document.title=b.brand_name+' · Tiếng Trung cùng '+viName;
    const meta=document.querySelector('meta[name="description"]');
    if(meta)meta.content='Cùng '+viName+' học tiếng Trung. Thông tin giáo viên, lớp học trực tuyến và tư vấn lớp 1–1.';
    const brandEl=document.querySelector('.brand');
    if(brandEl&&brandEl.childNodes[0])brandEl.childNodes[0].textContent=b.brand_name;
    setBrandText(document.querySelector('.hero .eyebrow'),b.tagline_vi||('Cùng '+viName+' học tiếng Trung'),b.tagline_zh||('和'+zhName+'一起学中文'));
    const heroZalo=document.querySelector('.hero .actions a.btn.light');
    if(heroZalo){if(b.zalo_url)heroZalo.href=b.zalo_url;setBrandText(heroZalo,'Nhắn '+viName,'联系'+zhName+'老师');}
    const photo=document.querySelector('.photo');
    if(photo&&b.photo_url)photo.src=absBrandUrl(b.photo_url);
    // 没照片的老师不显示明玉的照片：把整个照片区藏起来（头像以后在品牌表单里传）。
    if(teacherSlug!=='co-ngoc'&&!b.photo_url){const pw=document.querySelector('.photo-wrap');if(pw)pw.style.display='none';}
    const tag=document.querySelector('.photo-tag b');
    if(tag)setBrandText(tag,viName+' · '+zhName,zhName+' · '+viName);
    const navAbout=document.querySelector('.navlinks a[href="#giaovien"]');
    const profile=document.getElementById('giaovien');
    if(teacherSlug!=='co-ngoc'){if(navAbout)navAbout.style.display='none';if(profile)profile.style.display='none';}
    else if(navAbout){setBrandText(navAbout,'Về '+viName,'认识'+zhName);}
    const supportLead=document.querySelector('.support .section-lead');
    if(supportLead){supportLead.dataset.vi=supportLead.dataset.vi.replace(/Ngọc Thư Các/g,b.brand_name);supportLead.dataset.zh=supportLead.dataset.zh.replace(/玉书阁/g,b.brand_name);}
    const contact=document.getElementById('lienhe');
    if(contact){
      const pp=contact.querySelector('p');if(pp)replaceTeacherName(pp,viName,zhName);
      const zb=contact.querySelector('a.btn');if(zb){if(b.zalo_url)zb.href=b.zalo_url;replaceTeacherName(zb,viName,zhName);}
      const fb=contact.querySelector('a.btn.light');if(fb&&b.facebook_url)fb.href=b.facebook_url;
      const zs=contact.querySelector('.subtle');
      if(zs){if(b.zalo_url){const num=b.zalo_url.replace(/\D/g,'');zs.textContent=num.length>=10?('Zalo · '+num.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3')):'Zalo';}else zs.style.display='none';}
    }
    const oneBtn=document.querySelector('#privateCourses a.btn');
    if(oneBtn&&b.zalo_url)oneBtn.href=b.zalo_url;
    const foot=document.querySelector('footer span');
    if(foot)foot.textContent='© '+b.brand_name+(teacherSlug==='co-ngoc'?' · 玉书阁':'');
    setLang(lang);
    const cl=await sb.rpc('ntc_get_teacher_classes',{p_slug:teacherSlug});
    if(!cl.error&&cl.data){teacherClasses=cl.data;teacherClassCodes=cl.data.map(c=>c.code);renderCourses();}
  }catch(e){/* 保持默认页面 */}
}
loadTeacherBranding();
const labels={vi:{teacher:'Giáo viên',schedule:'Lịch học',start:'Khai giảng',duration:'Số buổi',size:'Sĩ số',format:'Hình thức',input:'Đầu vào',goal:'Mục tiêu',fee:'Liên hệ tư vấn',consult:'Tư vấn đăng ký ↗',running:'Đang học',soon:'Sắp khai giảng',closed:'Ngừng nhận học viên',started:'Đã khai giảng'},zh:{teacher:'授课教师',schedule:'上课时间',start:'开课日期',duration:'课时安排',size:'班级人数',format:'授课方式',input:'入学水平',goal:'学习目标',fee:'咨询学费',consult:'咨询报名 ↗',running:'正在上课',soon:'即将开课',closed:'暂停招生',started:'已开课'}};
const classes=[{level:'HSK5 (2.0)',code:'YSG001',status:'upcoming',vi:{teacher:'Cô Nhạc · Thạc sĩ Giáo dục Hán ngữ, Trung Quốc',schedule:'Thứ 2 & Thứ 6 · 19:30–21:30',start:'23.11.2026',duration:'40 buổi + 2 buổi HSKK cao cấp',size:'Nhận thêm 1 học viên',input:'HSK4 (2.0)',fee:'5.x00.000 ₫'},zh:{teacher:'Nhạc老师 · 中国汉语教育硕士',schedule:'周一、周五 · 19:30–21:30',start:'2026年11月23日',duration:'40次课 + 2次HSKK高级课',size:'另招1名学员',input:'HSK4 (2.0)',fee:'5.x00.000 越南盾'}},{level:'HSK1 (3.0)',code:'YSG005',status:'ongoing',vi:{teacher:'Cô Ngọc',schedule:'Thứ 3 & Thứ 6 · 21:30–23:15',duration:'30 buổi · 105 phút/buổi',size:'6–8 học viên',goal:'Sơ cấp'},zh:{teacher:'明玉老师',schedule:'周二、周五 · 21:30–23:15',duration:'30次课 · 每次105分钟',size:'6–8人',goal:'初级'}},{level:'HSK2 (3.0)',code:'YSG004',status:'ongoing',closed:true,vi:{teacher:'Cô Ngọc',schedule:'Thứ 3 & Thứ 5 · 19:30–21:15',duration:'30 buổi · 105 phút/buổi'},zh:{teacher:'明玉老师',schedule:'周二、周四 · 19:30–21:15',duration:'30次课 · 每次105分钟'}},{level:'HSK3 (3.0)',code:'YSG003',status:'ongoing',closed:true,vi:{teacher:'Cô Ngọc',schedule:'Thứ 2 & Thứ 4 · 21:30–23:15',duration:'36 buổi · 105 phút/buổi',goal:'HSK3'},zh:{teacher:'明玉老师',schedule:'周一、周三 · 21:30–23:15',duration:'36次课 · 每次105分钟',goal:'HSK3'}}];
function visibleClasses(){const list=classes.filter(c=>c.status===tab);if(teacherClassCodes===null)return list;const mine=list.filter(c=>teacherClassCodes.includes(c.code));if(tab==='upcoming'){const known=new Set(classes.map(c=>c.code));for(const tc of teacherClasses){if(!known.has(tc.code))mine.push({level:tc.name||tc.code,code:tc.code,status:'upcoming',generic:true});}}return mine;}
function renderCourses(){const t=labels[lang];const list=visibleClasses();const zalo=(teacherBrand&&teacherBrand.zalo_url)||'https://zalo.me/0932856677';const box=document.getElementById('courses');if(!list.length){box.innerHTML=teacherClassCodes===null?'':`<p class="section-lead">${lang==='vi'?'Giáo viên chưa mở lớp nào. Liên hệ giáo viên để được tư vấn.':'该老师暂未开设课程，请联系老师咨询。'}</p>`;return;}box.innerHTML=list.map(c=>{if(c.generic){return `<article class="course featured"><div class="course-top"><div><span class="pill">${t.soon}</span><div class="level">${c.level}</div><div class="code">${c.code}</div></div></div><div class="course-body"><h3>${lang==='vi'?'Lớp mới · Liên hệ giáo viên để xếp lớp':'新班 · 联系老师安排课程'}</h3><div class="facts"><div><span>${t.teacher}</span><b>${teacherBrand?teacherBrand.display_name:''}</b></div><div><span>${t.format}</span><b>${lang==='vi'?'Online · VOOV':'VOOV线上教学'}</b></div></div><div class="course-footer"><div class="subtle">${t.fee}</div><a class="btn" href="${zalo}" target="_blank" rel="noopener">${t.consult}</a></div></div></article>`;}const d=c[lang];const facts={teacher:d.teacher,schedule:d.schedule,start:d.start||t.started,duration:d.duration,...(d.input?{input:d.input}:{}),...(d.goal?{goal:d.goal}:{}),...(d.size?{size:d.size}:{}),format:lang==='vi'?'Online · VOOV':'VOOV线上教学'};return `<article class="course ${c.status==='upcoming'?'featured':''}"><div class="course-top"><div>${c.status==='upcoming'?`<span class="pill">${t.soon}</span>`:''}<div class="level">${c.level}</div><div class="code">${c.code}</div></div>${c.status==='ongoing'?`<span class="pill">${t.running}</span>`:''}</div><div class="course-body"><h3>${c.closed?t.closed:d.size||t.running}</h3><div class="facts">${Object.entries(facts).map(([k,v])=>`<div><span>${t[k]}</span><b>${v}</b></div>`).join('')}</div><div class="course-footer"><div class="${d.fee?'price':'subtle'}">${d.fee||t.fee}</div>${!c.closed?`<a class="btn" href="${zalo}" target="_blank" rel="noopener">${t.consult}</a>`:''}</div></div></article>`;}).join('');}
function selectTab(value){tab=value;document.getElementById('privateCourses').hidden=tab!=='private';document.getElementById('courses').hidden=tab==='private';for(const v of ['upcoming','ongoing','private']){const b=document.getElementById(v+'Tab');b.classList.toggle('active',v===tab);b.setAttribute('aria-selected',String(v===tab));b.tabIndex=v===tab?0:-1;}document.getElementById('courses').setAttribute('aria-labelledby',tab+'Tab');renderCourses();}
function setLang(value){lang=value;document.documentElement.lang=value==='zh'?'zh-CN':'vi';document.querySelectorAll('[data-vi]').forEach(e=>e.textContent=e.dataset[value]);document.getElementById('vi').classList.toggle('active',value==='vi');document.getElementById('zh').classList.toggle('active',value==='zh');document.querySelector('.photo').alt=teacherSlug==='co-ngoc'?(value==='vi'?'Cô Ngọc trong trang phục tốt nghiệp':'身着毕业礼服的明玉老师'):(teacherBrand?teacherBrand.display_name:'');try{localStorage.setItem('ntc-language',value)}catch{}renderCourses();}
function showLogin(){try{sessionStorage.setItem('ntc-teacher-slug',teacherSlug)}catch{}window.location.href='/hoc-tap.html'}
document.querySelector('.tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tabs=['upcoming','ongoing','private'];selectTab(tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3]);document.getElementById(tab+'Tab').focus()}});let saved='vi';try{saved=localStorage.getItem('ntc-language')||'vi'}catch{}setLang(['vi','zh'].includes(saved)?saved:'vi');selectTab('upcoming');
</script></body></html>
